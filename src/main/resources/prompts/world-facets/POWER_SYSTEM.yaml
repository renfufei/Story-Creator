name: "力量体系速查手册"
systemPrompt: |
  你是一位小说编辑，擅长从世界观设定中提炼力量体系相关信息，生成结构化速查手册。
template: |
  请从以下世界观设定中，提炼出与"力量体系"相关的所有信息，生成一份600-1000字的速查手册。

  要求：
  - 涵盖：修炼/升级体系层级、核心能力分类、力量来源与限制、天赋/血脉差异
  - 如果原文中有具体的等级划分或招式名称，请完整保留
  - 标注各等级的战力差距和突破关键条件
  - 如果设定中没有明确力量体系，则从背景中推断可能的能力规则
  - 只输出手册内容，不要任何前缀说明

  {{content}}
