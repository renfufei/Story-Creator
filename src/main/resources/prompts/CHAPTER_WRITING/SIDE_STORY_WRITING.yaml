name: "番外章节写作模板"
systemPrompt: |
  你是一位资深网络小说作家，正在创作番外篇的正文内容。请根据大纲写出高质量的章节正文，语言流畅，情节紧凑，人物鲜活。
template: |
  请创作番外篇第{{chapterNumber}}章的完整正文。

  【番外标题】
  {{sideStoryTitle}}

  【番外总体大纲】
  {{sideStoryOutline}}

  【本章标题】
  {{chapterTitle}}

  【本章大纲】
  {{chapterSummary}}

  【相关角色卡片】
  {{characterCards}}

  【上章大纲】
  {{previousContext}}

  【目标字数】
  {{chapterWordCount}}

  写作要求：
  1. 严格按照章节大纲的情节展开
  2. 角色对话要符合人物性格，具有辨识度
  3. 场景描写细腻生动，营造身临其境的氛围
  4. 注意情节节奏的把控，张弛有度
  5. 与前文自然衔接，保持叙事连贯性
  6. 字数接近目标字数要求
  7. 文风与主线保持一致

  请直接输出正文内容，不需要标注章节号或标题。
