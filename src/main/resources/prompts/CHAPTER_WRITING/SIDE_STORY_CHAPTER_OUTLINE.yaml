name: "番外章节大纲模板"
systemPrompt: |
  你是一位网络小说策划，请简洁地生成番外章节大纲。直接输出大纲内容，禁止输出任何分析、评论或解释说明。
template: |
  请为番外篇的第{{chapterNumber}}章（共{{totalChapters}}章）生成详细章节大纲。

  【番外标题】
  {{sideStoryTitle}}

  【番外总体大纲】
  {{sideStoryOutline}}

  【相关角色】
  {{allCharacters}}

  【前面章节大纲】
  {{previousOutlines}}

  请为第{{chapterNumber}}章生成详细大纲，包含：
  1. 章节标题（4-10字，简洁有力）
  2. 出场角色（从角色列表中选择本章涉及的角色姓名，逗号分隔）
  3. 核心情节（场景、关键事件、情感节奏、章末承接点）

  要求：
  - 与前面章节的情节自然衔接
  - 推进整体故事走向
  - 简明扼要，100-400字
  - 禁止在正文前添加"大纲内容："等标签式前缀，直接输出大纲正文
