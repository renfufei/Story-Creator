<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑素材 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sc-page">

<script>
/* 引导数据：异步 fetch。
   原来这里是同步 XHR —— 浏览器停在 HTML 解析期等往返，JS 没开始跑、DOM 也没解析完，首屏白屏。
   现在先给空壳（表单区顶骨架），填充改到 await 之后（见页面末尾的 boot()）。 */
window.__MATERIAL_EDIT_DATA__ = {};
window.loadMaterialEditData = function () {
    if (!window.__MaterialEditPromise) {
        var url = '/settings/materials/' + encodeURIComponent(location.pathname.split('/')[3] || '') + '/edit-data';
        window.__MaterialEditPromise = fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (d) {
                window.__MATERIAL_EDIT_DATA__ = d || window.__MATERIAL_EDIT_DATA__;
                return window.__MATERIAL_EDIT_DATA__;
            })
            .catch(function (e) {
                console.error('__MATERIAL_EDIT_DATA__ bootstrap failed: ' + (e && e.message ? e.message : e));
                return window.__MATERIAL_EDIT_DATA__;
            });
    }
    return window.__MaterialEditPromise;
};
</script>

<header id="site-nav"></header>

<main class="sc-main container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">编辑素材</h2>
        <a href="/settings/materials" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回列表
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- 引导数据还在路上：先出骨架（原来同步 XHR 会让表单先空一片） -->
            <div id="bootSkel" class="sc-skel-row">
                <div class="row g-3 mb-3">
                    <div class="col-md-5"><div class="sc-skel sc-skel-line" style="width: 40%;"></div></div>
                    <div class="col-md-3"><div class="sc-skel sc-skel-line" style="width: 55%;"></div></div>
                    <div class="col-md-4"><div class="sc-skel sc-skel-line" style="width: 45%;"></div></div>
                </div>
                <div class="sc-skel sc-skel-line"></div>
                <div class="sc-skel sc-skel-line"></div>
                <div class="sc-skel sc-skel-line w-75"></div>
                <div class="sc-skel sc-skel-line w-50"></div>
            </div>
            <form id="editForm" method="post" style="display:none">
                <div class="row g-3 mb-3">
                    <div class="col-md-5">
                        <label class="form-label">名称</label>
                        <input type="text" class="form-control" name="name" id="fName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">分类</label>
                        <select class="form-select" name="category" id="fCategory" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">来源提示</label>
                        <input type="text" class="form-control" name="sourceHint" id="fSourceHint">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">素材内容</label>
                    <textarea class="form-control" name="content" id="fContent" rows="12"></textarea>
                </div>
                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
                <a href="/settings/materials" class="btn btn-sm btn-outline-secondary"><i class="bi bi-x-lg"></i> 取消</a>
            </form>
        </div>
    </div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
    'use strict';
    var d = window.__MATERIAL_EDIT_DATA__ || {};
    var editForm = document.getElementById('editForm');

    /** 引导数据是异步的：await 之后填表单，最后才收骨架并露出表单 */
    async function boot() {
        try {
            d = (typeof window.loadMaterialEditData === 'function')
                ? await window.loadMaterialEditData()
                : (window.__MATERIAL_EDIT_DATA__ || {});
            if (d.id != null) {
                editForm.setAttribute('action', '/settings/materials/' + d.id + '/update');
            }
            document.getElementById('fName').value = d.name || '';
            document.getElementById('fSourceHint').value = d.sourceHint || '';
            document.getElementById('fContent').value = d.content || '';
            document.getElementById('fCategory').innerHTML = (d.categories || []).map(function (c) {
                return '<option value="' + SC.escape(c.name) + '"' + (c.name === d.category ? ' selected' : '') + '>' +
                    SC.escape(c.displayName) + '</option>';
            }).join('');
        } finally {
            // ★ 填完才露表单：先露的话用户会看到空表单闪一下
            var skel = document.getElementById('bootSkel');
            if (skel) skel.remove();
            editForm.style.display = '';
        }
    }

    boot();
})();
</script>
</body>
</html>
