<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逆向工程执行 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="sc-page" data-nav="import">

<script>
/* 引导数据：同步 XHR，确保 reverseProgress() 构造时已就绪。
   按项目 id 解析最近一次 TXT 导入 job（见 ReversePageController#data）。 */
window.__REVERSE_DATA__ = (function () {
    var projectId = (location.pathname.match(/\/projects\/(\d+)/) || [])[1];
    var d = { error: '无效的项目地址' };
    if (projectId) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/projects/' + projectId + '/reverse/data', false);
            xhr.send();
            d = JSON.parse(xhr.responseText || '{}');
        } catch (e) { console.error('__REVERSE_DATA__ load failed', e); d = { error: '引导数据加载失败' }; }
    }
    return d;
})();
</script>

<header id="site-nav"></header>

<main class="sc-main container py-4">
<div x-data="reverseProgress()">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-arrow-up-right-circle"></i> 逆向工程 · 执行监控</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/import/txt"><i class="bi bi-file-earmark-text"></i> 导入 &amp; 分割</a>
            <a class="btn btn-outline-secondary btn-sm" x-show="projectId" :href="'/projects/' + projectId"><i class="bi bi-folder"></i> 项目详情</a>
        </div>
    </div>
    <div class="text-muted small mb-4" x-show="jobTitle">
        <span x-text="'《' + jobTitle + '》'"></span>（关闭页面不影响执行，随时可回到本页查看进度）
    </div>

    <!-- 引导数据加载失败：项目不存在 / 没有关联导入任务 -->
    <div class="alert alert-warning" x-show="bootError" x-cloak>
        <i class="bi bi-exclamation-triangle"></i> <span x-text="bootError"></span>
        <div class="mt-2"><a href="/import/txt" class="btn btn-sm btn-outline-primary">去导入 TXT</a></div>
    </div>

    <div x-show="!bootError" x-cloak>
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>执行状态</strong>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge" :class="phaseBadgeClass"
                          x-text="phaseText + (progressText ? ' ' + progressText : '')"></span>
                    <!-- 运行中 → 停止；未运行且未全部完成 → 开始 / 继续（沿用 job 里保存的选项） -->
                    <button class="btn btn-sm btn-outline-danger" @click="stopReverse()"
                            x-show="active" x-cloak>
                        <i class="bi bi-stop-fill"></i> 停止
                    </button>
                    <button class="btn btn-sm btn-primary" @click="startReverse()"
                            x-show="!active && !allCompleted" :disabled="starting" x-cloak>
                        <i class="bi bi-play-fill"></i> <span x-text="startButtonText"></span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" @click="refreshPlan()" :disabled="active">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                </div>
            </div>
            <div class="card-body">
                <!-- Phase Progress：状态来自服务端扫描（COMPLETED / PARTIAL / RUNNING / SKIPPED） -->
                <div class="d-flex justify-content-between mb-3">
                    <template x-for="p in phases" :key="p.phase">
                        <div class="text-center flex-fill">
                            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-1"
                                 :class="phaseCircleClass(p)"
                                 style="width:30px;height:30px;font-size:12px;">
                                <i class="bi" :class="phaseCircleIcon(p)"></i>
                            </div>
                            <div style="font-size:11px;" x-text="p.label"></div>
                            <div style="font-size:10px;" class="text-muted"
                                 x-text="p.runnable ? (p.completedUnits + '/' + p.totalUnits) : '跳过'"></div>
                        </div>
                    </template>
                </div>

                <!-- 实时产出（阶段 1/2 的条目 + 阶段 3 的流式文本；重开页面时由 replay-buffer 恢复） -->
                <div class="border rounded p-3 bg-dark text-light font-monospace"
                     style="height:380px;overflow-y:auto;font-size:12px;white-space:pre-wrap;"
                     x-ref="output" id="reOutput" x-text="output" x-show="active || output">
                </div>
                <div class="text-muted small mt-2" x-show="!active && !output">
                    <i class="bi bi-info-circle"></i>
                    <span x-text="plan && plan.completedUnits > 0 ? '任务未在运行。已完成的产出可在工作流各步骤页查看；点击上方「继续执行」可接着跑完剩余部分。' : '任务尚未开始，点击上方「开始逆向工程」即可启动（沿用「逆向选项」页保存的选项）。'"></span>
                </div>

                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-muted small" x-show="!active && interrupted">
                            <i class="bi bi-info-circle"></i>
                            上次执行被中断，点击上方「继续执行」可接着完成剩余部分（已完成进度保留）
                        </span>
                    </div>
                    <div>
                        <a class="btn btn-outline-primary btn-sm me-2" x-show="!active"
                           :href="'/projects/' + projectId + '/reverse/options'">
                            <i class="bi bi-arrow-left"></i> 逆向选项
                        </a>
                        <a :href="'/projects/' + projectId + '/workflow/world-building'" class="btn btn-success btn-sm">
                            <i class="bi bi-arrow-right"></i> 进入项目创作
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/reverse.js"></script>
<script src="/vendor/alpinejs/cdn.min.js" defer></script>
</body>
</html>
