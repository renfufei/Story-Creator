<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>词语匹配 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        [x-cloak] { display: none !important; }

        /* ==================== 近义词 / 反义词匹配 ====================
           与「英语单词匹配」「成语填空」同一套交互骨架：左列题面、右列候选，
           点一边再点另一边即配对。差别只有两点：
             1. 左列是**词**（1~4 字），不是拆了字的成语，所以候选用宽一点的词块；
             2. 配对成功后在卡片右侧就地显示「辨析」，把「对了」变成「懂了」。

           两个模块共用这一张页：模式由 location.pathname 判断（/learn/antonym-match ⇒ 反义词），
           只有强调色与文案不同。拆成两页等于把 800 行 JS 复制一份，改一处要记得改两处。

           配色沿用站内约定：绿=答对、红=答错；强调色按模式切换
           （近义=青绿 teal，反义=玫红 rose），两模块一眼能分开。 */
        .wr-root {
            --wr-ink: #2b3138;
            --wr-muted: #8a929c;
            --wr-line: #e6e9ee;
            --wr-surface: #ffffff;
            --wr-sunken: #f7f9fb;
            --wr-accent: #0d9488;       /* 近义词：青绿 */
            --wr-accent-deep: #0f766e;
            --wr-accent-soft: #effaf8;
            --wr-accent-line: #b7e6df;
            --wr-accent-shadow: rgba(13, 148, 136, .26);
            --wr-ok: #2f9e63;
            --wr-ok-bg: #eaf7f0;
            --wr-ok-line: #a9dcc2;
            --wr-ok-ink: #1c6b45;
            --wr-wrong: #d92d20;
            --wr-wrong-bg: #fdeceb;
            --wr-wrong-line: #f4b9b4;
            /* 设置弹层（.lt-* 在 app.css，三页共用）的主题色注入点：
               近义词青绿、反义词玫红，在这里跟随 --wr-accent 走 */
            --lt-accent: var(--wr-accent);
            --lt-accent-deep: var(--wr-accent-deep);
            --lt-accent-soft: var(--wr-accent-soft);
            --wr-radius: .8rem;
        }

        /* 反义词模式：同一套变量换色，CSS 其余部分一行都不用改 */
        .wr-root.mode-antonym {
            --wr-accent: #e11d48;
            --wr-accent-deep: #be123c;
            --wr-accent-soft: #fff1f4;
            --wr-accent-line: #f9c6d2;
            --wr-accent-shadow: rgba(225, 29, 72, .24);
        }

        .wr-toolbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: .75rem;
            flex-wrap: wrap;
            margin-bottom: .75rem;
        }

        .wr-toolbar-title {
            display: flex;
            align-items: center;
            gap: .55rem;
            min-width: 0;
        }

        .wr-toolbar-sub {
            font-size: .8rem;
            color: var(--wr-muted);
            margin-top: .15rem;
        }

        .wr-toolbar-actions {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
        }

        /* ---------- 学段页签 ---------- */
        .wr-stages {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: .5rem;
            padding: .35rem;
            background: var(--wr-sunken);
            border: 1px solid var(--wr-line);
            border-radius: .75rem;
            margin-bottom: .85rem;
        }

        .wr-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            padding: .5rem .6rem .65rem;
            border: 1px solid transparent;
            border-radius: .55rem;
            background: transparent;
            color: var(--wr-ink);
            font-size: .95rem;
            line-height: 1.1;
            transition: background-color .15s ease, border-color .15s ease, color .15s ease;
        }

        .wr-stage:hover { background: #fff; border-color: var(--wr-line); }

        .wr-stage.is-on {
            background: #fff;
            border-color: var(--wr-accent-line);
            color: var(--wr-accent-deep);
            box-shadow: 0 1px 2px rgba(24, 39, 61, .06);
        }

        .wr-stage-label { font-weight: 600; }
        .wr-stage-grade { font-size: .72rem; color: var(--wr-muted); }
        .wr-stage.is-on .wr-stage-grade { color: var(--wr-accent-deep); opacity: .75; }
        .wr-stage-num { font-size: .72rem; color: var(--wr-muted); font-variant-numeric: tabular-nums; }

        .wr-stage-bar {
            position: absolute;
            left: .55rem;
            right: .55rem;
            bottom: .22rem;
            height: 2px;
            border-radius: 2px;
            background: #e9edf2;
            overflow: hidden;
        }

        .wr-stage-bar > i {
            display: block;
            height: 100%;
            background: var(--wr-ok);
            border-radius: 2px;
            transition: width .25s ease;
        }

        .wr-stage.is-on .wr-stage-bar > i { background: var(--wr-accent); }

        /* ---------- HUD ---------- */
        .wr-hud {
            display: flex;
            align-items: center;
            gap: .7rem;
            margin-bottom: .55rem;
            font-size: .8rem;
            color: var(--wr-muted);
        }

        .wr-hud b { color: var(--wr-ink); font-variant-numeric: tabular-nums; }

        .wr-progress {
            flex: 1 1 auto;
            display: flex;
            gap: 3px;
            min-width: 0;
        }

        .wr-seg {
            flex: 1 1 0;
            height: 5px;
            border-radius: 3px;
            background: #e9edf2;
            transition: background-color .2s ease;
        }

        .wr-seg.is-done { background: var(--wr-ok); }
        .wr-seg.is-now { background: var(--wr-accent); }

        .wr-hud-right {
            display: flex;
            align-items: center;
            gap: .6rem;
            flex: 0 0 auto;
        }

        .wr-clock { font-variant-numeric: tabular-nums; }
        .wr-counter b { font-size: .95rem; }

        /* ---------- 标题行 ---------- */
        .wr-titlebar {
            position: relative;
            display: flex;
            align-items: center;
            gap: .55rem;
            margin-bottom: .6rem;
            min-height: 1.9rem;
        }

        .wr-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--wr-ink);
        }

        .wr-theme-badge {
            font-size: .72rem;
            padding: .12rem .45rem;
            border-radius: 999px;
            background: var(--wr-accent-soft);
            border: 1px solid var(--wr-accent-line);
            color: var(--wr-accent-deep);
        }

        /* 提示浮层：绝对定位、不占高度，别写成 inset:0 盖掉左边的主题名 */
        .wr-flash {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            padding: .18rem .7rem;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 600;
            animation: wr-flash-in .18s ease;
        }

        .wr-flash.is-ok { background: var(--wr-ok-bg); color: var(--wr-ok-ink); }
        .wr-flash.is-bad { background: var(--wr-wrong-bg); color: var(--wr-wrong); }
        .wr-flash.is-win { background: var(--wr-accent-soft); color: var(--wr-accent-deep); }

        @keyframes wr-flash-in {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------- 棋盘 ---------- */
        .wr-board {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(17rem, 21rem);
            gap: .9rem;
            align-items: start;
        }

        .wr-col-word {
            display: flex;
            flex-direction: column;
            gap: .55rem;
            min-width: 0;
        }

        .wr-item {
            display: flex;
            align-items: center;
            gap: .45rem;
            padding: .5rem .65rem;
            background: var(--wr-surface);
            border: 1px solid var(--wr-line);
            border-radius: var(--wr-radius);
            transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
        }

        .wr-item:not(.is-done) { cursor: pointer; }

        .wr-item.is-sel {
            border-color: var(--wr-accent);
            background: var(--wr-accent-soft);
            box-shadow: 0 0 0 3px var(--wr-accent-shadow);
        }

        .wr-item.is-done {
            border-color: var(--wr-ok-line);
            background: var(--wr-ok-bg);
        }

        .wr-item.is-wrong {
            border-color: var(--wr-wrong-line);
            background: var(--wr-wrong-bg);
            animation: wr-shake .34s ease;
        }

        @keyframes wr-shake {
            0%, 100% { transform: translateX(0); }
            22% { transform: translateX(-5px); }
            46% { transform: translateX(4px); }
            70% { transform: translateX(-2px); }
        }

        /* 题面固定最小宽度：一关里既有「大」也有「家喻户晓」，不定宽的话
           箭头和答案会一行一个位置，读起来像没对齐的表 */
        .wr-word {
            flex: 0 0 auto;
            min-width: 5rem;
            font-size: 1.16rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--wr-ink);
            font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
            letter-spacing: .02em;
        }

        .wr-eq {
            flex: 0 0 auto;
            font-size: .78rem;
            color: var(--wr-ok);
            line-height: 1;
        }

        .wr-answer {
            flex: 0 0 auto;
            min-width: 4.9rem;
            font-size: 1.06rem;
            font-weight: 600;
            color: var(--wr-ok-ink);
            font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
        }

        .wr-note {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-left: .2rem;
            font-size: .78rem;
            line-height: 1.4;
            color: var(--wr-muted);
            text-align: left;
        }

        .wr-item.is-done .wr-note { color: var(--wr-ok-ink); }

        .wr-speak,
        .wr-tick {
            width: 1.85rem;
            height: 1.85rem;
            border: 0;
            border-radius: .45rem;
            background: transparent;
            color: var(--wr-muted);
            font-size: .95rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .wr-speak:hover { background: var(--wr-sunken); color: var(--wr-accent-deep); }
        .wr-tick { color: var(--wr-ok); font-size: 1rem; }

        /* ---------- 右列候选词 ---------- */
        .wr-col-pick {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: .5rem;
            padding: .55rem;
            background: var(--wr-sunken);
            border: 1px solid var(--wr-line);
            border-radius: var(--wr-radius);
        }

        .wr-tile {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 2.9rem;
            padding: .3rem .35rem;
            border: 1px solid #dfe4ea;
            border-radius: .6rem;
            background: #fff;
            color: var(--wr-ink);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.25;
            font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
            box-shadow: 0 1px 2px rgba(24, 39, 61, .05);
            transition: transform .12s ease, border-color .15s ease, background-color .15s ease, color .15s ease;
        }

        .wr-tile:hover { border-color: var(--wr-accent); transform: translateY(-1px); }
        .wr-tile:active { transform: translateY(0) scale(.97); }

        .wr-tile.is-sel {
            background: var(--wr-accent);
            border-color: var(--wr-accent);
            color: #fff;
            box-shadow: 0 3px 10px var(--wr-accent-shadow);
        }

        /* 已配对：保留浅色残影而不是消失 —— 突然少一块会让右列塌掉、左列跟着跳位 */
        .wr-tile.is-used {
            background: var(--wr-ok-bg);
            border-color: var(--wr-ok-line);
            color: var(--wr-ok-line);
            box-shadow: none;
            cursor: default;
            transform: none;
        }

        .wr-tile.is-wrong {
            border-color: var(--wr-wrong-line);
            background: var(--wr-wrong-bg);
            color: var(--wr-wrong);
            animation: wr-shake .34s ease;
        }

        .wr-col-pick-empty {
            grid-column: 1 / -1;
            padding: .8rem .5rem;
            text-align: center;
            font-size: .82rem;
            color: var(--wr-ok-ink);
        }

        /* ---------- 提示条 ---------- */
        .wr-tip {
            display: flex;
            align-items: flex-start;
            gap: .45rem;
            margin-top: .75rem;
            padding: .55rem .75rem;
            min-height: 2.5rem;
            border: 1px solid var(--wr-line);
            border-radius: .6rem;
            background: var(--wr-sunken);
            color: var(--wr-muted);
            font-size: .82rem;
            line-height: 1.5;
        }

        .wr-tip.is-ok { background: var(--wr-ok-bg); border-color: var(--wr-ok-line); color: var(--wr-ok-ink); }
        .wr-tip.is-bad { background: var(--wr-wrong-bg); border-color: var(--wr-wrong-line); color: var(--wr-wrong); }
        .wr-tip .bi { flex: 0 0 auto; margin-top: .12rem; }
        .wr-tip-text { min-width: 0; }

        /* ---------- 完成页 ---------- */
        .wr-done {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            gap: .6rem;
            padding: .9rem;
            background: #fff;   /* 必须不透明，否则下面卡片的字会透上来 */
            border: 1px solid var(--wr-ok-line);
            border-radius: var(--wr-radius);
            box-shadow: 0 8px 24px rgba(24, 39, 61, .1);
            /* 整体不滚：滚动交给 .wr-done-list，按钮必须始终露在外面 */
            overflow: hidden;
        }

        .wr-done-head {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
        }

        .wr-done-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--wr-ok-ink);
        }

        .wr-done-stat { font-size: .8rem; color: var(--wr-muted); }

        .wr-done-list {
            display: flex;
            flex-direction: column;
            gap: .35rem;
            margin: 0;
            padding: 0 .15rem 0 0;
            list-style: none;
            /* flex:1 + min-height:0 才会真的收缩并长出滚动条；
               少了 min-height:0，flex 子项的 min-height:auto 会把按钮顶出面板 */
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .wr-done-list li {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: .15rem .5rem;
            padding: .3rem .45rem;
            border-radius: .45rem;
            background: var(--wr-sunken);
            font-size: .84rem;
            line-height: 1.5;
        }

        .wr-done-pair {
            display: flex;
            align-items: center;
            gap: .4rem;
            flex: 0 0 auto;
            font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
            font-weight: 600;
            color: var(--wr-ink);
            letter-spacing: .02em;
        }

        .wr-done-pair .bi { font-size: .72rem; color: var(--wr-ok); }

        /* 辨析与词对同一行（词对固定、辨析吃掉剩余宽度）：
           写成上下两行时每条要 ~55px，6 条就超出 6 张题面撑起来的棋盘高度，
           通关页一打开只能看到 4 条 —— 看起来像「内容被截断」。 */
        .wr-done-note {
            flex: 1 1 12rem;
            min-width: 0;
            color: var(--wr-muted);
        }

        .wr-done-actions {
            display: flex;
            gap: .5rem;
            flex: 0 0 auto;
            padding-top: .3rem;
        }

        .wr-done-actions .btn { flex: 1 1 auto; }

        /* ---------- 关卡选择弹层 ---------- */
        .wr-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(24, 39, 61, .42);
        }

        .wr-modal {
            width: 100%;
            max-width: 34rem;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: .9rem;
            box-shadow: 0 18px 48px rgba(24, 39, 61, .24);
            overflow: hidden;
        }

        .wr-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            padding: .85rem 1rem;
            border-bottom: 1px solid var(--wr-line);
        }

        .wr-modal-head h5 {
            margin: 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .wr-modal-body { padding: .85rem 1rem; overflow: auto; }

        .wr-modal-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            padding: .7rem 1rem;
            border-top: 1px solid var(--wr-line);
            font-size: .78rem;
            color: var(--wr-muted);
        }

        .wr-level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(6.8rem, 1fr));
            gap: .45rem;
        }

        .wr-level {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: .1rem;
            padding: .45rem .55rem;
            border: 1px solid var(--wr-line);
            border-radius: .5rem;
            background: #fff;
            text-align: left;
            transition: border-color .15s ease, background-color .15s ease;
        }

        .wr-level:hover { border-color: var(--wr-accent-line); background: var(--wr-accent-soft); }
        .wr-level.is-now { border-color: var(--wr-accent); background: var(--wr-accent-soft); }
        .wr-level.is-done { border-color: var(--wr-ok-line); background: var(--wr-ok-bg); }

        .wr-level-no { font-size: .74rem; color: var(--wr-muted); font-variant-numeric: tabular-nums; }

        .wr-level-theme {
            font-size: .84rem;
            font-weight: 600;
            color: var(--wr-ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .wr-level-tag { font-size: .7rem; color: var(--wr-ok-ink); }

        .wr-sound-off { opacity: .6; }

        /* ---------- 移动端：候选词钉在视口底部 ----------
           单列之后候选词会掉到 6 行题面下面，得来回滚动才能点。
           用 fixed（不是 sticky —— sticky 会把整块题板顶进正文中间盖住第 5、6 条），
           容器补 padding-bottom 让最后一条滚得出来，通关时收起题板。

           提示条（辨析）用 order 挪到标题下面，否则被固定题板压住。 */
        @media (max-width: 767.98px) {
            .wr-play {
                display: flex;
                flex-direction: column;
                padding-bottom: 8.6rem;
            }

            .wr-titlebar { order: 0; }

            .wr-tip { order: 1; margin: 0 0 .6rem; }

            .wr-board { order: 2; grid-template-columns: minmax(0, 1fr); gap: .7rem; }

            .wr-col-pick {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 20;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: .4rem;
                padding: .5rem .75rem calc(.5rem + env(safe-area-inset-bottom, 0px));
                background: #fff;
                border: 0;
                border-top: 1px solid var(--wr-line);
                border-radius: 0;
                box-shadow: 0 -6px 18px rgba(24, 39, 61, .1);
            }

            .wr-play.is-finished .wr-col-pick { display: none; }

            .wr-tile { min-height: 2.5rem; font-size: .95rem; padding: .25rem .2rem; }
            .wr-item { padding: .45rem .5rem; }
            .wr-word { min-width: 4.4rem; font-size: 1.08rem; }
            /* 窄屏不预留答案宽度（否则小喇叭被顶到卡片中间），改用 margin-left:auto 把工具组
               钉在右边：答案出现时只吃中间的空隙，小喇叭位置不动 */
            .wr-answer { min-width: 0; font-size: 1rem; }
            .wr-item-tools { margin-left: auto; }
            .wr-note { display: none; }   /* 窄屏放不下一行辨析，靠标题下的提示条 */

            /* 手机上每省 10px 就能多露一条题 */
            .wr-root .sc-page-title { font-size: 1.2rem; }
            .wr-toolbar-sub { display: none; }
            .wr-toolbar { margin-bottom: .5rem; }
            .wr-stages { margin-bottom: .55rem; }
            .wr-stage-grade { display: none; }
        }

        /* 320px：只收间隙，一个字都不藏 */
        @media (max-width: 360px) {
            .wr-stages { gap: .3rem; padding: .25rem; }
            .wr-stage { padding: .45rem .3rem .6rem; gap: .3rem; }

<script>
/* ==================== 模式判定 + 引导数据 ====================
   模式看路径（/learn/antonym-match ⇒ 反义词），不依赖查询串：
   这两个路由是服务端 forward 到同一张静态页的，浏览器地址栏里没有 ?mode=。

   词库一次取完（3 学段 × 30 关 × 6 对 = 540 对，gzip 三十几 KB），
   切学段 / 切关卡零请求 —— 与单词匹配、成语填空同一做法。

   ★ 2026-10-20 改成异步 fetch：原来是同步 XHR，浏览器停在 HTML 解析期等这一趟，
     首屏白屏。现在先给空壳（见模板里的 x-show="booting" 骨架），数据到了再铺内容。 */
var WR_MODE = /\/learn\/antonym-match/.test(window.location.pathname) ? 'antonym' : 'synonym';
var WR_LABEL = WR_MODE === 'antonym' ? '反义词' : '近义词';

window.__RELATION_DATA__ = { mode: WR_MODE, label: WR_LABEL, stages: [], levels: {} };
window.loadRelationData = function () {
    if (!window.__relationDataPromise) {
        window.__relationDataPromise = fetch('/learn/word-relation/data?mode=' + WR_MODE,
            { headers: { 'Accept': 'application/json' } })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (d) {
                /* ★ 合并而非替换：导出（exportOptions）抓的是同一个对象引用 */
                Object.assign(window.__RELATION_DATA__, d || {});
                return window.__RELATION_DATA__;
            })
            .catch(function (e) {
                console.error('__RELATION_DATA__ bootstrap failed: ' + (e && e.message ? e.message : e));
                return window.__RELATION_DATA__;
            });
    }
    return window.__relationDataPromise;
};
</script>

<script>
/* ==================== 近义词 / 反义词匹配 ====================
   规则：
     1. 一关 6 对词（4~8 对自适应），左列题面、右列候选答案；
     2. 点左边一个词 → 再点右边一个词（反过来也行），配对成功两边变绿、就地显示辨析；
     3. 点错抖一下、记一次失误，选中状态保留在右边（错的可能是另一题的答案）。

   ★ 为什么词库每对都带「语义组」：如果一关里出现两对互为近义词的词，
     右列就会有两个都能配上的答案，玩家无从判断。词库加载时由后端强校验
     「同一关同一语义组最多一对」，前端拿到的每关数据必然是唯一解。

   ★ 右列顺序用种子打乱（学段#关卡），同一关反复进来顺序一致，可以「记住」；
     「重做本关」换成真随机，避免照位置通关。

   进度存 localStorage：{ 学段id: { done: [关卡序号], current: 当前关 } }，
   两个模块各用一份（key 带模式后缀）。 */

/* ---------- 无障碍按钮的 ARIA 文案需要 label，这里先算好给模板用 ---------- */
function relationApp() {
    return {
        /* ---------- 数据 ---------- */
        mode: WR_MODE,
        label: WR_LABEL,
        title: '',
        stages: [],
        levelsByStage: {},
        stageId: '',
        levelIndex: 0,

        /* ---------- 当前关卡运行态 ---------- */
        items: [],       // [{uid, word, match, note, done, wrong}]
        tiles: [],       // [{uid, word, itemUid, used, wrong}]
        selItem: null,
        selTile: null,
        finished: false,
        mistakes: 0,
        seconds: 0,
        timerId: null,
        flash: '',
        flashKind: 'ok',
        flashTimer: null,
        tipText: '',
        tipKind: '',
        tipTimer: null,

        /* ---------- UI ---------- */
        soundOn: true,
        pickerOpen: false,
        progress: {},
        booting: true,      // 引导数据还没到（骨架阶段）
        ready: false,

        /* ---------- 设置弹层 / 错题本 / 导出 ---------- */
        settingsOpen: false,
        wrongOpen: false,
        wrongItems: [],   // [{k, label, sub, ts}]，来自 LearnTools.wrongBook
        wrongStore: null,
        exporting: false,
        githubUrl: (window.LearnTools && LearnTools.github)
            || 'https://github.com/renfufei/Story-Creator',

        /* ==================== 生命周期 ==================== */

        init: function () {
            /* 引导数据是异步的：真正的铺场在 boot()（init 只留一个同步入口，
               免得 Alpine 作用域在 await 之后失效的坑） */
            return this.boot();
        },

        async boot() {
            try {
            var data = (typeof window.loadRelationData === 'function')
                ? await window.loadRelationData()
                : (window.__RELATION_DATA__ || {});
            this.mode = data.mode || WR_MODE;
            this.label = data.label || WR_LABEL;
            this.title = this.label + '匹配';
            document.title = this.title + ' - AI故事创作';

            this.stages = data.stages || [];
            this.levelsByStage = data.levels || {};
            this.progress = this.readProgress();
            this.soundOn = this.readSound();
            // 错题本：两个模式各存一份（近义词的错题不该出现在反义词页）
            if (window.LearnTools) {
                this.wrongStore = LearnTools.wrongBook('word_relation_wrong_' + this.mode);
                this.wrongItems = this.wrongStore.all();
            }
            this.ready = true;

            if (!this.stages.length) return;

            // 恢复上次停在哪儿：优先「上一次打开的学段」，其次「第一个还没练完的学段」
            var first = this.stages[0].id;
            var last = this.readLastStage();
            if (last && this.levelsByStage[last] && this.levelsByStage[last].length) {
                first = last;
            } else {
                for (var i = 0; i < this.stages.length; i++) {
                    var s = this.stages[i];
                    if (this.stageDone(s.id) < s.levelCount) { first = s.id; break; }
                }
            }
            this.stageId = first;
            var saved = (this.progress[first] && this.progress[first].current) || 0;
            this.loadLevel(saved > this.levelCount - 1 ? 0 : saved);
            } finally {
                /* ★ 内容铺完再收骨架：先收会让「还没有关卡」空态闪一下 */
                await this.$nextTick();
                this.booting = false;
            }
        },

        /* ==================== 派生状态 ==================== */

        get levels() {
            return this.levelsByStage[this.stageId] || [];
        },

        get levelCount() {
            return this.levels.length;
        },

        get currentLevel() {
            return this.levels[this.levelIndex] || null;
        },

        get stageInfo() {
            for (var i = 0; i < this.stages.length; i++) {
                if (this.stages[i].id === this.stageId) return this.stages[i];
            }
            return null;
        },

        get stageLabel() {
            return this.stageInfo ? this.stageInfo.label : '';
        },

        get stageSource() {
            return this.stageInfo ? this.stageInfo.source : '';
        },

        get matchedCount() {
            var n = 0;
            this.items.forEach(function (it) { if (it.done) n++; });
            return n;
        },

        get remaining() {
            var n = 0;
            this.tiles.forEach(function (t) { if (!t.used) n++; });
            return n;
        },

        get wrongCount() {
            return this.wrongItems.length;
        },

        /* 整库词对数（导出条目里报给用户看，不写死数字，词库扩了自动跟着变） */
        get totalPairs() {
            var m = this.levelsByStage, n = 0;
            Object.keys(m || {}).forEach(function (k) {
                (m[k] || []).forEach(function (lv) { n += (lv.items || []).length; });
            });
            return n;
        },

        get hasNext() {
            return this.levelIndex < this.levelCount - 1 || this.hasNextStage();
        },

        get nextLabel() {
            if (this.levelIndex < this.levelCount - 1) return '下一关';
            return this.hasNextStage() ? '下一学段' : '已全部练完';
        },

        get clock() {
            return this.fmtClock(this.seconds);
        },

        fmtClock: function (sec) {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        },

        /* ==================== 关卡装载 ==================== */

        loadLevel: function (index) {
            var levels = this.levels;
            if (!levels.length) return;
            index = Math.max(0, Math.min(index, levels.length - 1));
            this.levelIndex = index;

            var lv = levels[index];
            this.items = lv.items.map(function (raw, i) {
                return {
                    uid: 'i' + i,
                    word: raw.word,
                    match: raw.match,
                    note: raw.note || '',
                    done: false,
                    wrong: false
                };
            });

            // 右列：只放答案词，打乱后平铺（顺序与左列无关，避免照位置对号入座）。
            // 每次进关重新洗（Math.random），刷新一次候选位置就换一遍，别让人背位置。
            var tileList = this.items.map(function (it) {
                return { uid: 't-' + it.uid, word: it.match, itemUid: it.uid, used: false, wrong: false };
            });
            this.tiles = this.shuffle(tileList);

            this.selItem = null;
            this.selTile = null;
            this.finished = false;
            this.mistakes = 0;
            this.seconds = 0;
            this.startTimer();
            this.tipText = '先点左边的词，再点右边的' + this.label + '；反过来点也行。点小喇叭可以听读音。';
            this.tipKind = '';
            this.flash = '';

            this.saveProgress();
            this.writeLastStage();
        },

        startTimer: function () {
            var self = this;
            this.stopTimer();
            this.timerId = setInterval(function () {
                if (!self.finished) self.seconds++;
            }, 1000);
        },

        stopTimer: function () {
            if (this.timerId) {
                clearInterval(this.timerId);
                this.timerId = null;
            }
        },

        /* ==================== 交互 ==================== */

        pickStage: function (id) {
            if (id === this.stageId) return;
            if (!this.levelsByStage[id] || !this.levelsByStage[id].length) return;
            this.stageId = id;
            this.pickerOpen = false;
            var saved = (this.progress[id] && this.progress[id].current) || 0;
            this.loadLevel(Math.min(saved, this.levelCount - 1));
        },

        gotoLevel: function (index) {
            this.pickerOpen = false;
            this.loadLevel(index);
        },

        nextLevel: function () {
            if (this.levelIndex < this.levelCount - 1) {
                this.loadLevel(this.levelIndex + 1);
                return;
            }
            var idx = this.nextStageIndex();
            if (idx >= 0) {
                this.stageId = this.stages[idx].id;
                this.loadLevel(0);
            }
        },

        restartLevel: function () {
            // 重做：题面不变，右列换成真随机顺序 —— 上一遍是靠记住位置过去的
            this.loadLevel(this.levelIndex);
            this.tiles = this.shuffle(this.tiles.slice(), Math.random);
            this.tipText = '本关已重新打乱：右边的顺序变了，再练一遍。';
            this.tipKind = '';
        },

        pickItem: function (it) {
            if (it.done) return;
            // 再点一次当前选中的词 = 取消选择
            if (this.selItem && this.selItem.uid === it.uid) {
                this.selItem = null;
                return;
            }
            this.selItem = it;
            this.tipKind = '';
            if (this.selTile) this.tryMatch();
        },

        pickTile: function (t) {
            if (t.used) return;
            t.wrong = false;
            if (this.selTile && this.selTile.uid === t.uid) {
                this.selTile = null;
                return;
            }
            this.selTile = t;
            this.tipKind = '';
            if (this.selItem) this.tryMatch();
        },

        tryMatch: function () {
            var it = this.selItem;
            var tile = this.selTile;
            if (!it || !tile) return;

            if (it.match === tile.word) {
                it.done = true;
                it.wrong = false;
                tile.used = true;
                this.selItem = null;
                this.selTile = null;
                this.showTip(it.word + ' —— ' + it.match + '：' + it.note, 'ok');
                this.speak(it.word + '，' + it.match);
                this.showFlash(this.praise(), 'ok');
                this.checkFinished();
            } else {
                this.mistakes++;
                it.wrong = true;
                tile.wrong = true;
                this.selItem = null;
                this.showFlash('不对，再想想', 'bad');
                this.showTip('「' + tile.word + '」不是「' + it.word + '」的' + this.label
                    + '，换一个试试。', 'bad');
                this.recordWrong(it);
                var wrongItem = it;
                var wrongTile = tile;
                setTimeout(function () {
                    wrongItem.wrong = false;
                    wrongTile.wrong = false;
                }, 420);
            }
        },

        checkFinished: function () {
            if (this.matchedCount < this.items.length) return;
            this.finished = true;
            this.stopTimer();
            this.showFlash('本关完成，太棒了！', 'win');
            this.tipText = '本关 ' + this.items.length + ' 对全部配对了。下面是每对的辨析，读一遍再走。';
            this.tipKind = '';
            var d = this.progress[this.stageId] || (this.progress[this.stageId] = { done: [], current: 0 });
            if (d.done.indexOf(this.levelIndex) < 0) d.done.push(this.levelIndex);
            d.done.sort(function (a, b) { return a - b; });
            this.saveProgress();
        },

        praise: function () {
            var arr = ['对了！', '配上了！', '漂亮！', '就是它！'];
            return arr[Math.floor(Math.random() * arr.length)];
        },

        /* ==================== 提示 / 闪烁 ==================== */

        showTip: function (text, kind) {
            var self = this;
            this.tipText = text || '';
            this.tipKind = kind || '';
            if (this.tipTimer) clearTimeout(this.tipTimer);
            if (kind === 'bad') {
                this.tipTimer = setTimeout(function () { self.tipKind = ''; }, 1800);
            }
        },

        showFlash: function (text, kind) {
            var self = this;
            this.flash = text;
            this.flashKind = kind || 'ok';
            if (this.flashTimer) clearTimeout(this.flashTimer);
            this.flashTimer = setTimeout(function () { self.flash = ''; }, kind === 'win' ? 1600 : 900);
        },

        /* ==================== 样式判定 ==================== */

        isSelItem: function (it) {
            return !!this.selItem && this.selItem.uid === it.uid;
        },

        segClass: function (i) {
            if (this.isLevelDone(this.stageId, i)) return 'is-done';
            if (i === this.levelIndex) return 'is-now';
            return '';
        },

        /* ==================== 进度 ==================== */

        get keyName() {
            return 'word_relation_v1_' + this.mode;
        },

        get lastStageKey() {
            return 'word_relation_last_stage_' + this.mode;
        },

        get soundKey() {
            return 'word_relation_sound_' + this.mode;
        },

        readProgress: function () {
            try {
                var raw = localStorage.getItem(this.keyName);
                var obj = raw ? JSON.parse(raw) : {};
                return obj && typeof obj === 'object' ? obj : {};
            } catch (e) { return {}; }
        },

        saveProgress: function () {
            if (!this.progress[this.stageId]) this.progress[this.stageId] = { done: [], current: 0 };
            this.progress[this.stageId].current = this.levelIndex;
            try { localStorage.setItem(this.keyName, JSON.stringify(this.progress)); } catch (e) { /* 隐身模式忽略 */ }
        },

        resetStage: function () {
            delete this.progress[this.stageId];
            try { localStorage.setItem(this.keyName, JSON.stringify(this.progress)); } catch (e) { /* ignore */ }
            this.pickerOpen = false;
            this.loadLevel(0);
            this.showFlash('已清空本学段进度', 'win');
        },

        /* ==================== 错题本 ====================
           记录口径：哪一对词配错了就记哪一对（按 word>match 去重）。
           不做「答对自动移除」—— 它服务的是回头复习，不是待办清单。 */

        recordWrong: function (it) {
            if (!this.wrongStore || !it) return;
            this.wrongStore.add(this.mode + '|' + it.word + '>' + it.match,
                it.word + ' → ' + it.match, it.note);
            this.wrongItems = this.wrongStore.all();
        },

        /* 错题本里那条的朗读文本：k 形如 "synonym|高兴>快乐" */
        wrongSay: function (w) {
            var p = String((w && w.k) || '').split('|');
            if (p.length < 2) return (w && w.label) || '';
            return p[1].split('>').join('，');
        },

        openWrongBook: function () {
            if (this.wrongStore) this.wrongItems = this.wrongStore.all();
            this.wrongOpen = true;
        },

        closeWrongBook: function () {
            this.wrongOpen = false;
        },

        clearWrong: function () {
            if (this.wrongStore) this.wrongStore.clear();
            this.wrongItems = [];
        },

        /* ==================== 导出 / 重置 ==================== */

        /* 导出参数单独抽出来：探针直接拿这份参数复算产物，
           避免「按钮用的参数」和「被测的参数」各写一套、慢慢漂移。 */
        exportOptions: function () {
            return {
                dataVar: '__RELATION_DATA__',
                payload: window.__RELATION_DATA__ || {
                    mode: this.mode, label: this.label, stages: [], levels: {}
                },
                title: this.label + '匹配 · 人教版 小学 / 初中 / 高中',
                prefix: (this.mode === 'antonym' ? 'antonym-match' : 'synonym-match'),
                /* 引导脚本被整段替换，页面里这两个全局变量得在产物里重建：
                   单机件是 file:// 打开，靠 pathname 判断模式会落到近义词那一侧 */
                prelude: 'var WR_MODE = ' + JSON.stringify(this.mode) + ';'
                    + ' var WR_LABEL = ' + JSON.stringify(this.label) + ';'
            };
        },

        runExport: function () {
            var self = this;
            if (this.exporting) return;
            if (!window.LearnTools) {
                SC.toast.error('导出脚本没加载，请刷新页面重试');
                return;
            }
            this.exporting = true;
            LearnTools.exportPage(this.exportOptions()).then(function (res) {
                var bytes = LearnTools.download(res.html, res.filename);
                self.exporting = false;
                self.settingsOpen = false;
                SC.toast.success('已导出 ' + Math.round(bytes / 1024)
                    + ' KB，双击文件即可离线玩', 5000);
            }).catch(function (e) {
                console.error('[export] failed', e);
                self.exporting = false;
                SC.toast.error('导出失败：' + ((e && e.message) || e));
            });
        },

        resetAll: function () {
            var self = this;
            SC.confirm({
                title: '重置进度',
                message: '将清空「' + this.label + '匹配」全部学段的通关记录。\n错题本不受影响，需要单独清空。',
                confirmText: '重置',
                danger: true
            }).then(function (ok) {
                if (!ok) return;
                self.progress = {};
                try { localStorage.removeItem(self.keyName); } catch (e) { /* ignore */ }
                try { localStorage.removeItem(self.lastStageKey); } catch (e) { /* ignore */ }
                self.stageId = self.stages.length ? self.stages[0].id : self.stageId;
                self.loadLevel(0);
                self.showFlash('已重置全部进度', 'win');
                SC.toast.success('已重置全部进度');
            });
        },

        isLevelDone: function (stageId, idx) {
            var d = this.progress[stageId];
            return !!d && d.done.indexOf(idx) >= 0;
        },

        stageDone: function (stageId) {
            var d = this.progress[stageId];
            if (!d || !d.done) return 0;
            var s = null;
            for (var i = 0; i < this.stages.length; i++) if (this.stages[i].id === stageId) s = this.stages[i];
            if (!s) return d.done.length;
            return d.done.filter(function (i) { return i < s.levelCount; }).length;
        },

        stagePct: function (stageId) {
            var s = null;
            for (var i = 0; i < this.stages.length; i++) if (this.stages[i].id === stageId) s = this.stages[i];
            if (!s || !s.levelCount) return 0;
            return Math.round(this.stageDone(stageId) / s.levelCount * 100);
        },

        readLastStage: function () {
            try { return localStorage.getItem(this.lastStageKey) || ''; } catch (e) { return ''; }
        },

        writeLastStage: function () {
            try { localStorage.setItem(this.lastStageKey, this.stageId); } catch (e) { /* ignore */ }
        },

        hasNextStage: function () {
            return this.nextStageIndex() >= 0;
        },

        nextStageIndex: function () {
            for (var i = 0; i < this.stages.length; i++) {
                if (this.stages[i].id === this.stageId) {
                    return i + 1 < this.stages.length ? i + 1 : -1;
                }
            }
            return -1;
        },

        /* ==================== 朗读 ==================== */

        readSound: function () {
            try { return localStorage.getItem(this.soundKey) !== '0'; } catch (e) { return true; }
        },

        toggleSound: function () {
            this.soundOn = !this.soundOn;
            try { localStorage.setItem(this.soundKey, this.soundOn ? '1' : '0'); } catch (e) { /* ignore */ }
            if (!this.soundOn && window.speechSynthesis) {
                try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
            }
        },

        speakItem: function (it) {
            this.speak(it.done ? (it.word + '，' + it.match) : it.word);
        },

        /** 朗读：永不抛错、永不阻塞流程（不支持 / 无中文语音 / 被自动播放策略拦住都静默） */
        speak: function (text) {
            if (!this.soundOn || !text || !window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                u.rate = 0.92;
                u.onerror = function () { /* 静默 */ };
                window.speechSynthesis.speak(u);
            } catch (e) { /* 静默 */ }
        },

        /* ==================== 工具 ==================== */

        /** Fisher-Yates 洗牌；rnd 省略时用 Math.random（每次进关重新洗，结果不固定） */
        shuffle: function (arr, rnd) {
            var a = arr.slice();
            var r = typeof rnd === 'function' ? rnd : Math.random;
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(r() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }
    };
}
</script>
<script src="/vendor/alpinejs/cdn.min.js" defer></script>
</body>
</html>
