<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入项目 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sc-page" data-nav="import">

<header id="site-nav"></header>

<main class="sc-main container py-4" id="main">
    <div class="d-flex align-items-center gap-3 mb-4">
        <h2 class="mb-0">导入项目</h2>
        <a href="/import/txt" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-file-earmark-text"></i> TXT导入
        </a>
    </div>

    <div id="flashArea"></div>

    <div class="card">
        <div class="card-body">
            <form method="post" action="/import" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">选择备份文件</label>
                    <input type="file" class="form-control" id="file" name="file" accept=".json" required>
                    <div class="form-text">支持通过"完整备份(.json)"导出的文件</div>
                </div>

                <div class="mb-3">
                    <label for="projectName" class="form-label">项目名称（可选）</label>
                    <input type="text" class="form-control" id="projectName" name="projectName"
                           placeholder="留空则使用文件中的原始名称">
                </div>

                <div class="mb-3">
                    <label class="form-label">导入模式</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="importMode" id="modeNew" value="new" checked>
                        <label class="form-check-label" for="modeNew">
                            全新导入 — 创建新项目
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="importMode" id="modeOverwrite" value="overwrite">
                        <label class="form-check-label" for="modeOverwrite">
                            覆盖导入 — 若同名项目存在则替换所有数据
                        </label>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload"></i> 开始导入
                    </button>
                    <a href="/" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i> 取消</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
    'use strict';
    /* 静态页无法读取服务端 flash，错误信息由重定向的 query 串带回 */
    var p = SC.params();
    if (p.error) {
        document.getElementById('flashArea').innerHTML =
            '<div class="alert alert-danger alert-dismissible fade show" role="alert">' + SC.escape(p.error) +
            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
    }
})();
</script>
</body>
</html>
