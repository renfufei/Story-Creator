<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT导入 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="sc-page" data-nav="import">

<script>
/* 引导数据：同步 XHR，确保 txtImport() 构造时已就绪 */
window.__TXT_IMPORT_DATA__ = (function () {
    var d = { splitConfigs: [], genres: [], modelConfigs: [] };
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/import/txt/data', false);
        xhr.send();
        if (xhr.status === 200) d = JSON.parse(xhr.responseText || '{}');
    } catch (e) { console.error('__TXT_IMPORT_DATA__ load failed', e); }
    return d;
})();
</script>

<header id="site-nav"></header>

<main class="sc-main container py-4">
<div x-data="txtImport()" x-init="init()">
    <div class="d-flex align-items-center gap-3 mb-4">
        <h2 class="mb-0"><i class="bi bi-file-earmark-text"></i> TXT导入</h2>
        <a href="/import" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-file-earmark-zip"></i> 备份导入
        </a>
    </div>

    <!-- Step Indicator：本页只负责 1) 上传分割 2) 预览调整；之后的逆向流程在 /projects/{id}/reverse/* 独立页面 -->
    <div class="d-flex align-items-center justify-content-center mb-4">
        <template x-for="s in [1,2]" :key="s">
            <div class="d-flex align-items-center">
                <div class="rounded-circle d-flex align-items-center justify-content-center"
                     :class="step >= s ? 'bg-primary text-white' : 'bg-light text-muted border'"
                     style="width:36px;height:36px;font-size:14px;font-weight:bold;"
                     x-text="s"></div>
                <div x-show="s < 2" class="mx-2" style="width:40px;height:2px;"
                     :class="step > s ? 'bg-primary' : 'bg-light'"></div>
            </div>
        </template>
    </div>

    <!-- Step 1: Upload & Config -->
    <div x-show="step === 1">
        <div class="card">
            <div class="card-header"><strong>第一步：选择并上传文件</strong></div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">选择 TXT 文件</label>
                    <input type="file" class="form-control" accept=".txt" @change="onFileSelect($event)">
                </div>
                <div class="mb-3" x-show="fileBaseName">
                    <label class="form-label">文件名（去后缀）</label>
                    <input type="text" class="form-control" x-model="fileBaseName" readonly title="可选中拷贝部分信息">
                </div>
                <div class="mb-3">
                    <label class="form-label">项目标题</label>
                    <input type="text" class="form-control" x-model="title" placeholder="默认取文件名">
                </div>
                <div class="mb-3">
                    <label class="form-label">作者</label>
                    <input type="text" class="form-control" x-model="author" placeholder="留空使用全局默认作者">
                </div>
                <div class="mb-3">
                    <label class="form-label">题材</label>
                    <select class="form-select" x-model="genre" @change="onGenreChange()">
                        <option value="">未指定</option>
                        <template x-for="g in genres" :key="g.name">
                            <option :value="g.name" x-text="g.displayName"></option>
                        </template>
                    </select>
                </div>

                <label class="form-label">章节分割策略</label>
                <div class="text-muted small mb-2">内置分割策略（阿拉伯数字 / 中文数字 / 卷章 / 独立标题行 / 分隔线）由系统自动识别，无需勾选。</div>

                <!-- 仅渲染「自定义正则配置」，内置策略不可单独关闭 -->
                <div x-show="(splitConfigs || []).some(c => !c.builtin)" class="mb-3">
                    <label class="form-label mb-1">自定义正则配置（可选，勾选后参与分割）</label>
                    <div class="border rounded p-3" style="max-height:160px;overflow-y:auto;">
                        <template x-for="config in (splitConfigs || []).filter(c => !c.builtin)" :key="config.id">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       :id="'config-' + config.id"
                                       :value="config.id"
                                       :checked="config.enabled"
                                       @change="toggleConfig($el.value, $el.checked)">
                                <label class="form-check-label" :for="'config-' + config.id">
                                    <span x-text="config.name"></span>
                                    <small class="text-muted" x-text="config.description"></small>
                                </label>
                            </div>
                        </template>
                    </div>
                </div>
                <div x-show="!(splitConfigs || []).some(c => !c.builtin)" class="text-muted small mb-3">
                    暂无自定义正则配置。如需特殊分割规则，可在「设置 → 章节分割配置」中添加。
                </div>

                <div>
                    <button class="btn btn-primary" @click="uploadAndSplit()" :disabled="!file || uploading">
                        <span x-show="uploading" class="spinner-border spinner-border-sm me-1"></span>
                        上传并分割
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Step 2: Preview & Adjust -->
    <div x-show="step === 2">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>第二步：预览 &amp; 调整章节</strong>
                <div>
                    <span class="badge bg-info me-2" x-text="'共 ' + chapters.length + ' 章'"></span>
                    <span class="badge bg-secondary" x-text="formatWordCount(totalWordCount) + ' 字'"></span>
                </div>
            </div>
            <div class="card-body">
                <div class="mb-3 d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" @click="step = 1">
                        <i class="bi bi-arrow-left"></i> 返回
                    </button>
                    <button class="btn btn-outline-primary btn-sm" @click="resplit()">
                        <i class="bi bi-arrow-clockwise"></i> 重新分割
                    </button>
                </div>

                <div class="table-responsive" style="max-height:500px;overflow-y:auto;">
                    <table class="table table-sm table-hover">
                        <thead class="sticky-top bg-white">
                            <tr>
                                <th style="width:50px">#</th>
                                <th style="width:200px">标题</th>
                                <th style="width:80px">字数</th>
                                <th>预览</th>
                                <th style="width:100px">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="ch in chapters" :key="ch.number">
                                <tr>
                                    <td x-text="ch.number"></td>
                                    <td>
                                        <input type="text" class="form-control form-control-sm"
                                               x-model="ch.title"
                                               @blur="updateChapterTitle(ch.number, ch.title)">
                                    </td>
                                    <td><small x-text="formatWordCount(ch.wordCount)"></small></td>
                                    <td><small class="text-muted" x-text="ch.preview" style="font-size:12px"></small></td>
                                    <td>
                                        <button class="btn btn-outline-secondary btn-sm"
                                                @click="mergeNext(ch.number)"
                                                x-show="ch.number < chapters.length"
                                                title="合并下一章">
                                            <i class="bi bi-arrows-collapse"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3">
                    <button class="btn btn-primary" @click="saveAndGoToOptions()" :disabled="saving">
                        <span x-show="saving" class="spinner-border spinner-border-sm me-1"></span>
                        保存并进入逆向工程 <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
function txtImport() {
    var BOOT = window.__TXT_IMPORT_DATA__ || {};
    return {
        step: 1,
        // 引导数据
        splitConfigs: BOOT.splitConfigs || [],
        genres: BOOT.genres || [],
        // Step 1
        file: null,
        fileBaseName: '',
        title: '',
        genre: '',
        genreTouched: false,
        author: '',
        selectedConfigIds: [],
        uploading: false,
        saving: false,
        jobId: null,
        projectId: null,
        // Step 2
        chapters: [],
        totalWordCount: 0,

        init() {
            const all = this.splitConfigs || [];
            // 内置 Handler 由系统自检测、始终参与分割，无需勾选；
            // 仅把「自定义正则配置」中默认启用的项列入可选集合。
            const builtinIds = all.filter(c => c.builtin).map(c => parseInt(c.id));
            const customEnabledIds = all.filter(c => !c.builtin && c.enabled).map(c => parseInt(c.id));
            this.selectedConfigIds = builtinIds.concat(customEnabledIds);
        },

        /**
         * 第 2 步「保存并进入逆向工程」：先把基础项目信息（标题/题材/作者）落库并建好项目，
         * 然后跳转到按项目 id 定位的逆向工程选项页（可随时重新打开）。
         */
        async saveAndGoToOptions() {
            if (this.saving) return;
            this.saving = true;
            try {
                const resp = await fetch('/import/txt/' + this.jobId + '/basic-info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title: this.title, genre: this.genre, author: this.author})
                });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    SC.toast.error(data.error || ('保存失败: HTTP ' + resp.status));
                    return;
                }
                this.title = data.title || this.title;
                this.genre = data.genre || '';
                this.author = data.author || '';
                this.projectId = data.projectId || this.projectId;
                SC.toast.success('已保存项目信息');
                // 之后的逆向选项 / 执行监控都是独立页面，按项目 id 定位、支持重开
                location.href = '/projects/' + this.projectId + '/reverse/options';
            } catch (e) {
                SC.toast.error('保存失败: ' + e.message);
            } finally {
                this.saving = false;
            }
        },

        onFileSelect(event) {
            this.file = event.target.files[0];
            if (!this.file) { this.fileBaseName = ''; return; }
            // 只读展示用：去掉扩展名的文件名（供用户拷贝部分信息）
            this.fileBaseName = (this.file.name || '').replace(/\.[^.]+$/, '');
            const parsed = this.parseFilename(this.file.name);
            // 仅在用户尚未手动修改时自动填充，避免覆盖用户编辑
            if (!this.title) this.title = parsed.title;
            if (!this.author) this.author = parsed.author;
            // 题材默认「其他」：用户未手动选择过题材时，让 AI 在逆向工程中识别
            if (!this.genreTouched) this.genre = 'OTHER';
        },

        onGenreChange() {
            this.genreTouched = true;
        },

        /**
         * 从文件名解析【项目标题】与【作者】，规则与后端 TxtFilenameParser 保持一致：
         *  - 标题：书名号《》之内；无则取中文方括号【】之内；都无则回退为去掉扩展名的文件名。
         *  - 作者：作者：/作者: 之后直到特殊符号（括号/空白/常见标点）为止；只在标题括号之后搜索。
         */
        parseFilename(name) {
            let base = name || '';
            const dot = base.lastIndexOf('.');
            if (dot > 0) base = base.substring(0, dot);
            let title = base.trim();
            let author = '';
            const titleMatch = base.match(/《([^》]+)》/);
            if (titleMatch) {
                title = titleMatch[1].trim();
            } else {
                const bracketMatch = base.match(/【([^】]+)】/);
                if (bracketMatch) title = bracketMatch[1].trim();
            }
            let searchIn = base;
            const closeIdx = base.indexOf('》');
            if (closeIdx >= 0) {
                searchIn = base.substring(closeIdx);
            } else {
                const closeBracketIdx = base.indexOf('】');
                if (closeBracketIdx >= 0) searchIn = base.substring(closeBracketIdx);
            }
            const authorMatch = searchIn.match(/作者[:：]\s*([^【】\[\]（）()\s、，,。；;]+)/);
            if (authorMatch) author = authorMatch[1].trim();
            return { title, author };
        },

        toggleConfig(id, checked) {
            id = parseInt(id);
            if (checked) {
                if (!this.selectedConfigIds.includes(id)) this.selectedConfigIds.push(id);
            } else {
                this.selectedConfigIds = this.selectedConfigIds.filter(x => x !== id);
            }
        },

        async uploadAndSplit() {
            if (!this.file) return;
            this.uploading = true;
            try {
                const formData = new FormData();
                formData.append('file', this.file);
                if (this.title) formData.append('title', this.title);
                if (this.genre) formData.append('genre', this.genre);
                if (this.author) formData.append('author', this.author);

                const uploadResp = await fetch('/import/txt/upload', {method: 'POST', body: formData});
                const uploadData = await uploadResp.json();
                if (uploadData.error) { alert(uploadData.error); return; }

                this.jobId = uploadData.jobId;
                this.title = uploadData.title;

                // Split
                const splitResp = await fetch('/import/txt/' + this.jobId + '/split', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({configIds: this.selectedConfigIds})
                });
                const splitData = await splitResp.json();
                if (splitData.error) { alert(splitData.error); return; }

                this.chapters = splitData.chapters;
                this.totalWordCount = this.chapters.reduce((s, c) => s + c.wordCount, 0);
                this.step = 2;
            } catch(e) {
                alert('上传失败: ' + e.message);
            } finally {
                this.uploading = false;
            }
        },

        async resplit() {
            const resp = await fetch('/import/txt/' + this.jobId + '/resplit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({configIds: this.selectedConfigIds})
            });
            const data = await resp.json();
            if (data.error) { alert(data.error); return; }
            this.chapters = data.chapters;
            this.totalWordCount = this.chapters.reduce((s, c) => s + c.wordCount, 0);
        },

        async updateChapterTitle(num, title) {
            await fetch('/import/txt/' + this.jobId + '/chapter/' + num + '/title', {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });
        },

        async mergeNext(num) {
            await fetch('/import/txt/' + this.jobId + '/chapter/' + num + '/merge-next', {method: 'POST'});
            // Refresh chapters
            const resp = await fetch('/import/txt/' + this.jobId + '/chapters');
            const data = await resp.json();
            this.chapters = data.chapters;
            this.totalWordCount = data.totalWordCount;
        },

        formatWordCount(n) {
            if (n >= 10000) return (n / 10000).toFixed(1) + '万';
            return n;
        }
    };
}
</script>
<script src="/vendor/alpinejs/cdn.min.js" defer></script>
</body>
</html>
