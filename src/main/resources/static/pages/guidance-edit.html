<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑创作指导 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sc-page">

<script>
/* 引导数据：异步 fetch（路径形如 /settings/guidances/{id}/edit）
   原来这里是同步 XHR —— 浏览器停在 HTML 解析期等往返，JS 没开始跑、DOM 也没解析完，首屏白屏。
   现在先给空壳（表单区顶骨架），填充改到 await 之后（见页面末尾的 boot()）。 */
window.__GUIDANCE_EDIT_DATA__ = {};
window.loadGuidanceEditData = function () {
    if (!window.__GuidanceEditPromise) {
        var url = '/settings/guidances/' + encodeURIComponent(location.pathname.split('/')[3] || '') + '/edit-data';
        window.__GuidanceEditPromise = fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (d) {
                window.__GUIDANCE_EDIT_DATA__ = d || window.__GUIDANCE_EDIT_DATA__;
                return window.__GUIDANCE_EDIT_DATA__;
            })
            .catch(function (e) {
                console.error('__GUIDANCE_EDIT_DATA__ bootstrap failed: ' + (e && e.message ? e.message : e));
                return window.__GUIDANCE_EDIT_DATA__;
            });
    }
    return window.__GuidanceEditPromise;
};
</script>

<header id="site-nav"></header>

<main class="sc-main container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h2 class="mb-0">编辑创作指导</h2>
        <div class="d-flex flex-wrap gap-2">
            <a href="/settings/guidances" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> 返回列表
            </a>
            <form id="deleteForm" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i> 删除
                </button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- 引导数据还在路上：先出骨架（原来同步 XHR 会让表单先空一片） -->
            <div id="bootSkel" class="sc-skel-row">
                <div class="row g-3 mb-3">
                    <div class="col-md-6"><div class="sc-skel sc-skel-line" style="width: 40%;"></div></div>
                    <div class="col-md-4"><div class="sc-skel sc-skel-line" style="width: 55%;"></div></div>
                </div>
                <div class="sc-skel sc-skel-line"></div>
                <div class="sc-skel sc-skel-line"></div>
                <div class="sc-skel sc-skel-line w-75"></div>
                <div class="sc-skel sc-skel-line w-50"></div>
            </div>
            <form id="editForm" method="post" style="display:none">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">名称</label>
                        <input type="text" class="form-control" name="name" id="fName" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">步骤</label>
                        <select class="form-select" name="step" id="fStep" required></select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">指导内容</label>
                    <textarea class="form-control" name="guidance" id="fGuidance" rows="12"></textarea>
                </div>
                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
                <a href="/settings/guidances" class="btn btn-sm btn-outline-secondary"><i class="bi bi-x-lg"></i> 取消</a>
            </form>
        </div>
    </div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
    'use strict';
    var d = window.__GUIDANCE_EDIT_DATA__ || {};
    var editForm = document.getElementById('editForm');
    var delForm = document.getElementById('deleteForm');

    /* 删除入口（从列表页移到这里，放在右上角），提交前二次确认。
       事件同步绑好，动作和文案等都走 boot() 补——d 是同一个闭包变量，await 之后会被重新赋值。 */
    delForm.addEventListener('submit', function (e) {
        if (delForm.dataset.confirmed === '1') return;
        e.preventDefault();
        SC.confirm({
            title: '删除创作指导',
            message: '确定删除「' + (d.name || '') + '」？此操作不可撤销。',
            confirmText: '删除',
            danger: true
        }).then(function (ok) {
            if (ok) { delForm.dataset.confirmed = '1'; delForm.submit(); }
        });
    });

    /** 引导数据是异步的：await 之后填表单，最后才收骨架并露出表单 */
    async function boot() {
        try {
            d = (typeof window.loadGuidanceEditData === 'function')
                ? await window.loadGuidanceEditData()
                : (window.__GUIDANCE_EDIT_DATA__ || {});
            if (d.id != null) {
                editForm.setAttribute('action', '/settings/guidances/' + d.id + '/update');
                delForm.setAttribute('action', '/settings/guidances/' + d.id + '/delete');
            }
            document.getElementById('fName').value = d.name || '';
            document.getElementById('fGuidance').value = d.guidance || '';
            document.getElementById('fStep').innerHTML = (d.steps || []).map(function (s) {
                return '<option value="' + SC.escape(s.name) + '"' + (s.name === d.step ? ' selected' : '') + '>' +
                    SC.escape(s.displayName) + '</option>';
            }).join('');
        } finally {
            // ★ 填完才露表单：先露的话用户会看到空表单闪一下
            var skel = document.getElementById('bootSkel');
            if (skel) skel.remove();
            editForm.style.display = '';
        }
    }

    boot();
})();
</script>
</body>
</html>
