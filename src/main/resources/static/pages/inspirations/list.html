<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感</title>
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link href="/css/app.css" rel="stylesheet">
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/nav.js"></script>
</head>
<body class="sc-page" data-nav="projects">
<header id="site-nav"></header>
<main class="sc-main container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="bi bi-lightbulb"></i> 灵感</h2>
            <small class="text-muted">
                所属项目：<a class="text-decoration-none" id="project-link" href="#">项目名</a>
                <span class="ms-2">共 <strong id="count">0</strong> 条</span>
            </small>
        </div>
        <div>
            <a class="btn btn-outline-secondary btn-sm me-2" href="/inspirations">
                <i class="bi bi-globe2"></i> 所有灵感
            </a>
            <a id="back-workflow" class="btn btn-outline-secondary btn-sm me-2" href="#">
                <i class="bi bi-arrow-left"></i> 返回创作
            </a>
            <button type="button" class="btn btn-primary btn-sm" id="toggle-add">
                <i class="bi bi-plus"></i> 新建灵感
            </button>
        </div>
    </div>

    <div id="alert" class="alert py-2 d-none"></div>

    <!-- 新增表单 -->
    <div class="card mb-4 d-none" id="add-card">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label small mb-1">标题 <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-sm" id="new-title"
                       maxlength="200" placeholder="一句话概括这条灵感">
            </div>
            <div class="mb-3">
                <label class="form-label small mb-1">内容</label>
                <textarea class="form-control form-control-sm" id="new-content" rows="6"
                          placeholder="记录灵感片段、想法、场景、对白、设定……"></textarea>
            </div>
            <button type="button" class="btn btn-sm btn-primary" id="save-new">保存</button>
            <button type="button" class="btn btn-sm btn-secondary" id="cancel-add">取消</button>
        </div>
    </div>

    <!-- 列表 -->
    <div id="list" class="d-flex flex-column gap-3"></div>
    <div id="empty" class="text-center text-muted py-5 d-none">
        <i class="bi bi-lightbulb" style="font-size: 2.5rem;"></i>
        <p class="mt-2 mb-0">还没有记录任何灵感，点击右上角「新建灵感」开始记录。</p>
    </div>
</main>

<script>
(function () {
    const pid = location.pathname.match(/\/projects\/(\d+)\/inspirations/)[1];
    SC.nav.mount();
    const $ = (id) => document.getElementById(id);

    function showAlert(msg, type) {
        const el = $('alert');
        el.textContent = msg;
        el.className = 'alert alert-' + (type || 'info') + ' py-2';
    }

    function hideAlert() { $('alert').className = 'alert py-2 d-none'; }

    function esc(s) { return SC.escape(s == null ? '' : String(s)); }

    function fmtTime(s) { return s ? esc(s) : ''; }

    async function loadProject() {
        try {
            const p = await SC.api.get('/api/projects/' + pid);
            $('project-link').textContent = p.title || ('项目 ' + pid);
            $('project-link').href = '/projects/' + pid;
            $('back-workflow').href = '/projects/' + pid + '/workflow/world-building';
        } catch (e) {
            $('project-link').textContent = '项目 ' + pid;
            $('back-workflow').href = '/projects/' + pid + '/workflow/world-building';
        }
    }

    function cardHtml(it) {
        return '<div class="card">' +
            '<div class="card-body pb-2">' +
            '<div class="d-flex align-items-center gap-2 mb-1">' +
            '<a class="text-decoration-none fw-semibold fs-5" href="/projects/' + pid + '/inspirations/' + it.id + '">' + esc(it.title) + '</a>' +
            '</div>' +
            '<div class="text-muted small mb-2"><i class="bi bi-clock"></i> ' + fmtTime(it.createdAt) + '</div>' +
            '<p class="card-text text-muted mb-0" style="white-space:pre-wrap;word-break:break-word;">' + esc(it.contentPreview) + '</p>' +
            '</div>' +
            '<div class="card-footer bg-transparent d-flex gap-2">' +
            '<a class="btn btn-sm btn-outline-secondary" href="/projects/' + pid + '/inspirations/' + it.id + '"><i class="bi bi-eye"></i> 查看</a>' +
            '<a class="btn btn-sm btn-outline-primary" href="/projects/' + pid + '/inspirations/' + it.id + '/edit"><i class="bi bi-pencil"></i> 编辑</a>' +
            '<button type="button" class="btn btn-sm btn-outline-danger" data-del="' + it.id + '"><i class="bi bi-trash"></i> 删除</button>' +
            '</div></div>';
    }

    async function loadList() {
        const list = $('list');
        hideAlert();
        try {
            const data = await SC.api.get('/api/projects/' + pid + '/inspirations');
            $('count').textContent = data.length;
            if (!data.length) {
                list.innerHTML = '';
                $('empty').classList.remove('d-none');
                return;
            }
            $('empty').classList.add('d-none');
            list.innerHTML = data.map(cardHtml).join('');
        } catch (e) {
            showAlert('灵感列表加载失败：' + (e.message || ''), 'danger');
        }
    }

    // 事件委托：删除
    $('list').addEventListener('click', async (ev) => {
        const btn = ev.target.closest('[data-del]');
        if (!btn) return;
        const id = btn.getAttribute('data-del');
        if (!(await SC.confirm('确定删除这条灵感？此操作不可撤销。'))) return;
        btn.disabled = true;
        try {
            await SC.api.delete('/api/projects/' + pid + '/inspirations/' + id);
            SC.toast.success('灵感已删除');
            await loadList();
        } catch (e) {
            btn.disabled = false;
            SC.toast.error('删除失败：' + (e.message || ''));
        }
    });

    // 新增
    $('toggle-add').addEventListener('click', () => $('add-card').classList.toggle('d-none'));
    $('cancel-add').addEventListener('click', () => {
        $('add-card').classList.add('d-none');
        $('new-title').value = '';
        $('new-content').value = '';
    });
    $('save-new').addEventListener('click', async () => {
        const title = $('new-title').value.trim();
        const content = $('new-content').value;
        if (!title) { SC.toast.error('标题不能为空'); return; }
        const btn = $('save-new');
        btn.disabled = true;
        try {
            await SC.api.post('/api/projects/' + pid + '/inspirations', { title, content });
            SC.toast.success('灵感已保存');
            $('new-title').value = '';
            $('new-content').value = '';
            $('add-card').classList.add('d-none');
            await loadList();
        } catch (e) {
            SC.toast.error('保存失败：' + (e.message || ''));
        } finally {
            btn.disabled = false;
        }
    });

    loadProject();
    loadList();
})();
</script>
</body>
</html>
