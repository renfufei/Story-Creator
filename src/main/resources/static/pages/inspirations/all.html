<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有灵感</title>
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link href="/css/app.css" rel="stylesheet">
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/nav.js"></script>
</head>
<body class="sc-page" data-nav="projects">
<header id="site-nav"></header>
<main class="sc-main container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="bi bi-globe2"></i> 所有灵感</h2>
            <small class="text-muted">跨项目汇总，按项目分组；没归到项目里的灵感放在「未归属项目」下</small>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-primary btn-sm" id="toggle-add">
                <i class="bi bi-plus"></i> 新建灵感
            </button>
            <a class="btn btn-outline-secondary btn-sm" href="/"><i class="bi bi-house"></i> 返回首页</a>
        </div>
    </div>

    <div id="alert" class="alert py-2 d-none"></div>

    <!-- 新建：**不挂任何项目**（project_id = 0）。灵感常常先于项目出现，所以这一页就能直接记，
         以后要归到某个项目再去编辑补充。 -->
    <div class="card mb-4 d-none" id="add-card">
        <div class="card-body">
            <div class="text-muted small mb-3">
                <i class="bi bi-info-circle"></i> 这条灵感不归属任何项目，会落在「未归属项目」分组里。
            </div>
            <div class="mb-3">
                <label class="form-label small mb-1" for="new-title">标题 <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-sm" id="new-title"
                       maxlength="200" placeholder="一句话概括这条灵感">
            </div>
            <div class="mb-3">
                <label class="form-label small mb-1" for="new-content">内容</label>
                <textarea class="form-control form-control-sm" id="new-content" rows="6"
                          placeholder="记录灵感片段、想法、场景、对白、设定……"></textarea>
            </div>
            <button type="button" class="btn btn-sm btn-primary" id="save-new">保存</button>
            <button type="button" class="btn btn-sm btn-secondary" id="cancel-add">取消</button>
        </div>
    </div>

    <div id="groups"></div>
    <div id="empty" class="text-center text-muted py-5 d-none">
        <i class="bi bi-lightbulb" style="font-size: 2.5rem;"></i>
        <p class="mt-2 mb-0">还没有任何灵感记录，点右上角「新建灵感」记下第一条。</p>
    </div>
</main>

<script>
(function () {
    SC.nav.mount();
    const $ = (id) => document.getElementById(id);

    function esc(s) { return SC.escape(s == null ? '' : String(s)); }

    function hideAlert() { $('alert').className = 'alert py-2 d-none'; }

    function showAlert(msg, type) {
        const el = $('alert');
        el.textContent = msg;
        el.className = 'alert alert-' + (type || 'info') + ' py-2';
    }

    function itemHtml(it) {
        const base = '/projects/' + it.projectId + '/inspirations/' + it.id;
        return '<div class="card mb-2">' +
            '<div class="card-body py-2">' +
            '<div class="d-flex align-items-center gap-2 mb-1">' +
            '<a class="sc-card-link" href="' + base + '">' + esc(it.title) + '</a>' +
            '</div>' +
            '<div class="text-muted small mb-2"><i class="bi bi-clock"></i> ' + esc(it.createdAt) + '</div>' +
            (it.contentPreview ? '<p class="card-text text-muted mb-2" style="white-space:pre-wrap;word-break:break-word;">' + esc(it.contentPreview) + '</p>' : '') +
            '<div class="d-flex gap-2">' +
            '<a class="btn btn-sm btn-outline-secondary" href="' + base + '"><i class="bi bi-eye"></i> 查看</a>' +
            '<a class="btn btn-sm btn-outline-primary" href="' + base + '/edit"><i class="bi bi-pencil"></i> 编辑</a>' +
            '</div>' +
            '</div></div>';
    }

    function groupHtml(g) {
        const listUrl = '/projects/' + g.projectId + '/inspirations';
        // 0 号分组 = 未归属项目（后端 AllInspirationsApiController.NO_PROJECT_TITLE）。
        // 它跟普通项目组长得一样会让人以为存在这么个项目，所以换成收件箱图标 + 自己的说法。
        const noProject = SC.isNoProject(g.projectId);
        return '<div class="card mb-4">' +
            '<div class="card-header bg-transparent d-flex justify-content-between align-items-center">' +
            '<div><i class="bi ' + (noProject ? 'bi-inbox' : 'bi-folder2') + '"></i> ' +
            '<a class="sc-card-link" href="' + listUrl + '">' + esc(g.projectTitle) + '</a>' +
            ' <span class="badge bg-secondary ms-1">' + g.count + '</span>' +
            (noProject ? ' <span class="text-muted small ms-1">还没归到项目里的灵感</span>' : '') +
            '</div>' +
            '<a class="btn btn-sm btn-outline-secondary" href="' + listUrl + '">' +
            '<i class="bi bi-list-ul"></i> ' + (noProject ? '管理未归属灵感' : '进入项目灵感') + '</a>' +
            '</div>' +
            '<div class="card-body">' +
            (g.items.length ? g.items.map(itemHtml).join('') : '<div class="text-muted small">该项目暂无灵感</div>') +
            '</div></div>';
    }

    async function loadAll() {
        hideAlert();
        try {
            const groups = await SC.api.get('/api/inspirations');
            if (!groups || !groups.length) {
                $('groups').innerHTML = '';
                $('empty').classList.remove('d-none');
                return;
            }
            $('empty').classList.add('d-none');
            $('groups').innerHTML = groups.map(groupHtml).join('');
        } catch (e) {
            showAlert('灵感加载失败：' + (e.message || ''), 'danger');
        }
    }

    /* ==================== 新建（不挂项目） ====================
       后端以 project_id = 0 表示「未归属任何项目」，沿用项目灵感那套 CRUD 接口
       （/api/projects/0/inspirations），所以这里不需要第二套接口。 */

    $('toggle-add').addEventListener('click', () => {
        $('add-card').classList.toggle('d-none');
        if (!$('add-card').classList.contains('d-none')) $('new-title').focus();
    });

    $('cancel-add').addEventListener('click', () => {
        $('add-card').classList.add('d-none');
        $('new-title').value = '';
        $('new-content').value = '';
    });

    $('save-new').addEventListener('click', async () => {
        const title = $('new-title').value.trim();
        const content = $('new-content').value;
        if (!title) { SC.toast.error('标题不能为空'); return; }
        const btn = $('save-new');
        btn.disabled = true;
        try {
            await SC.api.post('/api/projects/' + SC.NO_PROJECT_ID + '/inspirations', { title, content });
            SC.toast.success('灵感已保存');
            $('new-title').value = '';
            $('new-content').value = '';
            $('add-card').classList.add('d-none');
            await loadAll();
        } catch (e) {
            SC.toast.error('保存失败：' + (e.message || ''));
        } finally {
            btn.disabled = false;
        }
    });

    loadAll();
})();
</script>
</body>
</html>
