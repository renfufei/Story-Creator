<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看模板 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sc-page">

<script>
/* 引导数据：异步 fetch（内置模板 id 取自路径 /settings/tts-templates/builtin/{id}/view）
   原来同步 XHR，浏览器停在 HTML 解析期等一趟，首屏白屏。 */
window.__TTS_TEMPLATE_VIEW_DATA__ = { name: '', description: '', rules: [] };
window.loadTtsTemplateViewData = function () {
    if (!window.__ttsTemplateViewPromise) {
        var m = location.pathname.match(/\/settings\/tts-templates\/builtin\/([^/]+)\/view/);
        var id = m ? decodeURIComponent(m[1]) : '';
        var url = '/settings/tts-templates/builtin/' + encodeURIComponent(id) + '/view-data';
        window.__ttsTemplateViewPromise = (!id
            ? Promise.resolve(window.__TTS_TEMPLATE_VIEW_DATA__)
            : fetch(url, { headers: { 'Accept': 'application/json' } })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (d) {
                    Object.assign(window.__TTS_TEMPLATE_VIEW_DATA__, d || {});
                    return window.__TTS_TEMPLATE_VIEW_DATA__;
                })
                .catch(function (e) {
                    console.error('__TTS_TEMPLATE_VIEW_DATA__ bootstrap failed: ' + (e && e.message ? e.message : e));
                    return window.__TTS_TEMPLATE_VIEW_DATA__;
                }));
    }
    return window.__ttsTemplateViewPromise;
};
</script>

<header id="site-nav"></header>


<main class="sc-main container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0" id="pageTitle">查看模板</h2>
            <small class="text-muted" id="pageDesc"></small>
        </div>
        <a href="/settings/tts-templates" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回列表
        </a>
    </div>

    <!-- 引导数据还在路上：先出骨架（原来同步 XHR 会让模板信息与规则表先空一片） -->
    <div id="bootSkel" class="sc-skel-row mb-4">
        <div class="sc-skel sc-skel-line mb-2" style="width: 30%;"></div>
        <div class="sc-skel sc-skel-line"></div>
        <div class="sc-skel sc-skel-line w-75"></div>
        <div class="sc-skel sc-skel-line w-50"></div>
    </div>

    <!-- Template Info -->
    <div class="card mb-4">
        <div class="card-header"><strong>模板信息</strong></div>
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-3">
                    <label class="form-label small mb-1">名称</label>
                    <input type="text" class="form-control form-control-sm" id="bName" readonly>
                </div>
                <div class="col-md-5">
                    <label class="form-label small mb-1">描述</label>
                    <input type="text" class="form-control form-control-sm" id="bDesc" readonly>
                </div>
            </div>
        </div>
    </div>

    <!-- Rules List -->
    <div class="card">
        <div class="card-header">
            <strong><i class="bi bi-list-ol"></i> 替换规则</strong>
        </div>
        <div class="card-body">
            <div id="rulesArea"></div>
        </div>
    </div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
    'use strict';

    /** 引导数据是异步的：await 之后才铺内容，最后收骨架 */
    async function boot() {
    try {
    var data = (typeof window.loadTtsTemplateViewData === 'function')
        ? await window.loadTtsTemplateViewData()
        : (window.__TTS_TEMPLATE_VIEW_DATA__ || { rules: [] });
    var rules = data.rules || [];

    document.getElementById('pageTitle').textContent = '查看模板: ' + (data.name || '');
    document.getElementById('pageDesc').textContent = data.description || '';
    document.getElementById('bName').value = data.name || '';
    document.getElementById('bDesc').value = data.description || '';

    var area = document.getElementById('rulesArea');
    if (!rules.length) {
        area.innerHTML = '<p class="text-muted small mb-0">此模板暂无规则。</p>';
    } else {
        var rows = rules.map(function (r, i) {
            var repl = (r.replacement && r.replacement.length)
                ? '<code>' + SC.escape(r.replacement) + '</code>'
                : '<span class="text-muted small">(删除)</span>';
            return '<tr>' +
                '<td>' + i + '</td>' +
                '<td><code class="small" style="word-break: break-all;">' + SC.escape(r.pattern) + '</code></td>' +
                '<td>' + repl + '</td>' +
                '<td><span class="badge ' + (r.regex ? 'bg-info' : 'bg-secondary') + '">' +
                    (r.regex ? '正则' : '文本') + '</span></td>' +
                '<td class="text-muted small">' + SC.escape(r.description) + '</td>' +
                '</tr>';
        }).join('');
        area.innerHTML =
            '<table class="table table-sm table-hover mb-0">' +
            '<thead><tr><th style="width:50px;">序号</th><th>匹配模式</th><th>替换为</th>' +
            '<th style="width:60px;">类型</th><th>描述</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>';
    }
    } finally {
        var skel = document.getElementById('bootSkel');
        if (skel) skel.remove();
    }
    }

    boot();
})();
</script>
</body>
</html>
