<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情节拓展</title>
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/compare-panel.js"></script>
    <style>
        body { margin: 0; }
        [x-cloak] { display: none !important; }
        /* 操作列按钮一律不换行：窄屏下文字按字竖排会把行高撑到 300px+ */
        .exp-actions .btn { white-space: nowrap; }
        .exp-table td, .exp-table th { vertical-align: middle; }

        /* 队列表格列宽走类，方便窄屏整体收紧（行内 style 的 width 没法被媒体查询覆盖） */
        .exp-table .exp-col-chapter { width: 72px; }
        .exp-table .exp-col-words { width: 80px; }
        .exp-table .exp-col-status { width: 96px; }
        .exp-table .exp-col-actions { width: 240px; }
        .exp-table .exp-title-cell { max-width: 420px; }

        /* ===== 扩写队列：按分卷分组 + 限高滚动（面板打开时自动放开） =====
           队列以前是全平铺：标记 50 章就把下面的「全部章节」推到几百行之外，
           想回队列点个「确认」得先滚过整条队列。所以队列自己滚，**约 12 行**为上限
           （一行 ≈ 40px，取决于按钮高；卷头 ≈ 34px）。另给一道 88vh 兜底：屏幕矮的时候
           宁可少露几行，也别让容器比视口还高。
           ⚠️ 改 `--exp-queue-rows` 时同步改 JS 里的 `queueVisibleRows`（提示条的显示阈值）。

           **两张皮：有预览面板打开时切成 .exp-queue-flow（不限高）**。
           原来「队列小窗」和「面板内左右两栏」是两个独立的滚动容器套在一起：在面板里滚到底，
           滚轮会接力把队列整个滚走；面板比小窗高，下半截被裁掉；右边还并排两条滚动条。
           现在同一时刻只有一层滚动 —— 读面板时队列放开限高、跟随整页滚；全部面板收起后
           队列回到 12 行的小窗（导航仍在一屏内）。 */
        .exp-queue-scroll {
            --exp-queue-row: 40px;
            --exp-queue-head: 42px;
            --exp-queue-rows: 12;
            --exp-queue-maxvh: 88vh;
            max-height: min(calc(var(--exp-queue-rows) * var(--exp-queue-row) + var(--exp-queue-head)), var(--exp-queue-maxvh));
            overflow-y: auto;
            overscroll-behavior: contain;   /* 滚到底别把整页一起带走 */
        }
        /* 阅读态：不限高。overflow-x 仍要 auto —— 窄屏整表横向溢出，得能横滑看全；
           纵向没有溢出，浏览器不会因此长出纵向滚动条。 */
        .exp-queue-flow {
            max-height: none;
            overflow-x: auto;
            overflow-y: auto;
            overscroll-behavior: auto;
        }

        /* 卷头（与下方「全部章节」的卷头同款浅底）：折叠时整卷的章节行**和预览面板**一起收起 */
        .exp-queue-vol { border-top: 1px solid var(--bs-border-color, #dee2e6); }
        .exp-queue-vol:first-child { border-top: 0; }
        .exp-queue-vol-head {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .85rem;
            background: var(--bs-tertiary-bg, #f8f9fa);
            border-bottom: 1px solid var(--bs-border-color, #dee2e6);
        }
        .exp-queue-vol-head .exp-vol-caret { text-decoration: none; flex: 0 0 auto; }
        /* 卷头吸顶只在小窗（真的有滚动）时才有意义：阅读态是整页滚，吸顶在那种情况下没作用，
           还会让卷头压住页头导航。所以用 :not(.exp-queue-flow) 把阅读态排除掉。 */
        .exp-queue-scroll:not(.exp-queue-flow) .exp-queue-vol-head {
            position: sticky;
            top: 0;
            z-index: 3;
            box-shadow: inset 0 -1px 0 var(--bs-border-color, #dee2e6);
        }

        @media (max-width: 575.98px) {
            /* 窄屏行更高、视口更矮：8 行 ≈ 桌面 12 行的观感 */
            .exp-queue-scroll { --exp-queue-rows: 8; --exp-queue-maxvh: 80vh; }
            /* 窄屏这张表本来是横向溢出的（已扩写行的「预览 / 回滚 / 确认」三键就有 108px），
               试过 table-layout:fixed 硬塞 —— 标题列被压到几十像素、按钮还是被裁，
               反而更差，所以保留整表横滑的老行为，只把纵向锁在 8 行以内。 */
        }

        /* ===== 扩写指导：只读限高 20 行 / 编辑框默认 20 行 / 可【展开】按内容撑高 =====
           指导写长了（几千字很常见）会把下面的队列整块推走，而这一屏的主角是队列；
           但 8 行（原 10rem）又太窄 —— 常见的一段指导就得来回滚，读不全也不好对照。
           取 20 行小字：.875rem × 1.5 = 1.3125rem/行，20 行 ≈ 420px，超出的才在框内滚。

           行数用 CSS 变量算出来（只读态 max-height、编辑态 height 共用同一份），
           窄屏收到 12 行 —— 手机上 420px 的框已经比可视区还高。
           只读态用 pre-line 保留换行，所以只能限高、不能用 line-clamp 截断。 */
        .sc-main {
            --exp-guidance-rows: 20;
            --exp-guidance-line: 1.3125rem;   /* .875rem × 1.5 */
        }
        .exp-guidance-view {
            max-height: calc(var(--exp-guidance-rows, 20) * var(--exp-guidance-line, 1.3125rem));
            overflow-y: auto;
            overscroll-behavior: contain;
            white-space: pre-line;   /* 指导正文里的换行要保留（原来是行内 style） */
            padding-right: .25rem;   /* 滚动条压住最后一列字时不至于贴边 */
            font-size: .875rem;      /* 与 .small 一致，但写死才能让上面的行数算式成立 */
            line-height: 1.5;
        }
        /* 编辑框默认同样 20 行（rows 属性兜底，height 由变量算，窄屏才好一起收）；
           【展开】撑高时写的是行内 height，会把这条覆盖掉，收起时清空行内值即还原。 */
        .exp-guidance-edit {
            height: calc(var(--exp-guidance-rows, 20) * var(--exp-guidance-line, 1.3125rem) + .75rem);
            resize: vertical;        /* 手动也能拉，但【展开】才是按内容自适应 */
        }
        @media (max-width: 575.98px) {
            .sc-main { --exp-guidance-rows: 12; }
        }

        /* ===== 扩写前后预览（贴在各自章节行的**正下方**） =====
           面板本体（.sc-cmp / .sc-cmp-pane / 差异高亮）是三个页面共用的，
           样式在 app.css、逻辑在 js/compare-panel.js；这里只留本页特有的两件事：
           ① 面板是表格里的一个 td（colspan=5），去掉内边距让它铺满整行；
           ② 窄屏把列宽整体收紧，否则表格一宽过视口，贴在行内的面板就被顶出视口。 */
        .exp-table .exp-compare-cell { padding: 0; }
        @media (max-width: 575.98px) {
            .exp-table .exp-col-chapter { width: 48px; }
            .exp-table .exp-col-status { width: 64px; }
            .exp-table .exp-col-actions { width: auto; }
            .exp-table .exp-title-cell { max-width: 104px; }
            .exp-table td, .exp-table th { padding-left: .3rem; padding-right: .3rem; }
            .exp-actions .btn { padding-left: .4rem; padding-right: .4rem; }
        }
    </style>
</head>
<body class="sc-page" data-nav="projects">
<header id="site-nav"></header>

    <script>
    /*
     * 引导数据：**异步**拉取。
     * 原来这里是同步 XHR（open() 第三个参数传 false 那种）：浏览器必须停下来等一个网络往返，
     * HTML 解析、样式计算、首次绘制全被卡住，数据没回来就是一片白屏（同步 XHR 也已被浏览器
     * 标记为弃用，页面 unload 时还会直接抛错）。
     * 现在改成 fetch：骨架屏先出来（x-show="booting"），数据到了再由 Alpine 的 init 填进去。
     * projectId 仍然同步从路径取——页头链接与各处接口地址不必等数据。
     */
    window.__EXPANSION_DATA__ = null;
    window.loadExpansionData = function () {
        if (window.__expansionDataPromise) return window.__expansionDataPromise;
        var pid = location.pathname.split('/')[2];
        window.__expansionDataPromise = fetch('/projects/' + pid + '/expansion/data',
                { headers: { 'Accept': 'application/json' } })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (d) {
                window.__EXPANSION_DATA__ = d || {};
                return window.__EXPANSION_DATA__;
            })
            .catch(function (e) {
                // 引导数据失败不该让整页坏死：退化成空队列，用户仍看得到页头与空态
                console.error('expansion bootstrap failed: ' + e.message);
                window.__EXPANSION_DATA__ = {
                    projectId: pid, chapters: [], volumes: [], chaptersPerVolume: 10
                };
                return window.__EXPANSION_DATA__;
            });
        return window.__expansionDataPromise;
    };
    </script>


<main class="sc-main container py-4" x-data="expansionPage()">
    <!-- ===================== 页头 ===================== -->
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
        <div>
            <h4 class="mb-1"><i class="bi bi-arrows-expand-vertical"></i> 情节拓展</h4>
            <div class="text-muted small">
                <!-- 引导数据异步到达：先占位再填，避免先闪「项目名」再变 -->
                <span x-show="booting" class="sc-skel" style="width:7rem;"></span>
                <span x-show="!booting" x-text="projectTitle || '项目'"></span>
                <span class="mx-1">·</span>
                <span>标记章节 → 批量扩写 → 逐章确认或回滚</span>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-sm btn-outline-secondary" :href="readUrl" title="去全文阅读页标记要扩写的章节">
                <i class="bi bi-journal-text"></i> 全文阅读
            </a>
            <a class="btn btn-sm btn-outline-secondary" :href="workflowUrl" title="返回工作流">
                <i class="bi bi-arrow-left"></i> 返回创作
            </a>
        </div>
    </div>

    <!-- ===================== 扩写指导 ===================== -->
    <div class="card mb-3">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="d-flex align-items-center gap-2">
                <i class="bi bi-compass"></i>
                <strong>扩写指导</strong>
                <span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle"
                      x-show="!booting && !editingGuidance && guidance" x-cloak>
                    <i class="bi bi-check2"></i> 已配置
                </span>
                <span class="badge rounded-pill bg-secondary-subtle text-secondary border"
                      x-show="!booting && !editingGuidance && !guidance" x-cloak>未配置</span>
            </span>
            <div class="btn-group btn-group-sm" x-show="!editingGuidance" x-cloak>
                <button type="button" class="btn btn-outline-secondary" @click="startEditGuidance()"
                        title="编辑本项目的扩写指导">
                    <i class="bi bi-pencil"></i> 配置
                </button>
                <button type="button" class="btn btn-outline-success" @click="saveGuidanceAsShared()"
                        :disabled="savingShared || !guidance.trim()"
                        title="把这份指导存入创作指导库，其他项目可直接复用">
                    <span x-show="!savingShared"><i class="bi bi-box-arrow-up"></i> 存为通用</span>
                    <span x-show="savingShared" x-cloak><span class="spinner-border spinner-border-sm me-1"></span>保存中</span>
                </button>
                <button type="button" class="btn btn-outline-primary" @click="openReuseModal()"
                        title="从创作指导库挑一份已有的扩写指导套用">
                    <i class="bi bi-journal-arrow-down"></i> 复用指导
                </button>
            </div>
        </div>
        <div class="card-body">
            <!-- 只读态 -->
            <template x-if="!editingGuidance">
                <div>
                    <!-- 骨架：指导正文要等引导数据（没配过时也走同一段占位，长度一致不会跳） -->
                    <div x-show="booting" x-cloak>
                        <span class="sc-skel sc-skel-line"></span>
                        <span class="sc-skel sc-skel-line w-75"></span>
                    </div>
                    <div x-show="!booting">
                        <p class="mb-0 small text-body-secondary exp-guidance-view" x-text="guidance"></p>
                        <p class="mb-0 small text-body-secondary fst-italic" x-show="!guidance" x-cloak>
                            尚未设置。点「配置」填写扩写方向（如：加强环境描写与人物心理，补充对话细节与伏笔），
                            也可从指导库「复用指导」挑一份现成的。
                        </p>
                    </div>
                </div>
            </template>
            <!-- 编辑态 -->
            <template x-if="editingGuidance">
                <div>
                    <!-- rows 20（窄屏由 .exp-guidance-edit 的变量收到 12 行）：
                         指导通常要写十几行，小框里改长文得一直滚。
                         内容比 20 行还长时点【展开】，按内容自动撑到合适高度（见 toggleGuidanceExpand）。 -->
                    <textarea class="form-control form-control-sm exp-guidance-edit" rows="20"
                              x-ref="guidanceTextarea" x-model="guidanceEdit"
                              @input="syncGuidanceHeight()"
                              placeholder="输入扩写方向，例如：丰富环境描写和心理活动，补充更多对话细节..."></textarea>
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2">
                        <small class="text-muted" x-text="'当前 ' + guidanceEdit.length + ' 字'"></small>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary"
                                    @click="toggleGuidanceExpand()"
                                    :title="guidanceExpanded ? '收回到默认行数' : '按内容自动撑高，不用在小框里滚'">
                                <i class="bi" :class="guidanceExpanded ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand'"></i>
                                <span x-text="guidanceExpanded ? '收起' : '展开'"></span>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" @click="cancelEditGuidance()">
                                <i class="bi bi-x-lg"></i> 取消
                            </button>
                            <button type="button" class="btn btn-sm btn-primary" @click="saveGuidance()"
                                    :disabled="savingGuidance">
                                <span x-show="savingGuidance" class="spinner-border spinner-border-sm me-1"></span>
                                <i class="bi bi-check-lg" x-show="!savingGuidance"></i> 保存配置
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ===================== 扩写队列 ===================== -->
    <div class="card mb-3">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="d-flex align-items-center gap-2 flex-wrap">
                <i class="bi bi-list-check"></i>
                <strong>扩写队列</strong>
                <!-- 计数来自引导数据：加载中先给骨架，别显示「0 待扩写」误导 -->
                <span x-show="booting" class="sc-skel sc-skel-badge"></span>
                <span x-show="!booting" class="badge rounded-pill bg-warning text-dark" x-text="pendingCount + ' 待扩写'"></span>
                <span x-show="!booting" class="badge rounded-pill bg-success" x-text="expandedCount + ' 已扩写'"></span>
                <!-- 两处列表各管一段，先说清楚免得来回找：这里只列已标记的章节 -->
                <small class="text-muted d-none d-xl-inline">仅含已标记的章节，全部章节见下方</small>
            </span>
            <div class="d-flex flex-wrap gap-2">
                <!-- 全部折叠/展开：队列按卷分组后，折叠是「控制队列高度」的主要手段
                     （面板一收起，队列就回到 12 行小窗，折叠则再省一整卷） -->
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggleAllQueueVolumes()"
                        x-show="!booting && queueVolumes.length > 0" x-cloak
                        :title="allQueueVolumesExpanded ? '折叠所有分卷（卷内的预览对比一起收起）' : '展开所有分卷'">
                    <i class="bi" :class="allQueueVolumesExpanded ? 'bi-chevron-contract' : 'bi-chevron-expand'"></i>
                    <span x-text="allQueueVolumesExpanded ? '全部折叠' : '全部展开'"></span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="refreshStatus()"
                        :disabled="refreshing" title="重新拉取任务状态与章节">
                    <span x-show="!refreshing"><i class="bi bi-arrow-clockwise"></i> 刷新</span>
                    <span x-show="refreshing" x-cloak><span class="spinner-border spinner-border-sm me-1"></span>刷新中</span>
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                <button type="button" class="btn btn-sm"
                        :class="active ? 'btn-outline-danger' : 'btn-primary'"
                        @click="active ? stopExpansion() : startExpansion()"
                        :disabled="!active && pendingCount === 0"
                        :title="active ? '停止当前批量扩写任务' : '按队列顺序逐章扩写'">
                    <i :class="active ? 'bi bi-pause-fill' : 'bi bi-play-fill'"></i>
                    <span x-text="active ? '暂停扩写' : '开始批量扩写'"></span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-success" @click="confirmAll()"
                        :disabled="expandedCount === 0 || active"
                        title="把已扩写的章节全部确认，并清空它们的扩写状态">
                    <i class="bi bi-check2-all"></i> 批量确认
                </button>
                <button type="button" class="btn btn-sm btn-outline-warning" @click="removeAllPending()"
                        :disabled="pendingCount === 0 || active"
                        title="把待扩写的章节全部移出队列（不动已扩写内容）">
                    <i class="bi bi-x-circle"></i> 批量移除
                </button>
                <span class="ms-auto small text-muted" x-show="active" x-cloak>
                    <span class="spinner-border spinner-border-sm me-1"></span>扩写进行中，可随时暂停
                </span>
            </div>

            <!-- 实时日志 -->
            <div x-show="active || streamContent" x-cloak class="mb-3">
                <div class="border rounded">
                    <div class="d-flex justify-content-between align-items-center px-2 py-1 bg-light border-bottom">
                        <small class="text-muted"><i class="bi bi-terminal"></i> 实时日志</small>
                        <button type="button" class="btn btn-sm btn-outline-danger py-0" @click="stopExpansion()"
                                x-show="active">
                            <i class="bi bi-stop-circle"></i> 停止
                        </button>
                    </div>
                    <div class="p-2" style="max-height:220px; overflow-y:auto; font-size:0.85rem; white-space:pre-wrap;"
                         x-ref="streamBox" x-text="streamContent"></div>
                </div>
            </div>

            <!-- 队列头信息：章数 / 卷数。macOS 的滚动条默认是浮层、不滚不显示，
                 不说的话很多人会以为队列里只有露出来这些。
                 面板打开时队列不再限高（见 .exp-queue-flow），所以「列表内可滚动」也跟着藏起来。 -->
            <!-- ⚠️ 别用 d-flex 承载 x-show：Bootstrap 的 .d-flex 带 !important，
                 x-show 设的 display:none 会被它顶掉、永远隐藏不掉（全站踩过的坑）。
                 靠右用 text-end 就行。 -->
            <div class="mb-1 text-end exp-queue-hint"
                 x-show="!booting && filteredChapters.length > 0" x-cloak>
                <small class="text-muted">
                    <i class="bi bi-collection"></i>
                    共 <span x-text="filteredChapters.length"></span> 章
                    · <span x-text="queueVolumes.length"></span> 卷
                    <span x-show="!anyCompareOpen && filteredChapters.length > queueVisibleRows"> · 列表内可滚动</span>
                    <span class="d-none d-xl-inline"> · 点卷名可折叠</span>
                </small>
            </div>

            <!-- 队列表格：按**分卷**分组（卷划分与卷名和下方「全部章节」完全同源），
                 每卷一张表、卷头可折叠；折叠时**整卷的章节行与预览面板一起收起**。
                 外层是限高滚动框（约 12 行）；只要有预览面板打开就切成 .exp-queue-flow 放开限高 ——
                 这样「队列小窗」和「面板内左右两栏」永远不会同时是滚动容器。 -->
            <div class="table-responsive exp-queue-scroll"
                 :class="anyCompareOpen ? 'exp-queue-flow' : ''">

                <!-- 引导数据还在路上：先给三行骨架。
                     没有这段，异步改造后用户会先看到「队列为空」再突然冒出章节。 -->
                <table class="table table-sm table-hover align-middle exp-table mb-0" x-show="booting" x-cloak>
                    <thead class="table-light">
                        <tr>
                            <th class="text-nowrap exp-col-chapter">章节</th>
                            <th class="text-nowrap">标题</th>
                            <th class="text-nowrap exp-col-words d-none d-sm-table-cell">字数</th>
                            <th class="text-nowrap exp-col-status">状态</th>
                            <th class="text-nowrap exp-col-actions">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="i in 3" :key="'skel' + i">
                            <tr>
                                <td><span class="sc-skel sc-skel-line w-50"></span></td>
                                <td><span class="sc-skel sc-skel-line"></span></td>
                                <td class="d-none d-sm-table-cell"><span class="sc-skel sc-skel-line w-50"></span></td>
                                <td><span class="sc-skel sc-skel-badge"></span></td>
                                <td><span class="sc-skel sc-skel-line"></span></td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <!-- 空态 -->
                <div class="text-center text-muted py-4"
                     x-show="!booting && filteredChapters.length === 0" x-cloak>
                    <i class="bi bi-inbox fs-4 d-block mb-1"></i>
                    队列为空。到
                    <a :href="readUrl" class="text-decoration-none">全文阅读页</a>
                    标记需要扩写的章节，或在下方「全部章节」里勾选后加入队列。
                </div>

                <!-- 按卷分组：每卷一张表（列宽走 .exp-col-* 类，各卷之间对得齐） -->
                <template x-for="vol in queueVolumes" :key="'qvol' + vol.volume">
                    <div class="exp-queue-vol">
                        <!-- 卷头：点箭头折叠；右侧是该卷的状态计数（只显示非 0 的） -->
                        <div class="exp-queue-vol-head">
                            <button type="button" class="btn btn-sm btn-link p-0 text-dark exp-vol-caret"
                                    @click="toggleQueueVolume(vol.volume)"
                                    :aria-expanded="isQueueVolumeExpanded(vol.volume) ? 'true' : 'false'"
                                    :title="isQueueVolumeExpanded(vol.volume)
                                            ? '折叠本卷（卷内的预览对比一起收起）' : '展开本卷'">
                                <i class="bi" :class="isQueueVolumeExpanded(vol.volume) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                            </button>
                            <span class="fw-bold text-truncate" x-text="vol.label"></span>
                            <span class="text-muted small text-nowrap"
                                  x-text="'（' + vol.chapters.length + ' 章）'"></span>
                            <span class="d-inline-flex flex-wrap align-items-center gap-1 ms-auto">
                                <span class="badge rounded-pill bg-warning text-dark" x-show="vol.pending"
                                      x-text="vol.pending + ' 待扩写'"></span>
                                <span class="badge rounded-pill bg-info text-dark" x-show="vol.generating"
                                      x-text="vol.generating + ' 扩写中'"></span>
                                <span class="badge rounded-pill bg-success" x-show="vol.expanded"
                                      x-text="vol.expanded + ' 已扩写'"></span>
                            </span>
                        </div>
                        <div x-show="isQueueVolumeExpanded(vol.volume)">
                            <table class="table table-sm table-hover align-middle exp-table mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-nowrap exp-col-chapter">章节</th>
                                        <th class="text-nowrap">标题</th>
                                        <th class="text-nowrap exp-col-words d-none d-sm-table-cell">字数</th>
                                        <th class="text-nowrap exp-col-status">状态</th>
                                        <th class="text-nowrap exp-col-actions">操作</th>
                                    </tr>
                                </thead>
                                <!-- ★ 每章一个 tbody：主行 + **紧贴在这行下面**的预览面板行。
                                     多面板要能同时展开、各自贴自己那行，就只能一章一组 tbody；
                                     x-for 只认单根节点，所以模板的根是 tbody 而不是 tr。 -->
                                <template x-for="ch in vol.chapters" :key="ch.chapterNumber">
                        <tbody class="exp-chapter-group">
                            <tr :class="ch.cmpOpen ? 'table-active' : ''">
                                <td class="text-nowrap" x-text="'第' + ch.chapterNumber + '章'"></td>
                                <td class="text-truncate exp-title-cell" :title="ch.title || '-'"
                                    x-text="ch.title || '-'"></td>
                                <td class="d-none d-sm-table-cell" x-text="ch.wordCount"></td>
                                <td>
                                    <span class="badge rounded-pill" :class="statusBadgeClass(ch.expansionStatus)"
                                          x-text="statusLabel(ch.expansionStatus)"></span>
                                </td>
                                <td class="exp-actions">
                                    <template x-if="ch.expansionStatus === 'PENDING'">
                                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                                @click="unmarkChapter(ch.chapterNumber)" title="移出扩写队列">
                                            <i class="bi bi-x-lg"></i> <span class="d-none d-sm-inline">移除</span>
                                        </button>
                                    </template>
                                    <template x-if="ch.expansionStatus === 'EXPANDED'">
                                        <!-- 独立按钮 + gap：btn-group 会把三个按钮贴死并共享边框，太挤；
                                             拆开后各有完整边框，间距由 gap-1（4px）控制 -->
                                        <div class="d-inline-flex gap-1">
                                            <button type="button" class="btn btn-sm exp-compare-toggle"
                                                    :class="ch.cmpOpen ? 'btn-secondary' : 'btn-outline-primary'"
                                                    :aria-expanded="ch.cmpOpen ? 'true' : 'false'"
                                                    @click="toggleCompare(ch)"
                                                    :title="ch.cmpOpen ? '收起扩写前后预览' : '在下方预览扩写前后的正文'">
                                                <i class="bi" :class="ch.cmpOpen ? 'bi-chevron-up' : 'bi-eye'"></i>
                                                <span class="d-none d-sm-inline" x-text="ch.cmpOpen ? '收起' : '预览'"></span>
                                            </button>
                                            <button type="button" class="btn btn-sm btn-outline-warning"
                                                    @click="rollbackChapter(ch.chapterNumber)"
                                                    title="恢复扩写前的原文">
                                                <i class="bi bi-arrow-counterclockwise"></i>
                                                <span class="d-none d-sm-inline">回滚</span>
                                            </button>
                                            <button type="button" class="btn btn-sm btn-outline-success"
                                                    @click="confirmChapter(ch.chapterNumber)"
                                                    title="保留扩写结果并清空状态">
                                                <i class="bi bi-check-lg"></i>
                                                <span class="d-none d-sm-inline">确认</span>
                                            </button>
                                        </div>
                                    </template>
                                    <template x-if="ch.expansionStatus === 'GENERATING'">
                                        <span class="text-muted small"><span class="spinner-border spinner-border-sm me-1"></span>扩写中</span>
                                    </template>
                                </td>
                            </tr>

                            <!-- ===== 这一章的扩写前后预览（紧贴上一行） ===== -->
                            <tr x-show="ch.cmpOpen" class="exp-compare-row">
                                <td colspan="5" class="exp-compare-cell">
                                    <div class="sc-cmp" :id="'exp-cmp-' + ch.chapterNumber">
                                        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                                            <div style="min-width:0;">
                                                <div class="fw-bold text-truncate exp-cmp-header">
                                                    <i class="bi bi-columns-gap"></i>
                                                    第<span x-text="ch.chapterNumber"></span>章
                                                    <span x-text="ch.title || ''"></span>
                                                    <span class="fw-normal text-muted">· 扩写前后对照</span>
                                                </div>
                                                <div class="small text-muted mt-1 exp-cmp-stats"
                                                     x-show="!ch.cmpLoading && !ch.cmpError && ch.cmp.hasBefore">
                                                    <span x-text="'原文 ' + ch.cmp.beforeCount + ' 字'"></span>
                                                    <i class="bi bi-arrow-right mx-1"></i>
                                                    <span x-text="'扩写后 ' + ch.cmp.afterCount + ' 字'"></span>
                                                    <span class="badge rounded-pill ms-2 exp-cmp-delta" :class="deltaBadgeClass(ch)"
                                                          x-text="deltaText(ch)"></span>
                                                </div>
                                            </div>
                                            <div class="d-flex flex-wrap align-items-center gap-2">
                                                <div class="form-check form-switch mb-0"
                                                     x-show="!ch.cmpLoading && !ch.cmpError && ch.cmp.hasBefore">
                                                    <input class="form-check-input" type="checkbox"
                                                           :id="'expCmpHighlight' + ch.chapterNumber"
                                                           x-model="ch.cmpHighlight">
                                                    <label class="form-check-label small"
                                                           :for="'expCmpHighlight' + ch.chapterNumber">差异高亮</label>
                                                </div>
                                                <!-- 同步滚动：滚左栏时右栏按**同一句话**对齐（不是按百分比）。
                                                     ⚠️ 包一层 .sc-cmp-sync 是给 js/compare-panel.js 找开关用的，
                                                     它读这里的 input.checked 决定同不同步，别随手删。 -->
                                                <div class="form-check form-switch mb-0 sc-cmp-sync"
                                                     x-show="!ch.cmpLoading && !ch.cmpError && ch.cmp.hasBefore">
                                                    <input class="form-check-input" type="checkbox"
                                                           :id="'expCmpSync' + ch.chapterNumber"
                                                           x-model="ch.cmpSyncScroll">
                                                    <label class="form-check-label small"
                                                           :for="'expCmpSync' + ch.chapterNumber">同步滚动</label>
                                                </div>
                                                <button type="button"
                                                        class="btn btn-sm btn-outline-secondary exp-close-compare"
                                                        @click="closeCompare(ch)">
                                                    <i class="bi bi-x-lg"></i> 收起
                                                </button>
                                            </div>
                                        </div>

                                        <div x-show="ch.cmpLoading" class="text-center text-muted py-4">
                                            <span class="spinner-border spinner-border-sm me-1"></span>加载预览内容…
                                        </div>

                                        <div x-show="!ch.cmpLoading && ch.cmpError" class="alert alert-warning py-2 mb-0 small">
                                            <i class="bi bi-exclamation-triangle"></i>
                                            <span x-text="ch.cmpError"></span>
                                        </div>

                                        <div x-show="!ch.cmpLoading && !ch.cmpError && !ch.cmp.hasBefore"
                                             class="alert alert-secondary py-2 mb-0 small">
                                            <i class="bi bi-info-circle"></i>
                                            这一章没有可对比的原文备份（确认或回滚后备份会被清空）。
                                        </div>

                                        <!-- 句子一律逐句渲染：`:data-anc` 是对齐锚点（左右同一句同号），
                                             同步滚动靠它定位；关掉「差异高亮」只是不给上色 class，
                                             不退回整段纯文本，否则同步就退化成按百分比了。 -->
                                        <div class="row g-2" x-show="!ch.cmpLoading && !ch.cmpError && ch.cmp.hasBefore">
                                            <div class="col-12 col-lg-6">
                                                <div class="sc-cmp-pane-head">
                                                    <span>扩写前（原文）</span>
                                                    <span class="text-muted fw-normal" x-text="ch.cmp.beforeCount + ' 字'"></span>
                                                </div>
                                                <div class="sc-cmp-pane" @scroll="syncCompareScroll($event)">
                                                    <div><template x-for="(op, i) in ch.cmp.opsBefore" :key="'b' + i"><span :class="diffClass(op.t, ch.cmpHighlight)" :data-anc="op.k" x-text="op.s"></span></template></div>
                                                </div>
                                            </div>
                                            <div class="col-12 col-lg-6">
                                                <div class="sc-cmp-pane-head">
                                                    <span>扩写后</span>
                                                    <span class="text-muted fw-normal" x-text="ch.cmp.afterCount + ' 字'"></span>
                                                </div>
                                                <div class="sc-cmp-pane" @scroll="syncCompareScroll($event)">
                                                    <div><template x-for="(op, i) in ch.cmp.opsAfter" :key="'a' + i"><span :class="diffClass(op.t, ch.cmpHighlight)" :data-anc="op.k" x-text="op.s"></span></template></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </template>
                            </table>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ===================== 全部章节（按分卷） ===================== -->
    <div class="card">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="d-flex align-items-center gap-2">
                <i class="bi bi-book"></i>
                <strong>全部章节</strong>
                <span class="badge rounded-pill bg-light text-dark border">按分卷</span>
            </span>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggleAllVolumes()">
                    <i class="bi" :class="allVolumesExpanded ? 'bi-chevron-contract' : 'bi-chevron-expand'"></i>
                    <span x-text="allVolumesExpanded ? '全部折叠' : '全部展开'"></span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-primary" @click="toggleSelectAllChapters()"
                        :disabled="selectableChapters.length === 0">
                    <i class="bi" :class="allSelectableSelected ? 'bi-square' : 'bi-check-all'"></i>
                    <span x-text="allSelectableSelected ? '全部取消' : '全部选中'"></span>
                </button>
                <button type="button" class="btn btn-sm btn-primary" @click="addSelectedToQueue()"
                        :disabled="selectedChapters.length === 0">
                    <i class="bi bi-plus-lg"></i> 加入队列
                    <span x-show="selectedChapters.length" x-text="'(' + selectedChapters.length + ')'"></span>
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <!-- 骨架：分卷与章节列表要等引导数据，直接空态会闪一下「暂无章节」 -->
            <div x-show="booting" class="p-3">
                <span class="sc-skel sc-skel-line"></span>
                <span class="sc-skel sc-skel-line w-75"></span>
                <span class="sc-skel sc-skel-line w-50"></span>
            </div>
            <div class="p-4 text-center text-muted" x-show="!booting && groupedVolumes.length === 0" x-cloak>
                <i class="bi bi-book fs-4 d-block mb-1"></i>暂无章节
            </div>
            <template x-for="vol in groupedVolumes" :key="vol.volume">
                <div class="volume-group border-bottom">
                    <div class="d-flex align-items-center gap-2 px-3 py-2 bg-light">
                        <button class="btn btn-sm btn-link p-0 text-dark" type="button"
                                @click="toggleVolume(vol.volume)" style="text-decoration:none;">
                            <i class="bi" :class="isVolumeExpanded(vol.volume) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                        </button>
                        <input type="checkbox" class="form-check-input mt-0"
                               :checked="isVolumeSelected(vol.volume)"
                               x-effect="$el.indeterminate = volumeIndeterminate(vol.volume)"
                               :disabled="volumeSelectableChapters(vol.volume).length === 0"
                               @change="toggleVolumeSelect(vol.volume, $event.target.checked)"
                               :title="'级联选择' + vol.label + '内的章节'">
                        <span class="fw-bold" x-text="vol.label"></span>
                        <span class="text-muted small" x-text="'（' + vol.chapters.length + ' 章）'"></span>
                        <span class="text-muted small ms-auto"
                              x-text="volumeSelectedCount(vol.volume) + '/' + volumeSelectableChapters(vol.volume).length + ' 可加入'"></span>
                    </div>
                    <div x-show="isVolumeExpanded(vol.volume)" class="table-responsive">
                        <table class="table table-sm table-hover align-middle exp-table mb-0">
                            <thead>
                                <tr>
                                    <th style="width:40px;"></th>
                                    <th style="width:72px;" class="text-nowrap">章节</th>
                                    <th class="text-nowrap">标题</th>
                                    <th style="width:80px;" class="text-nowrap d-none d-sm-table-cell">字数</th>
                                    <th style="width:110px;" class="text-nowrap">扩写状态</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="ch in vol.chapters" :key="ch.chapterNumber">
                                    <tr>
                                        <td>
                                            <input type="checkbox" class="form-check-input"
                                                   :checked="selectedChapters.includes(ch.chapterNumber)"
                                                   :disabled="ch.expansionStatus === 'GENERATING' || ch.expansionStatus === 'EXPANDED' || !ch.hasContent"
                                                   @change="onChapterCheck(ch, $event.target.checked)"
                                                   :title="!ch.hasContent ? '该章还没有正文' : (ch.expansionStatus === 'EXPANDED' ? '已扩写，无需重复加入' : '勾选后可加入队列')">
                                        </td>
                                        <td class="text-nowrap" x-text="ch.chapterNumber"></td>
                                        <td class="text-truncate" style="max-width:520px;" :title="ch.title || '-'"
                                            x-text="ch.title || '-'"></td>
                                        <td class="d-none d-sm-table-cell" x-text="ch.wordCount"></td>
                                        <td>
                                            <span x-show="ch.expansionStatus" class="badge rounded-pill"
                                                  :class="statusBadgeClass(ch.expansionStatus)"
                                                  x-text="statusLabel(ch.expansionStatus)"></span>
                                            <span x-show="!ch.expansionStatus && !ch.hasContent" class="text-muted"
                                                  style="font-size:0.8rem;">无内容</span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ===================== 复用指导弹窗 ===================== -->
    <div class="modal fade" id="reuseGuidanceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-journal-arrow-down"></i> 复用扩写指导</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" id="reuseExpansionOnly"
                                   x-model="reuseExpansionOnly" @change="loadGuidanceLibrary()">
                            <label class="form-check-label small" for="reuseExpansionOnly">
                                只显示情节拓展的指导
                            </label>
                        </div>
                        <small class="text-muted" x-show="!guidanceLibraryLoading"
                               x-text="'共 ' + guidanceLibraryItems.length + ' 条'"></small>
                    </div>

                    <div x-show="guidanceLibraryLoading" class="text-center py-4">
                        <div class="spinner-border spinner-border-sm"></div>
                        <span class="ms-2 small text-muted">加载中...</span>
                    </div>

                    <div x-show="!guidanceLibraryLoading && guidanceLibraryItems.length === 0" class="text-center text-muted py-4">
                        <i class="bi bi-journal-x fs-4 d-block mb-1"></i>
                        <div class="small">
                            暂无可用的创作指导。<br>
                            先在本页「配置」一份扩写指导，再点「存为通用」，或去
                            <a href="/settings/guidances" target="_blank" rel="noopener">创作指导库</a> 新建。
                        </div>
                    </div>

                    <div x-show="!guidanceLibraryLoading && guidanceLibraryItems.length > 0"
                         class="list-group" style="max-height: 52vh; overflow-y: auto;">
                        <template x-for="item in guidanceLibraryItems" :key="item.id">
                            <label class="list-group-item list-group-item-action d-flex align-items-start gap-2"
                                   :class="{ 'active': String(selectedGuidanceId) === String(item.id) }">
                                <input type="radio" class="form-check-input mt-1" name="reuseGuidanceRadio"
                                       :value="item.id" x-model="selectedGuidanceId">
                                <div class="flex-grow-1 min-w-0">
                                    <div class="d-flex justify-content-between align-items-center gap-2">
                                        <strong class="text-truncate" x-text="item.name"></strong>
                                        <span class="badge rounded-pill bg-info flex-shrink-0" x-text="item.stepLabel"></span>
                                    </div>
                                    <small class="d-block mt-1 text-truncate"
                                           :class="String(selectedGuidanceId) === String(item.id) ? '' : 'text-muted'"
                                           :title="item.guidance"
                                           x-text="item.guidance.length > 160 ? item.guidance.substring(0, 160) + '...' : item.guidance"></small>
                                </div>
                            </label>
                        </template>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg"></i> 取消
                    </button>
                    <button type="button" class="btn btn-sm btn-primary" @click="applyReuseGuidance()"
                            :disabled="!selectedGuidanceId">
                        <i class="bi bi-check-lg"></i> 使用选中指导
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // 项目 id 同步从路径取：页头链接和接口地址不必等引导数据
    const PROJECT_ID = location.pathname.split('/')[2];
    // 情节拓展在创作指导库里的分类（对应 GuidanceLibraryStep.EXPANSION）
    const GUIDANCE_STEP = 'EXPANSION';

    function expansionPage() {
        return {
            // 引导数据还在路上：页面骨架先顶上，避免「先闪一下空队列再冒出章节」
            booting: true,
            /* 队列默认露出多少行（与 CSS 的 --exp-queue-rows 保持一致）：
               超过这个数才提示「列表内可滚动」。
               窄屏 CSS 收到 8 行，这里不跟着变 —— 阈值取宽屏那个值：
               宁可少提示一次，也不要在宽屏上看着只有 10 行还挂一句「可滚动」。 */
            queueVisibleRows: 12,
            projectTitle: '',
            readUrl: '/projects/' + PROJECT_ID + '/read',
            workflowUrl: '/projects/' + PROJECT_ID + '/workflow/world-building',
            guidance: '',
            // 指导编辑态
            editingGuidance: false,
            guidanceEdit: '',
            /* 编辑框是否已点过【展开】按内容撑高；guidanceBaseHeight 记「默认行数」时的高度，
               展开时取 max(内容高度, 默认高度) —— 内容比默认还短就保持原高，不做反向收缩。 */
            guidanceExpanded: false,
            guidanceBaseHeight: 0,
            savingGuidance: false,
            savingShared: false,
            // 复用指导
            guidanceLibraryItems: [],
            guidanceLibraryLoading: false,
            reuseExpansionOnly: true,
            selectedGuidanceId: null,
            // 任务态
            active: false,
            refreshing: false,
            /* 正在背后补拉章节状态（见 resyncChapters）；同时只能跑一个，别叠请求 */
            resyncing: false,
            pendingCount: 0,
            expandedCount: 0,
            streamContent: '',
            // 扩写前后预览：**每章一份状态**，可以同时展开多个面板。
            // cmpOpen/cmpLoading/cmpError/cmpHighlight/cmpSyncScroll/cmp 都挂在章节对象上，
            // 面板直接读 ch.cmp.*，不需要再按章号去查表，也不会互相串数据。
            allChapters: [],
            selectedChapters: [],
            volumeGroups: [],
            chaptersPerVolume: 10,
            expandedVolumes: {},
            /* 队列里各分卷的折叠状态：**与上方「全部章节」的 expandedVolumes 分开**。
               两处共用一份的话，在队列里折一卷会把下面「全部章节」同一卷也跟着折起来。 */
            queueVolExpanded: {},
            eventSource: null,
            pollTimer: null,

            async init() {
                // 引导数据是异步的：骨架屏先出来，这里 await 之后再把章节/分卷填进去。
                // 失败时 loadExpansionData 内部已兜成空队列，页面仍可用（可以刷新或重新标记）。
                const data = (typeof window.loadExpansionData === 'function')
                    ? await window.loadExpansionData()
                    : (window.__EXPANSION_DATA__ || {});
                this.applyBootstrap(data || {});
                this.updateCounts();
                // 首次拉真实状态，恢复后台任务时按钮可用
                this.pollStatus();
                this.pollTimer = setInterval(() => this.pollStatus(), 5000);
                // ★ 数据铺完才收骨架：否则用户抢在数据到达前点「开始扩写」，
                //   随后到达的空章节列表会把刚标记的章节冲掉（chat 页踩过同样的坑）
                this.booting = false;
            },

            /** 把引导数据铺到页面上（章节对象顺带带上各自独立的预览面板状态） */
            applyBootstrap(d) {
                this.projectTitle = d.projectTitle || '';
                this.guidance = d.expansionGuidance || '';
                this.chaptersPerVolume = d.chaptersPerVolume || 10;
                this.volumeGroups = d.volumes || [];
                this.allChapters = (d.chapters || []).map(ch => ({
                    chapterNumber: ch.chapterNumber,
                    title: ch.title,
                    wordCount: ch.wordCount,
                    expansionStatus: ch.expansionStatus,
                    hasContent: ch.content != null,
                    cmpOpen: false,
                    cmpLoading: false,
                    cmpError: '',
                    cmpHighlight: true,
                    // 同步滚动默认开：滚左栏时右栏按「同一句话」对齐（关掉就各滚各的）
                    cmpSyncScroll: true,
                    cmp: this.emptyCompare()
                }));
                this.expandedVolumes = this.defaultExpandedVolumes();
            },

            /** 默认展开全部分卷：首屏「第 N 卷」按钮的文案才对 */
            defaultExpandedVolumes() {
                const m = {};
                if (this.volumeGroups && this.volumeGroups.length > 0) {
                    this.volumeGroups.forEach(v => { m[v.volumeNumber] = true; });
                    return m;
                }
                const per = this.chaptersPerVolume || 10;
                this.allChapters.forEach(ch => { m[Math.ceil(ch.chapterNumber / per)] = true; });
                return m;
            },

            destroy() {
                if (this.pollTimer) clearInterval(this.pollTimer);
                if (this.eventSource) this.eventSource.close();
            },

            /* ===================== 扩写指导 ===================== */

            startEditGuidance() {
                this.guidanceEdit = this.guidance || '';
                this.guidanceExpanded = false;   // 每次进编辑态都从默认行数开始
                this.editingGuidance = true;
            },

            cancelEditGuidance() {
                this.editingGuidance = false;
                this.guidanceExpanded = false;
                this.guidanceEdit = this.guidance || '';
            },

            /**
             * 【展开】/【收起】：按内容自动撑高编辑框（不用在固定高度里来回滚）。
             * - 展开：先把 height 清成 auto 量 scrollHeight，再取 max(内容高, 默认高) —— 内容比 20 行还短就
             *   保持默认高度，不做反向收缩（否则框会突然矮一截，像被压缩了）。
             * - 收起：清掉行内 height，交回 CSS 变量算出的默认行数。
             * 高度都写行内 style，与 .exp-guidance-edit 的 CSS 高度是覆盖关系，清空即还原。
             */
            toggleGuidanceExpand() {
                const el = this.$refs.guidanceTextarea;
                if (!el) return;
                if (this.guidanceExpanded) {
                    this.guidanceExpanded = false;
                    el.style.height = '';
                    el.style.overflowY = '';
                    return;
                }
                // 此刻还是默认行数的高度，先记下来当展开后的下限
                this.guidanceBaseHeight = el.clientHeight + 2;   // +2 = 上下各 1px 边框，clientHeight 不含边框
                this.guidanceExpanded = true;
                this.resizeGuidanceBox(true);
            },

            /** 展开态下内容变了就跟着长／缩；收起态什么都不做（交给 CSS） */
            syncGuidanceHeight() {
                if (!this.guidanceExpanded) return;
                this.resizeGuidanceBox(false);
            },

            resizeGuidanceBox(measureBase) {
                const el = this.$refs.guidanceTextarea;
                if (!el) return;
                const prev = el.style.height;
                el.style.height = 'auto';           // 先解除固定高度，scrollHeight 才是内容的真实高度
                const need = el.scrollHeight;       // 含上下内边距，正是 height 需要的值
                el.style.height = prev;             // 还原，避免中间态被浏览器算进布局抖动
                const base = measureBase ? this.guidanceBaseHeight : (this.guidanceBaseHeight || need);
                el.style.height = Math.max(need, base) + 'px';
                el.style.overflowY = 'hidden';      // 已经撑到内容高度，不该再出现内部滚动条
            },

            async saveGuidance() {
                this.savingGuidance = true;
                try {
                    const resp = await fetch(`/projects/${PROJECT_ID}/expansion/guidance`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({guidance: this.guidanceEdit})
                    });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    this.guidance = this.guidanceEdit;
                    this.editingGuidance = false;
                    this.guidanceExpanded = false;   // 编辑框整块销毁，别把展开态带到下一次
                    SC.toast.success('扩写指导已保存');
                } catch (e) {
                    SC.toast.error('保存失败：' + e.message);
                } finally {
                    this.savingGuidance = false;
                }
            },

            /** 把当前扩写指导存进创作指导库（分类=情节拓展），供其他项目复用 */
            async saveGuidanceAsShared() {
                const text = (this.guidance || '').trim();
                if (!text) {
                    SC.toast.warn('请先配置扩写指导');
                    return;
                }
                if (this.editingGuidance) {
                    SC.toast.warn('请先保存配置，再存为通用');
                    return;
                }
                this.savingShared = true;
                try {
                    const fd = new FormData();
                    fd.append('projectId', PROJECT_ID);
                    fd.append('step', GUIDANCE_STEP);
                    const resp = await fetch('/settings/guidances/save-from-project', {method: 'POST', body: fd});
                    const data = await resp.json().catch(() => ({}));
                    if (!resp.ok || data.error) throw new Error(data.error || ('HTTP ' + resp.status));
                    SC.toast.success('已存为通用指导：' + (data.name || ''));
                } catch (e) {
                    SC.toast.error('存为通用失败：' + e.message);
                } finally {
                    this.savingShared = false;
                }
            },

            openReuseModal() {
                this.selectedGuidanceId = null;
                this.loadGuidanceLibrary();
                const el = document.getElementById('reuseGuidanceModal');
                if (el) bootstrap.Modal.getOrCreateInstance(el).show();
            },

            loadGuidanceLibrary() {
                this.guidanceLibraryLoading = true;
                let url = '/settings/guidances/list-json';
                if (this.reuseExpansionOnly) url += '?step=' + GUIDANCE_STEP;
                fetch(url)
                    .then(r => r.ok ? r.json() : [])
                    .then(list => { this.guidanceLibraryItems = Array.isArray(list) ? list : []; })
                    .catch(() => { this.guidanceLibraryItems = []; })
                    .finally(() => { this.guidanceLibraryLoading = false; });
            },

            async applyReuseGuidance() {
                const item = this.guidanceLibraryItems.find(i => String(i.id) === String(this.selectedGuidanceId));
                if (!item) return;
                try {
                    const resp = await fetch(`/projects/${PROJECT_ID}/expansion/guidance`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({guidance: item.guidance})
                    });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    this.guidance = item.guidance;
                    this.guidanceEdit = item.guidance;
                    this.editingGuidance = false;
                    this.guidanceExpanded = false;
                    const el = document.getElementById('reuseGuidanceModal');
                    const inst = el ? bootstrap.Modal.getInstance(el) : null;
                    if (inst) inst.hide();
                    SC.toast.success('已应用指导：' + item.name);
                } catch (e) {
                    SC.toast.error('应用失败：' + e.message);
                }
            },

            /* ===================== 队列与章节 ===================== */

            get filteredChapters() {
                return this.allChapters.filter(ch => ch.expansionStatus != null);
            },

            /**
             * 队列按分卷分组：卷划分与卷名**直接复用 groupedVolumes**（后端分卷绑定优先，
             * 没有绑定才退回「每 N 章一卷」），只把「已进队列」的章节留下。
             * 空卷直接丢掉 —— 队列里出现一个「（0 章）」的卷头只会让人困惑。
             */
            get queueVolumes() {
                const vols = [];
                for (const g of this.groupedVolumes) {
                    const chapters = g.chapters.filter(ch => ch.expansionStatus != null);
                    if (chapters.length === 0) continue;
                    vols.push({
                        volume: g.volume,
                        label: g.label,
                        chapters: chapters,
                        pending: chapters.filter(c => c.expansionStatus === 'PENDING').length,
                        generating: chapters.filter(c => c.expansionStatus === 'GENERATING').length,
                        expanded: chapters.filter(c => c.expansionStatus === 'EXPANDED').length
                    });
                }
                return vols;
            },

            /** 有任意一章的预览面板开着 ⇒ 队列切成「不限高」的阅读态（同一时刻只留一层滚动） */
            get anyCompareOpen() {
                return this.allChapters.some(ch => ch.cmpOpen);
            },

            isQueueVolumeExpanded(vol) {
                return this.queueVolExpanded[vol] === undefined ? true : this.queueVolExpanded[vol];
            },

            toggleQueueVolume(vol) {
                const next = !this.isQueueVolumeExpanded(vol);
                this.queueVolExpanded[vol] = next;
                if (!next) this.collapseCompareInVolume(vol);
            },

            /**
             * 折叠某卷时，把卷内已打开的预览面板一起收起。
             * 面板是行内的，卷折起来时它跟着消失没关系；但状态留在 cmpOpen=true 的话，
             * 下次展开这一卷所有面板会同时弹回来（还各自拉一次 diff），既慢又乱。
             */
            collapseCompareInVolume(vol) {
                const g = this.groupedVolumes.find(v => v.volume === vol);
                if (!g) return;
                g.chapters.forEach(ch => { if (ch.cmpOpen) this.closeCompare(ch); });
            },

            get allQueueVolumesExpanded() {
                const vols = this.queueVolumes;
                return vols.length > 0 && vols.every(v => this.isQueueVolumeExpanded(v.volume));
            },

            toggleAllQueueVolumes() {
                const expand = !this.allQueueVolumesExpanded;
                this.queueVolumes.forEach(v => {
                    this.queueVolExpanded[v.volume] = expand;
                    if (!expand) this.collapseCompareInVolume(v.volume);
                });
            },

            get selectableChapters() {
                // 可勾选加入队列的章节：有内容且不在 GENERATING/EXPANDED
                return this.allChapters.filter(ch =>
                    ch.hasContent && ch.expansionStatus !== 'GENERATING' && ch.expansionStatus !== 'EXPANDED');
            },

            get allSelectableSelected() {
                const sel = this.selectableChapters;
                return sel.length > 0 && sel.every(ch => this.selectedChapters.includes(ch.chapterNumber));
            },

            // 按分卷对全部章节分组：优先使用后端下发的分卷分组（chapters.volume_id 绑定，
            // 用户可在「分卷管理」页手工调整）；没有分组数据时才退回「每 chaptersPerVolume 章一卷」的旧公式
            get groupedVolumes() {
                if (this.volumeGroups && this.volumeGroups.length > 0) {
                    const byNumber = new Map(this.allChapters.map(ch => [ch.chapterNumber, ch]));
                    const vols = [];
                    for (const g of this.volumeGroups) {
                        const chapters = (g.chapterNumbers || [])
                            .map(n => byNumber.get(n))
                            .filter(Boolean)
                            .sort((a, b) => a.chapterNumber - b.chapterNumber);
                        if (chapters.length === 0) continue;
                        const label = (g.title && String(g.title).trim()) ? String(g.title) : ('第' + g.volumeNumber + '卷');
                        vols.push({volume: g.volumeNumber, label: label, chapters: chapters});
                    }
                    if (vols.length > 0) return vols;
                }
                const perVol = this.chaptersPerVolume || 10;
                const map = new Map();
                for (const ch of this.allChapters) {
                    const vol = Math.ceil(ch.chapterNumber / perVol);
                    if (!map.has(vol)) map.set(vol, []);
                    map.get(vol).push(ch);
                }
                const vols = [];
                Array.from(map.keys()).sort((a, b) => a - b).forEach(k => {
                    vols.push({volume: k, label: '第' + k + '卷', chapters: map.get(k)});
                });
                return vols;
            },

            isVolumeExpanded(vol) {
                return this.expandedVolumes[vol] === undefined ? true : this.expandedVolumes[vol];
            },

            toggleVolume(vol) {
                this.expandedVolumes[vol] = !this.isVolumeExpanded(vol);
            },

            get allVolumesExpanded() {
                const vols = this.groupedVolumes;
                return vols.length > 0 && vols.every(v => this.isVolumeExpanded(v.volume));
            },

            toggleAllVolumes() {
                const expand = !this.allVolumesExpanded;
                this.groupedVolumes.forEach(v => { this.expandedVolumes[v.volume] = expand; });
            },

            // 某卷内「可被加入队列」的章节（有内容且未在 GENERATING/EXPANDED）
            volumeSelectableChapters(vol) {
                const group = this.groupedVolumes.find(v => v.volume === vol);
                if (!group) return [];
                return group.chapters.filter(ch =>
                    ch.hasContent && ch.expansionStatus !== 'GENERATING' && ch.expansionStatus !== 'EXPANDED');
            },

            // 该卷是否整卷（全部可选项）已选
            isVolumeSelected(vol) {
                const sel = this.volumeSelectableChapters(vol);
                return sel.length > 0 && sel.every(ch => this.selectedChapters.includes(ch.chapterNumber));
            },

            // 该卷是否处于部分选中（半选）状态
            volumeIndeterminate(vol) {
                const sel = this.volumeSelectableChapters(vol);
                if (sel.length === 0) return false;
                const count = sel.filter(ch => this.selectedChapters.includes(ch.chapterNumber)).length;
                return count > 0 && count < sel.length;
            },

            volumeSelectedCount(vol) {
                const sel = this.volumeSelectableChapters(vol);
                return sel.filter(ch => this.selectedChapters.includes(ch.chapterNumber)).length;
            },

            // 级联选择：勾选分卷复选框 → 选中/取消该卷内所有可选项章节
            toggleVolumeSelect(vol, checked) {
                if (checked) {
                    const nums = this.volumeSelectableChapters(vol).map(ch => ch.chapterNumber);
                    const merged = new Set([...this.selectedChapters, ...nums]);
                    this.selectedChapters = Array.from(merged);
                } else {
                    const sel = new Set(this.volumeSelectableChapters(vol).map(ch => ch.chapterNumber));
                    this.selectedChapters = this.selectedChapters.filter(n => !sel.has(n));
                }
            },

            statusBadgeClass(status) {
                switch(status) {
                    case 'PENDING': return 'bg-warning text-dark';
                    case 'GENERATING': return 'bg-info text-dark';
                    case 'EXPANDED': return 'bg-success';
                    default: return 'bg-secondary';
                }
            },

            statusLabel(status) {
                switch(status) {
                    case 'PENDING': return '待扩写';
                    case 'GENERATING': return '扩写中';
                    case 'EXPANDED': return '已扩写';
                    default: return status || '-';
                }
            },

            /* 卡片头那个【刷新】按钮：只补状态，不整页重载。
               重载会把实时日志、勾选、展开的分卷和打开的对照面板一起丢掉，
               而章节状态本来就能按需同步（先补章节再拉计数，避免补完计数又对不上）。 */
            async refreshStatus() {
                if (this.refreshing) return;
                this.refreshing = true;
                try {
                    await this.resyncChapters();
                    await this.pollStatus();
                } finally {
                    this.refreshing = false;
                }
            },

            async pollStatus() {
                try {
                    const resp = await fetch(`/projects/${PROJECT_ID}/expansion/status`);
                    const data = await resp.json();
                    this.active = data.active;
                    // 后台在跑但前端没连 SSE，补连
                    if (data.active && !this.eventSource) {
                        this.connectStream();
                    }
                    // 后台已停但还连着 SSE，关闭
                    if (!data.active && this.eventSource) {
                        this.eventSource.close();
                        this.eventSource = null;
                    }
                    /* ★ 服务器计数和本地行对不上 ⇒ 漏了 chapter-saved 事件（断线重连、标签页在后台
                       被节流、SSE 被中间层掐断都会漏）。以前这里直接把服务器计数写进徽标、行状态却不动，
                       结果就是「5 已扩写」和满屏「扩写中」同时挂着，只能手动刷新。
                       现在一旦对不上就地补一次章节状态：徽标与表格永远出自同一份数据。 */
                    if (!this.booting && !this.resyncing) {
                        const localPending = this.allChapters.filter(c => c.expansionStatus === 'PENDING').length;
                        const localExpanded = this.allChapters.filter(c => c.expansionStatus === 'EXPANDED').length;
                        if (localPending !== data.pendingCount || localExpanded !== data.expandedCount) {
                            this.resyncChapters();
                        }
                    }
                    this.pendingCount = data.pendingCount;
                    this.expandedCount = data.expandedCount;
                } catch (e) {
                    // 忽略瞬时网络错误，下次轮询重试
                }
            },

            /**
             * 用服务器下发的章节状态就地修正本地行。
             * 只动「扩写状态 / 字数 / 有没有正文」三样，不碰预览面板（ch.cmp*）、不动勾选 ——
             * 用户正开着对照面板时被刷新一次、面板内容突然空掉，比看到旧状态还难受。
             * @returns {boolean} 是否真的改了东西
             */
            applyChapterStates(list) {
                if (!Array.isArray(list)) return false;
                const byNum = new Map(list.map(c => [c.chapterNumber, c]));
                let changed = false;
                this.allChapters.forEach(ch => {
                    const s = byNum.get(ch.chapterNumber);
                    if (!s) return;
                    if (ch.expansionStatus !== s.expansionStatus) {
                        ch.expansionStatus = s.expansionStatus;
                        // 章被确认/回滚（状态清空）后就离开了队列，撑开的面板要跟着收掉
                        if (!s.expansionStatus) ch.cmpOpen = false;
                        changed = true;
                    }
                    if (s.wordCount != null && ch.wordCount !== s.wordCount) ch.wordCount = s.wordCount;
                    if (s.content != null) ch.hasContent = true;
                });
                if (changed) this.updateCounts();
                return changed;
            },

            /** 补拉一次章节状态。走 /data：里面的 content 只是个「有没有正文」的标记，不会带正文。 */
            async resyncChapters() {
                if (this.resyncing) return;
                this.resyncing = true;
                try {
                    const resp = await fetch(`/projects/${PROJECT_ID}/expansion/data`);
                    if (!resp.ok) return;
                    const data = await resp.json();
                    this.applyChapterStates(data.chapters || []);
                } catch (e) {
                    // 拉不到就等下一轮轮询 / 下一次事件
                } finally {
                    this.resyncing = false;
                }
            },

            async startExpansion() {
                /* 后端会直接拒绝（项目已完本 / 已废弃），这里必须看响应 ——
                   原来不看返回值，被拒了也会「假装已开始」并去连一条根本不存在的流。 */
                const resp = await fetch(`/projects/${PROJECT_ID}/expansion/start`, { method: 'POST' });
                if (!resp.ok) {
                    let msg = '启动失败';
                    try {
                        const data = await resp.json();
                        msg = data.error || data.message || msg;
                    } catch (e) { /* 非 JSON 响应就用默认文案 */ }
                    SC.toast.warn(msg);
                    return;
                }
                this.active = true;
                this.streamContent = '';
                this.connectStream();
                SC.toast.info('已开始批量扩写');
            },

            async stopExpansion() {
                await fetch(`/projects/${PROJECT_ID}/expansion/stop`, {method: 'POST'});
                this.active = false;
                SC.toast.info('已请求停止，当前章节处理完即停');
                // 不主动关 EventSource，让后台 stopped 事件驱动 refreshStatus
            },

            async confirmAll() {
                const total = this.expandedCount;
                if (total === 0) return;
                const ok = await SC.confirm({
                    title: '批量确认',
                    message: '确认全部 ' + total + ' 章已扩写？将清空它们的扩写状态（正文保留）。',
                    confirmText: '确认全部'
                });
                if (!ok) return;
                await fetch(`/projects/${PROJECT_ID}/expansion/confirm-all`, {method: 'POST'});
                this.allChapters.forEach(ch => {
                    if (ch.expansionStatus === 'EXPANDED') {
                        ch.expansionStatus = null;
                        ch.cmpOpen = false;     // 章已离开队列，面板跟着收掉
                    }
                });
                this.updateCounts();
                SC.toast.success('已确认 ' + total + ' 章');
            },

            connectStream() {
                if (this.eventSource) this.eventSource.close();
                this.eventSource = new EventSource(`/projects/${PROJECT_ID}/expansion/stream`);

                this.eventSource.addEventListener('token', (e) => {
                    this.streamContent += e.data;
                    this.scrollStream();
                });
                this.eventSource.addEventListener('replay-buffer', (e) => {
                    this.streamContent = e.data;
                    this.scrollStream();
                });
                this.eventSource.addEventListener('expand-section', (e) => {
                    const match = e.data.match(/\[\[EXPAND:CHAPTER:(\d+)\]\]/);
                    if (match) {
                        this.streamContent += '\n\n--- 正在扩写第' + match[1] + '章 ---\n';
                        const chNum = parseInt(match[1]);
                        const ch = this.allChapters.find(c => c.chapterNumber === chNum);
                        if (ch) ch.expansionStatus = 'GENERATING';
                    }
                    this.scrollStream();
                });
                /* ★ 单章落库：后端存完 EXPANDED 立刻发这条，行当场翻状态。
                   没有它就只能等整批 done —— 几十章跑一小时，就一小时看不出进度。 */
                this.eventSource.addEventListener('chapter-saved', (e) => {
                    const m = String(e.data || '').match(/\[\[EXPAND:SAVED:(\d+)(?::(\d+))?\]\]/);
                    if (!m) return;
                    const num = parseInt(m[1], 10);
                    const words = m[2] ? parseInt(m[2], 10) : 0;
                    const ch = this.allChapters.find(c => c.chapterNumber === num);
                    if (ch) {
                        ch.expansionStatus = 'EXPANDED';
                        if (words > 0) ch.wordCount = words;
                        this.updateCounts();
                    }
                    this.streamContent += '\n--- 第' + num + '章 扩写完成'
                        + (words > 0 ? '（' + words + ' 字）' : '') + ' ---\n';
                    this.scrollStream();
                });
                /* 整批结束：不再整页重载。
                   行状态已经是实时的了，重载只会把实时日志、勾选、展开的分卷和对照面板一起丢掉。
                   这里补一次状态即可，兜住期间漏掉的事件。 */
                this.eventSource.addEventListener('done', (e) => {
                    this.active = false;
                    this.eventSource.close();
                    this.eventSource = null;
                    this.resyncChapters();
                });
                this.eventSource.addEventListener('stopped', (e) => {
                    this.active = false;
                    this.eventSource.close();
                    this.eventSource = null;
                    this.resyncChapters();
                });
                this.eventSource.addEventListener('error', (e) => {
                    this.active = false;
                    if (this.eventSource) {
                        this.eventSource.close();
                        this.eventSource = null;
                    }
                    if (e.data) {
                        this.streamContent += '\n[错误] ' + e.data;
                        /* 后端 doOnError 会把这一章退回 PENDING 并中止整批；前端不跟着退的话，
                           这一行会永远停在「扩写中」转圈（批量是串行的，同时最多一个 GENERATING） */
                        this.allChapters.forEach(c => {
                            if (c.expansionStatus === 'GENERATING') c.expansionStatus = 'PENDING';
                        });
                        this.updateCounts();
                        this.resyncChapters();
                    }
                });
            },

            scrollStream() {
                this.$nextTick(() => {
                    const box = this.$refs.streamBox;
                    if (box) box.scrollTop = box.scrollHeight;
                });
            },

            async toggleMark(chapterNumber, checked) {
                await fetch(`/projects/${PROJECT_ID}/expansion/mark`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chapterNumbers: [chapterNumber], marked: checked})
                });
                const ch = this.allChapters.find(c => c.chapterNumber === chapterNumber);
                if (ch) ch.expansionStatus = checked ? 'PENDING' : null;
                this.updateCounts();
            },

            async unmarkChapter(chapterNumber) {
                await this.toggleMark(chapterNumber, false);
            },

            onChapterCheck(ch, checked) {
                // 已在队列的章勾选状态由 toggleMark 管理；这里只维护 selectedChapters
                if (checked) {
                    if (!this.selectedChapters.includes(ch.chapterNumber)) {
                        this.selectedChapters.push(ch.chapterNumber);
                    }
                } else {
                    this.selectedChapters = this.selectedChapters.filter(n => n !== ch.chapterNumber);
                }
            },

            toggleSelectAll(checked) {
                if (checked) {
                    const nums = this.selectableChapters.map(ch => ch.chapterNumber);
                    const merged = new Set([...this.selectedChapters, ...nums]);
                    this.selectedChapters = Array.from(merged);
                } else {
                    const sel = new Set(this.selectableChapters.map(ch => ch.chapterNumber));
                    this.selectedChapters = this.selectedChapters.filter(n => !sel.has(n));
                }
            },

            async addSelectedToQueue() {
                // 只提交尚未在队列(PENDING)的选中章
                const toAdd = this.selectedChapters.filter(num => {
                    const ch = this.allChapters.find(c => c.chapterNumber === num);
                    return ch && !ch.expansionStatus;
                });
                if (toAdd.length === 0) {
                    this.selectedChapters = [];
                    return;
                }
                await fetch(`/projects/${PROJECT_ID}/expansion/mark`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chapterNumbers: toAdd, marked: true})
                });
                toAdd.forEach(num => {
                    const ch = this.allChapters.find(c => c.chapterNumber === num);
                    if (ch) ch.expansionStatus = 'PENDING';
                });
                this.selectedChapters = [];
                this.updateCounts();
                SC.toast.success('已加入队列 ' + toAdd.length + ' 章');
            },

            async removeAllPending() {
                const pending = this.allChapters
                    .filter(ch => ch.expansionStatus === 'PENDING')
                    .map(ch => ch.chapterNumber);
                if (pending.length === 0) return;
                const ok = await SC.confirm({
                    title: '批量移除',
                    message: '把 ' + pending.length + ' 章移出扩写队列？已扩写的内容不受影响。',
                    confirmText: '全部移除',
                    danger: true
                });
                if (!ok) return;
                await fetch(`/projects/${PROJECT_ID}/expansion/mark`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chapterNumbers: pending, marked: false})
                });
                pending.forEach(num => {
                    const ch = this.allChapters.find(c => c.chapterNumber === num);
                    if (ch) ch.expansionStatus = null;
                });
                this.updateCounts();
                SC.toast.success('已移除 ' + pending.length + ' 章');
            },

            // 全部选中 / 全部取消：仅切换勾选状态，不涉及后端标记与队列
            toggleSelectAllChapters() {
                if (this.allSelectableSelected) {
                    this.selectedChapters = [];
                } else {
                    const nums = this.selectableChapters.map(ch => ch.chapterNumber);
                    const merged = new Set([...this.selectedChapters, ...nums]);
                    this.selectedChapters = Array.from(merged);
                }
            },

            async rollbackChapter(chapterNumber) {
                const ok = await SC.confirm({
                    title: '回滚第' + chapterNumber + '章',
                    message: '将恢复扩写前的原文，扩写结果会被丢弃。确定回滚？',
                    confirmText: '回滚',
                    danger: true
                });
                if (!ok) return;
                await fetch(`/projects/${PROJECT_ID}/expansion/rollback/${chapterNumber}`, {method: 'POST'});
                const ch = this.allChapters.find(c => c.chapterNumber === chapterNumber);
                if (ch) {
                    ch.expansionStatus = 'PENDING';
                    // 回滚会清空原文备份，预览面板失去意义
                    ch.cmpOpen = false;
                }
                this.updateCounts();
                SC.toast.success('已回滚第' + chapterNumber + '章');
            },

            async confirmChapter(chapterNumber) {
                await fetch(`/projects/${PROJECT_ID}/expansion/confirm/${chapterNumber}`, {method: 'POST'});
                const ch = this.allChapters.find(c => c.chapterNumber === chapterNumber);
                if (ch) {
                    ch.expansionStatus = null;
                    ch.cmpOpen = false;
                }
                this.updateCounts();
                SC.toast.success('已确认第' + chapterNumber + '章');
            },

            /* ===================== 扩写前后预览 ===================== */

            /** 点「预览」：展开这一章的面板（其它章的面板不受影响，可同时展开多个） */
            async toggleCompare(ch) {
                if (ch.cmpOpen) {
                    this.closeCompare(ch);
                    return;
                }
                ch.cmpOpen = true;
                ch.cmpError = '';
                ch.cmpLoading = true;
                ch.cmp = this.emptyCompare();
                // 队列长时面板可能落在视口外，开出来后轻轻滚进视野（不打断当前滚动位置）
                this.$nextTick(() => {
                    const panel = document.getElementById('exp-cmp-' + ch.chapterNumber);
                    if (panel) panel.scrollIntoView({block: 'nearest'});
                });
                try {
                    const resp = await fetch(`/projects/${PROJECT_ID}/expansion/compare/${ch.chapterNumber}`);
                    const data = await resp.json().catch(() => ({}));
                    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                    // 期间用户可能已经把这章的面板收起来了，就别再往回填内容
                    if (!ch.cmpOpen) return;
                    const beforeText = data.before || '';
                    const afterText = data.after || '';
                    // 差异算法在共享组件里（js/compare-panel.js），三个页面同一套句级 LCS
                    const pair = SCCmp.preparePair(beforeText, afterText, {
                        beforeCount: data.beforeWordCount,
                        afterCount: data.afterWordCount,
                        highlight: ch.cmpHighlight
                    });
                    pair.hasBefore = data.hasBefore !== false;
                    ch.cmp = pair;
                } catch (e) {
                    ch.cmpError = '预览内容加载失败：' + e.message;
                } finally {
                    ch.cmpLoading = false;
                }
            },

            emptyCompare() {
                return {
                    hasBefore: true, beforeText: '', afterText: '',
                    beforeCount: 0, afterCount: 0,
                    opsBefore: [], opsAfter: []
                };
            },

            closeCompare(ch) {
                ch.cmpOpen = false;
                ch.cmpError = '';
                ch.cmpLoading = false;
            },

            /** 左右滚动同步：实现在共享组件里（按滚动占比同步；窄屏上下堆叠时各滚各的） */
            syncCompareScroll(ev) {
                SCCmp.syncScroll(ev);
            },

            /** 差异上色：第二个参数传 false 时一律不上色（「差异高亮」关掉，但句子 span 仍保留） */
            diffClass(kind, enabled) {
                return SCCmp.diffClass(kind, enabled);
            },

            deltaBadgeClass(ch) {
                return SCCmp.deltaClass(ch.cmp.beforeCount, ch.cmp.afterCount);
            },

            deltaText(ch) {
                return SCCmp.deltaText(ch.cmp.beforeCount, ch.cmp.afterCount);
            },

            updateCounts() {
                this.pendingCount = this.allChapters.filter(ch => ch.expansionStatus === 'PENDING').length;
                this.expandedCount = this.allChapters.filter(ch => ch.expansionStatus === 'EXPANDED').length;
            }
        };
    }
</script>

    <script src="/vendor/alpinejs/cdn.min.js" defer></script>
