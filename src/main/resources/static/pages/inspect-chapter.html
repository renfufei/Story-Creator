<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>章节透视</title>
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body { margin: 0; }
        .inspect-sidebar {
            width: 240px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            padding: 1rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .inspect-sidebar.collapsed { transform: translateX(-100%); }
        .inspect-main {
            margin-left: 240px;
            padding: 1.5rem 2rem;
            transition: margin-left 0.3s ease;
        }
        .inspect-main.expanded { margin-left: 0; }
        .toggle-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1100;
            transition: left 0.3s ease;
        }
        .toggle-btn.shifted { left: 250px; }
        .toc-link {
            display: block;
            padding: 0.25rem 0.5rem;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .toc-link:hover { background: #e9ecef; }
        .toc-link.active { background: #0d6efd; color: #fff; }
        .volume-title { font-size: 0.75rem; color: #6c757d; padding: 0.5rem 0.5rem 0.15rem; font-weight: 600; }
        .field-content { white-space: pre-wrap; max-height: 65vh; overflow-y: auto; font-size: 0.9rem; line-height: 1.7; }
        .tab-badge { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 4px; }
        .tab-badge.available { background: #198754; }
        .nav-link.disabled { opacity: 0.5; }
        .compare-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .compare-container > div { border: 1px solid #dee2e6; border-radius: 4px; padding: 1rem; max-height: 65vh; overflow-y: auto; }
    </style>
</head>
<body x-data="inspectChapter()" x-init="init()">
    <!-- Toggle Button -->
    <button class="btn btn-sm btn-outline-secondary toggle-btn"
            :class="sidebarOpen ? 'shifted' : ''"
            @click="sidebarOpen = !sidebarOpen">
        <i class="bi" :class="sidebarOpen ? 'bi-chevron-left' : 'bi-list'"></i>
    </button>

    <!-- Sidebar -->
    <aside class="inspect-sidebar" :class="!sidebarOpen ? 'collapsed' : ''">
        <div class="mb-3">
            <a :href="'/projects/' + projectId + '/inspect'" class="btn btn-sm btn-outline-secondary w-100 mb-2">
                <i class="bi bi-arrow-left"></i> 返回总览
            </a>
            <small class="text-muted" x-text="projectTitle">项目名</small>
        </div>
        <hr>
        <nav>
            <template x-for="ch in chapterMetas" :key="ch.number + '_' + (ch.volumeTitle || '')">
                <div>
                    <div x-show="ch.volumeTitle != null" class="volume-title" x-text="ch.volumeTitle"></div>
                    <a class="toc-link"
                       :class="ch.number == chapterNum ? 'toc-link active' : 'toc-link'"
                       :href="'/projects/' + projectId + '/inspect/chapters/' + ch.number"
                       x-text="'第' + ch.number + '章 ' + (ch.title || '')">章节</a>
                </div>
            </template>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="inspect-main" :class="!sidebarOpen ? 'expanded' : ''">
        <!-- Breadcrumb + Navigation -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a :href="'/projects/' + projectId + '/inspect'">创作透视</a></li>
                    <li class="breadcrumb-item active" x-text="'第' + chapterNum + '章 ' + chapterTitle">章节</li>
                </ol>
            </nav>
            <div class="d-flex gap-2">
                <a x-show="prevNum" :href="'/projects/' + projectId + '/inspect/chapters/' + prevNum"
                   class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-left"></i> 上一章</a>
                <a x-show="nextNum" :href="'/projects/' + projectId + '/inspect/chapters/' + nextNum"
                   class="btn btn-sm btn-outline-secondary">下一章 <i class="bi bi-chevron-right"></i></a>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs" role="tablist">
            <template x-for="tab in tabs" :key="tab.field">
                <li class="nav-item">
                    <button class="nav-link"
                            :class="{ active: activeTab === tab.field, disabled: !tab.available }"
                            :disabled="!tab.available"
                            @click="switchTab(tab.field)"
                            x-text="tab.label">
                    </button>
                </li>
            </template>
        </ul>

        <!-- Tab Content -->
        <div class="border border-top-0 rounded-bottom p-3" style="min-height:200px;">
            <!-- Loading -->
            <div x-show="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">加载中...</p>
            </div>

            <!-- Content -->
            <div x-show="!loading">
                <!-- Compare mode for contentDraft -->
                <template x-if="activeTab === 'contentDraft' && cache['contentDraft'] && cache['content']">
                    <div>
                        <div class="compare-container">
                            <div>
                                <h6 class="text-muted mb-2">润色前原稿</h6>
                                <pre class="field-content mb-0" x-text="cache['contentDraft']?.content || '无数据'"></pre>
                            </div>
                            <div>
                                <h6 class="text-muted mb-2">最终正文</h6>
                                <pre class="field-content mb-0" x-text="cache['content']?.content || '无数据'"></pre>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- JSON table for characterStates -->
                <template x-if="activeTab === 'characterStates' && cache['characterStates']?.type === 'json'">
                    <div>
                        <div x-html="renderCharacterStatesTable()"></div>
                    </div>
                </template>

                <!-- Regular text display -->
                <template x-if="activeTab !== 'contentDraft' && !(activeTab === 'characterStates' && cache[activeTab]?.type === 'json')">
                    <div>
                        <pre class="field-content" x-text="cache[activeTab]?.content || '无数据'"></pre>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        window.__inspectData = (function () {
            var d = {};
            try {
                var parts = location.pathname.split('/');
                var pid = parts[2];
                var num = parts[5];
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/projects/' + pid + '/inspect/chapters/' + num + '/data', false);
                xhr.send();
                d = JSON.parse(xhr.responseText || '{}');
            } catch (e) { console.error('inspect chapter data load failed', e); }
            return d;
        })();
    </script>
    <script src="/js/inspect-chapter.js"></script>
    <script src="/vendor/alpinejs/cdn.min.js" defer></script>
</body>
</html>
