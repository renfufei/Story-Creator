<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作指导库 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sc-page">

<script>
/* 引导数据：同步 XHR，确保下方渲染脚本读取时已就绪 */
window.__GUIDANCES_DATA__ = (function () {
    var d = { items: [], itemIds: [], steps: [] };
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/settings/guidances/data', false);
        xhr.send();
        if (xhr.status === 200) d = JSON.parse(xhr.responseText || '{}');
    } catch (e) { console.error('__GUIDANCES_DATA__ load failed', e); }
    return d;
})();
</script>

<header id="site-nav"></header>

<main class="sc-main container py-4" id="main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h2 class="mb-0">创作指导库</h2>
        <div class="d-flex flex-wrap gap-2">
            <a href="/settings" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> 返回设置
            </a>
            <button type="button" id="btnExport" class="btn btn-outline-success btn-sm" style="display:none;">
                <i class="bi bi-download"></i> 导出
            </button>
            <button type="button" id="btnImport" class="btn btn-outline-info btn-sm">
                <i class="bi bi-upload"></i> 导入
            </button>
            <button type="button" id="btnNew" class="btn btn-primary btn-sm">
                <i class="bi bi-plus"></i> 新建指导
            </button>
        </div>
    </div>

    <!-- 导出（勾选）模式工具条：全选在最左，确认/取消导出居中，计数在右 -->
    <div class="sc-export-bar mb-3" id="exportBar" style="display:none;">
        <div class="sc-export-left">
            <label class="sc-selectall" id="selectAllLabel">
                <input class="form-check-input" type="checkbox" id="checkAll">
                <span id="checkAllText">全选</span>
            </label>
        </div>
        <div class="sc-export-center">
            <button type="button" id="btnExportConfirm" class="btn btn-success btn-sm">
                <i class="bi bi-check2-circle"></i> 确认导出
            </button>
            <button type="button" id="btnExportCancel" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-x-circle"></i> 取消导出
            </button>
        </div>
        <div class="sc-export-right text-muted small" id="exportCount"></div>
    </div>

    <!-- 隐藏的导入表单（原生 multipart POST） -->
    <form id="importForm" action="/settings/guidances/import" method="post" enctype="multipart/form-data" style="display:none;">
        <input type="file" id="importFile" name="file" accept=".json">
    </form>

    <div id="flashArea"></div>

    <!-- 新建表单 -->
    <div class="card mb-4" id="addCard" style="display:none;">
        <div class="card-body">
            <form action="/settings/guidances" method="post">
                <div class="row g-2 mb-2">
                    <div class="col-md-4">
                        <label class="form-label small mb-1">名称</label>
                        <input type="text" class="form-control form-control-sm" name="name" required placeholder="指导名称">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small mb-1">步骤</label>
                        <select class="form-select form-select-sm" name="step" id="addStep" required></select>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label small mb-1">指导内容</label>
                    <textarea class="form-control form-control-sm" name="guidance" rows="4" placeholder="创作指导内容..."></textarea>
                </div>
                <button type="submit" class="btn btn-sm btn-primary">创建</button>
                <button type="button" class="btn btn-sm btn-secondary" id="btnCancelAdd">取消</button>
            </form>
        </div>
    </div>

    <!-- 列表 -->
    <div class="card">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>
                <strong><i class="bi bi-journal-text"></i> 指导列表</strong>
                <small class="text-muted ms-2 d-none d-lg-inline">可从工作流页面"存为通用"按钮快速保存，也可在此手动管理</small>
            </span>
            <span class="text-muted small" id="listMeta"></span>
        </div>
        <div class="card-body" id="listArea"></div>
    </div>
</main>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
    'use strict';

    var data = window.__GUIDANCES_DATA__ || { items: [], itemIds: [], steps: [] };
    var items = data.items || [];
    var listArea = document.getElementById('listArea');
    var exportBar = document.getElementById('exportBar');
    var btnExport = document.getElementById('btnExport');
    var btnImport = document.getElementById('btnImport');
    var btnNew = document.getElementById('btnNew');
    var checkAll = document.getElementById('checkAll');
    var checkAllText = document.getElementById('checkAllText');
    var exportCount = document.getElementById('exportCount');

    /* 勾选（导出）模式：默认关闭——勾选框、确认/取消导出都不展示 */
    var exportMode = false;
    /* 已勾选条目 id（字符串，避免 Number / String 比较踩坑） */
    var selectedIds = [];

    function idOf(it) { return String(it.id); }
    function allItemIds() { return items.map(idOf); }

    /* ===================== 步骤下拉 ===================== */
    function fillSteps() {
        document.getElementById('addStep').innerHTML = (data.steps || []).map(function (s) {
            return '<option value="' + SC.escape(s.name) + '">' + SC.escape(s.displayName) + '</option>';
        }).join('');
    }

    /* ===================== Flash（信息走 query 串） ===================== */
    var ERR_TEXT = {
        empty: '请选择要导入的文件',
        invalid: 'JSON格式无效：缺少items字段',
        io: '导入失败，请检查文件格式'
    };

    function alertHtml(type, msg) {
        return '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' + msg +
            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
    }

    function renderFlash() {
        var p = SC.params();
        var html = '';
        if (p.imported !== undefined) {
            html += alertHtml('success', '成功导入 ' + SC.escape(p.imported) + ' 条创作指导');
        }
        if (p.err) {
            html += alertHtml('danger', ERR_TEXT[p.err] || '导入失败');
        }
        document.getElementById('flashArea').innerHTML = html;
    }

    /* ===================== 卡片渲染 ===================== */
    function cardHtml(it) {
        var id = idOf(it);
        var checked = selectedIds.indexOf(id) >= 0;
        var editHref = '/settings/guidances/' + it.id + '/edit';
        var title = exportMode
            ? '<span class="sc-guidance-title">' + SC.escape(it.name) + '</span>'
            : '<a class="sc-guidance-title" href="' + editHref + '">' + SC.escape(it.name) + '</a>';
        var cls = 'sc-guidance-card' + (exportMode ? ' sc-selectable' : '') + (exportMode && checked ? ' is-selected' : '');
        var attrs = exportMode
            ? ' role="button" tabindex="0" aria-pressed="' + checked + '" title="点击切换勾选状态"'
            : '';
        var checkBox = exportMode
            ? '<input type="checkbox" class="form-check-input sc-guidance-check" tabindex="-1"' + (checked ? ' checked' : '') + '>'
            : '';
        var editBtn = exportMode ? '' :
            '<a class="btn btn-sm btn-outline-primary" href="' + editHref + '">' +
            '<i class="bi bi-pencil"></i> 编辑</a>';
        var body = it.guidance || it.preview || '（暂无内容）';

        return '<div class="' + cls + '" data-id="' + SC.escape(id) + '"' + attrs + '>' +
            '<div class="sc-guidance-body">' +
                '<div class="sc-guidance-head">' +
                    checkBox + title +
                    '<span class="badge bg-info sc-guidance-step">' + SC.escape(it.stepLabel) + '</span>' +
                '</div>' +
                '<p class="sc-guidance-preview">' + SC.escape(body) + '</p>' +
                '<div class="sc-guidance-foot">' +
                    '<span class="text-muted small"><i class="bi bi-clock"></i> ' +
                        SC.escape(SC.fmt.datetime(it.updatedAt)) + '</span>' +
                    editBtn +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function renderMeta() {
        document.getElementById('listMeta').textContent = '共 ' + items.length + ' 条创作指导';
    }

    function renderList() {
        renderMeta();
        if (!items.length) {
            listArea.innerHTML = '<div class="sc-empty"><i class="bi bi-journal-x"></i>' +
                '<p class="mb-1 mt-2">暂无创作指导。</p>' +
                '<p class="small mb-0">可在工作流页面中将某步骤的创作指导存为通用，或点击"新建指导"创建。</p></div>';
            return;
        }
        listArea.innerHTML = '<div class="sc-guidance-grid">' + items.map(cardHtml).join('') + '</div>';
    }

    /* ===================== 勾选状态 ===================== */
    function renderExportBar() {
        var allSelected = items.length > 0 && selectedIds.length === items.length;
        checkAll.checked = allSelected;
        checkAll.indeterminate = !allSelected && selectedIds.length > 0;
        checkAllText.textContent = allSelected ? '取消全选' : '全选';
        exportCount.textContent = '已选 ' + selectedIds.length + ' / ' + items.length;
    }

    function toggleCard(id) {
        id = String(id);
        var i = selectedIds.indexOf(id);
        if (i >= 0) selectedIds.splice(i, 1); else selectedIds.push(id);

        var on = selectedIds.indexOf(id) >= 0;
        var card = listArea.querySelector('.sc-guidance-card[data-id="' + id + '"]');
        if (card) {
            card.classList.toggle('is-selected', on);
            card.setAttribute('aria-pressed', String(on));
            var cb = card.querySelector('.sc-guidance-check');
            if (cb) cb.checked = on;
        }
        renderExportBar();
    }

    function applyMode() {
        exportBar.style.display = exportMode ? '' : 'none';
        btnExport.style.display = (!exportMode && items.length) ? '' : 'none';
        btnImport.style.display = exportMode ? 'none' : '';
        btnNew.style.display = exportMode ? 'none' : '';
        if (exportMode) document.getElementById('addCard').style.display = 'none';
    }

    function enterExportMode() {
        if (!items.length) return;
        exportMode = true;
        /* 进入即默认全选，保持"点导出＝导出全部"的旧习惯 */
        selectedIds = allItemIds();
        applyMode();
        renderExportBar();
        renderList();
        SC.toast.info('勾选要导出的创作指导，点击卡片即可切换');
    }

    function exitExportMode() {
        exportMode = false;
        selectedIds = [];
        applyMode();
        renderList();
    }

    /* ===================== 导出 ===================== */
    async function doExport() {
        try {
            var resp = await fetch('/settings/guidances/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(selectedIds.map(Number))
            });
            if (!resp.ok) { SC.toast.error('导出失败'); return false; }
            var blob = await resp.blob();
            var disposition = resp.headers.get('Content-Disposition');
            var filename = 'guidances-export.json';
            if (disposition) {
                var match = disposition.match(/filename=(.+)/);
                if (match) filename = match[1];
            }
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            return true;
        } catch (err) {
            SC.toast.error('导出失败: ' + err.message);
            return false;
        }
    }

    /* ===================== 事件绑定 ===================== */
    btnNew.addEventListener('click', function () {
        document.getElementById('addCard').style.display = '';
    });
    document.getElementById('btnCancelAdd').addEventListener('click', function () {
        document.getElementById('addCard').style.display = 'none';
    });
    btnImport.addEventListener('click', function () {
        document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function () {
        if (this.files && this.files.length) document.getElementById('importForm').submit();
    });

    /* 导出：进入勾选模式（确认/取消按钮随之出现） */
    btnExport.addEventListener('click', enterExportMode);
    document.getElementById('btnExportCancel').addEventListener('click', exitExportMode);
    document.getElementById('btnExportConfirm').addEventListener('click', async function () {
        if (!selectedIds.length) {
            SC.toast.warn('请至少勾选一条创作指导');
            return;
        }
        var count = selectedIds.length;
        if (await doExport()) {
            exitExportMode();
            SC.toast.success('已导出 ' + count + ' 条创作指导');
        }
    });

    checkAll.addEventListener('change', function () {
        selectedIds = this.checked ? allItemIds() : [];
        renderExportBar();
        renderList();
    });

    /* 勾选模式下整卡可点（卡片内此时没有链接/按钮，可放心接管点击） */
    listArea.addEventListener('click', function (e) {
        if (!exportMode) return;
        var card = e.target.closest('.sc-guidance-card');
        if (!card) return;
        e.preventDefault();
        toggleCard(card.dataset.id);
    });

    listArea.addEventListener('keydown', function (e) {
        if (!exportMode || (e.key !== 'Enter' && e.key !== ' ')) return;
        var card = e.target.closest('.sc-guidance-card');
        if (!card) return;
        e.preventDefault();
        toggleCard(card.dataset.id);
    });

    document.addEventListener('keydown', function (e) {
        if (exportMode && e.key === 'Escape') exitExportMode();
    });

    /* ===================== 初始化 ===================== */
    fillSteps();
    renderFlash();
    renderList();
    applyMode();
})();
</script>
</body>
</html>
