<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作工作流 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sc-page" data-nav="projects">
<header id="site-nav"></header>
<main class="sc-main container py-4">
    <div x-data="workflowHubApp()">
        <h4 class="mb-3"><a :href="'/projects/' + projectId" class="text-decoration-none text-dark" x-text="projectTitle || '项目'">项目</a></h4>
        <p class="text-muted">选择一个创作步骤继续：</p>
        <div class="row">
            <template x-for="s in stepList" :key="s.name">
                <div class="col-md-4 mb-3">
                    <a class="card h-100 text-decoration-none shadow-sm" :href="'/projects/' + projectId + '/workflow/' + s.route">
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-1">
                                <span class="badge bg-secondary me-2" x-text="s.order"></span>
                                <h5 class="mb-0" x-text="s.label"></h5>
                            </div>
                            <small class="text-muted">第 <span x-text="s.order"></span> 步</small>
                        </div>
                    </a>
                </div>
            </template>
        </div>
    </div>
</main>
<script>
(function () {
    try {
        var parts = location.pathname.split('/');
        var pid = parts[2];
        var url = '/projects/' + pid + '/workflow/world-building/data';
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, false);
        xhr.send();
        if (xhr.status === 200) {
            window.__WORKFLOW_DATA__ = JSON.parse(xhr.responseText);
        } else {
            window.__WORKFLOW_DATA__ = { projectId: Number(pid), projectTitle: '' };
        }
    } catch (e) {
        window.__WORKFLOW_DATA__ = window.__WORKFLOW_DATA__ || { projectId: 0, projectTitle: '' };
    }
})();
</script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/workflow/workflow-state.js"></script>
<script src="/js/workflow/outline.js"></script>
<script src="/js/workflow/characters.js"></script>
<script src="/js/workflow/chapters.js"></script>
<script src="/js/workflow/polishing.js"></script>
<script src="/js/workflow/proofreading.js"></script>
<script src="/js/workflow/materials.js"></script>
<script src="/js/workflow/autorun.js"></script>
<script src="/js/workflow/core.js"></script>
<script defer src="/vendor/alpinejs/cdn.min.js"></script>
</body>
</html>
