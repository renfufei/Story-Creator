<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>英语单词匹配 - AI故事创作</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        [x-cloak] { display: none !important; }

        /* ==================== 英语单词匹配 ==================== */
        .wm-root {
            --wm-ink: #2b3138;
            --wm-muted: #86909c;
            --wm-line: #e5e8ec;
            --wm-surface: #ffffff;
            --wm-sel-bg: #d8edfd;
            --wm-sel-line: #35a3f3;
            --wm-sel-ink: #0f6cbd;
            --wm-done-bg: #f1f3f5;
            --wm-done-line: #e8ebee;
            --wm-done-ink: #b4bbc4;
            --wm-wrong-bg: #ffe6e6;
            --wm-wrong-line: #f96868;
            --wm-wrong-ink: #d92d20;
            --wm-accent: #35a3f3;
            --wm-ok: #34c77b;
            --wm-auto: #f0a020;
        }

        .wm-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            flex-wrap: wrap;
            margin-bottom: .85rem;
        }

        .wm-toolbar-sub {
            font-size: .8rem;
            color: #86909c;
        }

        .wm-toolbar-actions {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
        }

        .wm-book-btn {
            max-width: 12rem;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .wm-caret { font-size: .7rem; opacity: .6; }

        /* 错题数量：贴着按钮内的计数胶囊，不用绝对定位，免得压住旁边的按钮 */
        .wm-count {
            display: inline-block;
            min-width: 1.1em;
            padding: 0 .3em;
            margin-left: .2rem;
            border-radius: 999px;
            background: #e5484d;
            color: #fff;
            font-size: .68rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
        }

        /* ---------- 设置弹层：错题本 / 重做本关 / 朗读 / 重置进度 归到齿轮按钮里 ---------- */
        .wm-set-wrap { position: relative; }

        /* 打开时按钮保持高亮，让「弹层从哪冒出来的」一目了然 */
        .wm-set-btn.is-open {
            border-color: var(--wm-sel-line);
            color: var(--wm-sel-ink);
            background: #eef7fe;
        }

        .wm-set-pop {
            position: absolute;
            z-index: 1200;
            top: calc(100% + .45rem);
            right: 0;
            width: min(20rem, calc(100vw - 2rem));
            background: var(--wm-surface);
            border: 1px solid var(--wm-line);
            border-radius: 14px;
            box-shadow: 0 14px 34px rgba(31, 45, 61, .18);
            padding: .45rem;
            text-align: left;
            animation: wm-pop-soft .18s ease;
        }

        .wm-set-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: .5rem;
            padding: .2rem .5rem .45rem;
            border-bottom: 1px solid var(--wm-line);
            margin-bottom: .35rem;
            font-size: .74rem;
            font-weight: 700;
            color: var(--wm-muted);
        }

        .wm-set-item {
            display: flex;
            align-items: center;
            gap: .6rem;
            width: 100%;
            border: 0;
            background: transparent;
            border-radius: 10px;
            padding: .5rem .55rem;
            text-align: left;
            color: var(--wm-ink);
        }

        .wm-set-item + .wm-set-item { margin-top: 2px; }
        .wm-set-item:hover { background: #f4f7fa; }

        /* 图标做成小圆角方块：比裸图标更像「条目」，也更容易扫读 */
        .wm-set-icon {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.9rem;
            height: 1.9rem;
            border-radius: 9px;
            font-size: .95rem;
            background: #eef4fb;
            color: var(--wm-sel-ink);
        }

        .wm-set-item.is-danger .wm-set-icon { background: #fdecec; color: var(--wm-wrong-ink); }

        .wm-set-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

        .wm-set-title {
            display: flex;
            align-items: center;
            gap: .3rem;
            font-size: .9rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .wm-set-item.is-danger .wm-set-title { color: var(--wm-wrong-ink); }

        /* 说明文字最多两行：窄屏宁可换行也别把话截断（这里不是状态条，换行不会顶坏布局） */
        .wm-set-desc {
            font-size: .74rem;
            line-height: 1.35;
            color: var(--wm-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .wm-set-arrow { flex: 0 0 auto; color: #c2c8d0; font-size: .78rem; }

        /* 朗读开关的右侧状态胶囊 */
        .wm-set-switch {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: .25rem;
            padding: .12rem .5rem;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            background: #eef0f3;
            color: var(--wm-muted);
        }

        .wm-set-switch.is-on { background: #e6f7ef; color: #1a8d5a; }

        /* ---------- 舞台 ---------- */
        .wm-stage {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: var(--wm-surface);
            border: 1px solid var(--wm-line);
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(31, 45, 61, .06);
            padding: 14px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 480px;
            color: var(--wm-ink);
        }

        /* ---------- HUD：关闭 / 进度 / 关卡数 ---------- */
        .wm-hud {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wm-close {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--wm-muted);
            font-size: 1.05rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color .15s ease, color .15s ease;
        }

        .wm-close:hover { background: #f1f3f5; color: var(--wm-ink); }

        .wm-progress {
            flex: 1 1 auto;
            display: flex;
            gap: 4px;
            min-width: 0;
        }

        .wm-seg {
            flex: 1 1 0;
            height: 9px;
            border-radius: 5px;
            background: #ebedf0;
            transition: background-color .25s ease;
        }

        .wm-seg.is-done { background: var(--wm-ok); }
        .wm-seg.is-current { background: var(--wm-accent); }
        .wm-progress.is-auto .wm-seg.is-done { background: #f5c46b; }
        .wm-progress.is-auto .wm-seg.is-current { background: var(--wm-auto); }

        .wm-counter {
            flex: 0 0 auto;
            font-size: .95rem;
            font-variant-numeric: tabular-nums;
            color: var(--wm-muted);
            font-weight: 600;
            letter-spacing: .02em;
        }

        .wm-counter b { color: var(--wm-accent); }
        .wm-progress.is-auto ~ .wm-counter b { color: var(--wm-auto); }

        /* ---------- 标题行（浅色面板：与下方信息栏 / 棋盘分区） ---------- */
        .wm-titlebar {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
            position: relative;                 /* 过关提示贴着这一行居中（见 .wm-flash） */
            min-height: 2.9rem;                 /* 保证绝对定位的过关提示不会越出这一带 */
            background: #f7f9fb;
            border: 1px solid var(--wm-line);
            border-radius: 12px;
            padding: 8px 12px;
        }

        /* 过关提示出现时把标题/主题标签藏起来（用 visibility 而不是 display，
           否则这一行会塌成 0 高，绝对定位的提示就没有居中的基准了） */
        .wm-titlebar.is-flashing .wm-title,
        .wm-titlebar.is-flashing .wm-theme,
        .wm-titlebar.is-flashing .wm-auto-badge { visibility: hidden; }

        .wm-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: .01em;
        }

        .wm-theme {
            font-size: .75rem;
            color: #0f6cbd;
            background: #eaf4fe;
            border-radius: 999px;
            padding: 2px 9px;
            font-weight: 600;
        }

        .wm-auto-badge {
            font-size: .72rem;
            color: #8a5a00;
            background: #fff3d9;
            border: 1px solid #ffe0a8;
            border-radius: 999px;
            padding: 2px 9px;
            font-weight: 700;
        }

        /* ---------- 自动学习状态条 ---------- */
        .wm-auto-bar {
            display: flex;
            flex-wrap: nowrap;               /* 状态条只占一行：提示再长也不换行，移动端不会被撑高 */
            align-items: center;
            gap: .6rem;
            min-height: 2.6rem;              /* 高度固定，步骤提示切换时不跳动 */
            background: linear-gradient(96deg, #fff5e0, #fffaf0);
            border: 1px solid #ffe0a8;
            border-radius: 12px;
            padding: 7px 10px;
            color: #8a5a00;
            font-size: .85rem;
        }

        .wm-auto-bar.is-paused { background: #f4f6f8; border-color: var(--wm-line); color: var(--wm-muted); }

        /* 步骤标签（固定短文案，永远完整可见）+ 详情（单词等，过长省略） */
        .wm-auto-tip {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: .4rem;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
        }

        .wm-auto-tag {
            flex: 0 0 auto;
            background: #fff;
            border: 1px solid #ffe0a8;
            border-radius: 999px;
            padding: 1px 8px;
            font-size: .72rem;
            font-weight: 700;
            line-height: 1.5;
        }

        .wm-auto-text {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .wm-auto-count {
            flex: 0 0 auto;
            min-width: 2.4rem;
            text-align: center;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: #fff;
            border: 1px solid #ffe0a8;
            border-radius: 999px;
            padding: 1px 8px;
        }

        .wm-auto-count .wm-auto-sec { font-size: .68rem; font-weight: 600; opacity: .7; }

        .wm-auto-btn {
            flex: 0 0 auto;
            border: 1px solid #f0c476;
            background: #fff;
            color: #8a5a00;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 600;
            padding: 3px 10px;
            line-height: 1.5;
        }

        .wm-auto-btn:hover { background: #fff8ea; }
        .wm-auto-btn.is-exit { border-color: #f2b8b5; color: #b42318; }
        .wm-auto-btn.is-exit:hover { background: #fff1f0; }

        /* ---------- 配对棋盘（浅色底 + 边框，与上方信息栏分区） ---------- */
        .wm-board {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 12px;
            align-content: center;
            background: #fbfcfe;
            border: 1px solid var(--wm-line);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .wm-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            min-width: 0;
        }

        .wm-card {
            position: relative;
            flex: 1 1 0;
            min-height: 54px;
            max-height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border: 1.5px solid var(--wm-line);
            border-radius: 14px;
            background: var(--wm-surface);
            color: var(--wm-ink);
            font-size: clamp(.95rem, 3.2vw, 1.1rem);
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
            overflow-wrap: anywhere;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-shadow: 0 1px 2px rgba(31, 45, 61, .04);
            transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .1s ease;
        }

        .wm-card:hover:not(.is-done) { border-color: #cfd6dd; }
        .wm-card:active:not(.is-done) { transform: scale(.985); }

        .wm-card:focus-visible {
            outline: 3px solid rgba(53, 163, 243, .35);
            outline-offset: 2px;
        }

        .wm-board.is-auto .wm-card { cursor: default; }
        .wm-board.is-auto .wm-card:hover { border-color: var(--wm-line); }
        .wm-board.is-auto .wm-card:active { transform: none; }

        /* 选中 */
        .wm-card.is-sel {
            background: var(--wm-sel-bg);
            border-color: var(--wm-sel-line);
            color: var(--wm-sel-ink);
        }

        /* 已完成（置灰） */
        .wm-card.is-done {
            background: var(--wm-done-bg);
            border-color: var(--wm-done-line);
            color: var(--wm-done-ink);
            cursor: default;
            box-shadow: none;
        }

        /* 不匹配：后选中的那张标红 */
        .wm-card.is-wrong {
            background: var(--wm-wrong-bg);
            border-color: var(--wm-wrong-line);
            color: var(--wm-wrong-ink);
            animation: wm-shake .42s ease;
        }

        @keyframes wm-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .wm-card-text { pointer-events: none; }

        /* 英文侧右侧留出朗读按钮的位置，中文侧左侧对称留白，两张卡视觉居中一致 */
        .wm-col-en .wm-card { padding-right: 28px; }
        .wm-col-zh .wm-card { padding-left: 28px; }

        .wm-speak {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: .8rem;
            color: var(--wm-muted);
            padding: 5px;
            border-radius: 50%;
            border: 0;
            background: transparent;
        }

        .wm-speak:hover { background: rgba(53, 163, 243, .12); color: var(--wm-sel-ink); }

        .wm-card .wm-speak { opacity: .55; }
        .wm-card .wm-speak:hover { opacity: 1; }

        /* ---------- 单词区上方的信息栏（说明文字 + 关卡导航） ----------
           原先这两块都在棋盘「下方」：桌面端大窗口下离单词区很远，
           而且棋盘下方本来就有大片留白，信息沉在最底下更显空旷。
           现在整体上移到单词区上方，装进一个浅色面板，与棋盘的白色区分开。 */
        .wm-infobar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            background: #f7f9fb;
            border: 1px solid var(--wm-line);
            border-radius: 12px;
            padding: 8px 10px;
        }

        /* 说明文字（面板第一行，最左） */
        .wm-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            flex-wrap: wrap;
            font-size: .8rem;
            color: var(--wm-muted);
        }

        .wm-footer b { color: var(--wm-ink); }

        /* 关卡导航（上一关 / 下一关） */
        .wm-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
        }

        .wm-nav-mid {
            font-size: .82rem;
            color: var(--wm-muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .wm-nav-mid b { color: var(--wm-accent); }

        /* ---------- 过关提示：贴在标题行（舞台上方的提示区） ----------
           以前固定在视口底部，桌面端大窗口下离单词区有 200~300px 空白，等于看不见。
           现在相对 .wm-titlebar 居中：占的是「状态栏与卡片区之间的那 40px 空隙」，
           既不压住卡片，也不产生布局位移（绝对定位）。 */
        .wm-flash {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: .4rem;
            background: rgba(29, 41, 55, .94);
            color: #fff;
            border-radius: 999px;
            padding: 7px 18px;
            font-size: .94rem;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .22);
            animation: wm-pop .24s ease;
            width: max-content;                 /* 否则 left:50% 的可用宽度只剩半屏，文案会被折成两行 */
            max-width: min(92vw, 30rem);
            line-height: 1.35;
            white-space: nowrap;                /* 再长的文案也只占一行（超出省略），不会撑成两行 */
        }

        .wm-flash .wm-flash-emoji { font-size: 1.25rem; line-height: 1; flex: 0 0 auto; }

        /* 文案是 flex 子项：省略号必须挂在它自己身上，且 min-width:0 才允许收缩 */
        .wm-flash > span:last-child {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 从标题行中间弹出来（translate(-50%,-50%) 是它的定位基准，动画里必须带上） */
        @keyframes wm-pop {
            from { opacity: 0; transform: translate(-50%, -50%) scale(.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* 单页导出件里「退出」（退到站内 /learn）与「导出」入口都不成立，隐藏掉 */
        body[data-standalone] .wm-close,
        body[data-standalone] .wm-set-item.is-export { display: none; }

        /* ---------- 弹窗（通关 / 选册 / 错题本 通用） ---------- */
        .wm-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1300;
            background: rgba(23, 32, 44, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .wm-modal {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 18px;
            padding: 22px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
            animation: wm-pop-soft .26s ease;
            max-height: calc(100vh - 2rem);
            max-height: calc(100dvh - 2rem);
            overflow: auto;
            color: var(--wm-ink);
        }

        .wm-modal.is-wide { max-width: 480px; text-align: left; }
        .wm-modal h5 { font-weight: 700; margin-bottom: .35rem; }
        .wm-modal > p { color: #86909c; font-size: .88rem; margin-bottom: 1rem; }

        @keyframes wm-pop-soft {
            from { opacity: 0; transform: scale(.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .wm-modal-emoji { font-size: 2.6rem; line-height: 1; }

        /* ---------- 导出弹窗（册次多选：整列滚动 + 学段头吸顶） ---------- */
        .wm-export-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            flex-wrap: wrap;
            margin-top: .6rem;
            padding: .45rem .6rem;
            background: #f7f9fb;
            border: 1px solid var(--wm-line);
            border-radius: 10px;
            font-size: .82rem;
        }

        .wm-export-all {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin: 0;
            font-weight: 600;
            color: var(--wm-ink);
            cursor: pointer;
        }

        .wm-export-all input { width: 16px; height: 16px; margin: 0; accent-color: var(--wm-sel-line); }
        .wm-export-sum { color: var(--wm-muted); font-variant-numeric: tabular-nums; }

        /* 24 册一次列全：整列滚动 + 学段头吸顶，不折叠也能随时看清自己在哪一段
           （两处覆盖要带上 .wm-book-list 提高权重，否则会输给它自己的 max-height/gap） */
        .wm-book-list.wm-export-list { max-height: min(52vh, 380px); gap: 0; padding-right: 2px; }
        .wm-export-group { display: flex; flex-direction: column; }

        .wm-export-stage {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            margin-top: .35rem;
            padding: .3rem .5rem;
            background: #eef2f6;
            border-radius: 8px;
            font-size: .78rem;
            font-weight: 600;
            color: #5b6673;
        }

        .wm-export-stage-btn {
            border: 0;
            background: none;
            padding: 0 .15rem;
            color: var(--wm-accent);
            font-size: .74rem;
        }

        .wm-export-item {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin: .3rem 0 0;
            padding: .42rem .55rem;
            border: 1px solid var(--wm-line);
            border-radius: 9px;
            background: #fff;
            cursor: pointer;
        }

        .wm-export-item.is-on { border-color: var(--wm-sel-line); background: #f2f9ff; }
        .wm-export-item input { width: 16px; height: 16px; margin: 0; flex: 0 0 auto; accent-color: var(--wm-sel-line); }
        .wm-export-label { flex: 1 1 auto; font-size: .86rem; color: var(--wm-ink); }
        .wm-export-meta { color: var(--wm-muted); font-size: .75rem; white-space: nowrap; }

        /* ---------- 选册列表（按学段折叠：默认只展开当前册所在学段） ---------- */
        .wm-book-list {
            display: flex;
            flex-direction: column;
            gap: .55rem;
            margin-top: .6rem;
            /* 小学 8 + 初中 5 + 高中 11 = 24 册；限高 + 让「三个学段标题」始终同时可见
               （展开的分组自己内部滚动，否则后面的学段标题会被顶到滚动区外，用户看不到还有别的学段） */
            max-height: min(72vh, 560px);
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-right: 2px;
        }

        .wm-book-group { display: flex; flex-direction: column; gap: .5rem; }

        .wm-book-group-head {
            display: flex;
            align-items: center;
            gap: .45rem;
            width: 100%;
            text-align: left;
            background: #f4f7fa;
            border: 1.5px solid var(--wm-line);
            border-radius: 12px;
            padding: 9px 12px;
            color: var(--wm-ink);
            font-weight: 700;
            font-size: .88rem;
            touch-action: manipulation;
        }

        .wm-book-group-head:hover { background: #eef2f6; }
        .wm-book-group-head.is-open { background: #eaf4fe; border-color: var(--wm-sel-line); }

        .wm-book-group-caret {
            flex: 0 0 auto;
            color: var(--wm-sel-line);
            transition: transform .18s ease;
        }

        /* 折叠时朝右、展开时朝下（旋转 90°） */
        .wm-book-group-head.is-open .wm-book-group-caret { transform: rotate(90deg); }

        .wm-book-group-name { flex: 0 0 auto; }

        .wm-book-group-sub {
            flex: 1 1 auto;
            min-width: 0;
            font-weight: 400;
            font-size: .72rem;
            color: var(--wm-muted);
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .wm-book-group-cur { color: var(--wm-sel-line); font-weight: 700; }

        /* 展开的册次列表（内部滚动，别把后面的学段标题顶出可视区） */
        .wm-book-group-body {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            padding-left: .15rem;
            padding-right: 2px;
            max-height: min(38vh, 300px);
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .wm-book-item {
            display: flex;
            align-items: center;
            gap: .6rem;
            width: 100%;
            text-align: left;
            background: #fafbfc;
            border: 1.5px solid var(--wm-line);
            border-radius: 12px;
            padding: 9px 12px;
            color: var(--wm-ink);
            touch-action: manipulation;
        }

        .wm-book-item:hover { background: #f4f7fa; border-color: #cfd6dd; }
        .wm-book-item.is-active { background: #eaf4fe; border-color: var(--wm-sel-line); }

        .wm-book-label { font-weight: 700; flex: 0 0 auto; min-width: 4.2rem; }
        .wm-book-meta { flex: 1 1 auto; min-width: 0; font-size: .73rem; color: var(--wm-muted); line-height: 1.45; }
        .wm-book-prog b { color: var(--wm-ok); }
        .wm-book-prog.is-auto b { color: #d99000; }
        .wm-book-check { flex: 0 0 auto; color: var(--wm-sel-line); }

        /* ---------- 错题本 ---------- */
        .wm-wrong-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
        }

        .wm-wrong-head h5 { margin: 0; }

        .wm-wrong-total {
            font-size: .78rem;
            color: var(--wm-wrong-ink);
            background: var(--wm-wrong-bg);
            border-radius: 999px;
            padding: 2px 10px;
            font-weight: 700;
        }

        .wm-wrong-list {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            margin: .7rem 0;
            max-height: min(52vh, 26rem);
            overflow: auto;
        }

        .wm-wrong-item {
            display: flex;
            align-items: center;
            gap: .5rem;
            border: 1px solid var(--wm-line);
            border-left: 3px solid var(--wm-wrong-line);
            border-radius: 10px;
            padding: 8px 10px;
            background: #fffdfd;
        }

        .wm-wrong-main { flex: 1 1 auto; min-width: 0; }
        .wm-wrong-en { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: .3rem; }
        .wm-wrong-en .wm-speak { position: static; transform: none; font-size: .85rem; }
        .wm-wrong-zh { font-size: .8rem; color: #5a6472; }
        .wm-wrong-zh b { color: var(--wm-ok); }
        .wm-wrong-miss { color: var(--wm-wrong-ink); }
        .wm-wrong-src { font-size: .72rem; color: var(--wm-muted); margin-top: 2px; }
        .wm-wrong-acts { flex: 0 0 auto; display: flex; gap: .35rem; }

        .wm-wrong-empty {
            text-align: center;
            color: var(--wm-muted);
            font-size: .88rem;
            padding: 1.6rem 0;
        }

        .wm-wrong-empty i { display: block; font-size: 1.8rem; margin-bottom: .4rem; color: var(--wm-ok); }

        /* ---------- 移动端：沉浸式全屏 ---------- */
        @media (max-width: 767.98px) {
            #site-nav { display: none !important; }
            body.sc-page { background-color: #fff; }
            body.sc-page main.sc-main { padding: 0 !important; }
            .wm-toolbar { padding: .45rem .7rem .15rem; margin-bottom: 0; row-gap: .3rem; }
            .wm-toolbar h2 { font-size: 1rem; }
            .wm-toolbar-sub { display: none; }
            .wm-toolbar-actions { gap: .35rem; }
            .wm-toolbar-actions > .btn { padding: .25rem .5rem; font-size: .78rem; }
            .wm-book-btn { max-width: 8.6rem; }
            /* 窄屏工具栏按钮会换行，齿轮不在屏幕右边缘，按它对齐会算出负坐标（实测 left=-68）
               → 改成贴底面板，宽度恒定落在视口内，也更好点 */
            .wm-set-pop {
                position: fixed;
                left: .6rem;
                right: .6rem;
                bottom: calc(.6rem + env(safe-area-inset-bottom));
                top: auto;
                width: auto;
                max-height: 72vh;
                overflow-y: auto;
                overscroll-behavior: contain;
                border-radius: 16px;
                z-index: 1250;
            }
            /* ---- 顶部信息在窄屏整体压缩 ----
               HUD(34) + 标题行(46) + 信息栏(115) 原本吃掉 ~195px，
               7 对单词（7 行）在 375x667 上就顶出屏幕 100px。
               现在：HUD 脱离文档流（细进度条 + 浮动关闭/计数）、标题行单行、
               信息栏只剩一行可横向滑动的说明文字、上一关/下一关改成浮动胶囊。 */
            .wm-stage {
                position: relative;                 /* .wm-hud 绝对定位的基准 */
                max-width: none;
                border: 0;
                border-radius: 0;
                box-shadow: none;
                padding: 4px 10px calc(6px + env(safe-area-inset-bottom));
                /* 顶部工具栏高度由 JS 量出来写进 --wm-stage-top（按钮会换行，写死会裁掉底部） */
                min-height: calc(100vh - var(--wm-stage-top, 4.7rem));
                min-height: calc(100dvh - var(--wm-stage-top, 4.7rem));
                gap: 6px;
            }

            /* HUD 浮起来：细进度条贴舞台顶边，计数与关闭按钮浮在标题行右上角 */
            .wm-hud {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 0;                          /* 不占纵向空间 */
                z-index: 4;
            }
            .wm-progress {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                gap: 2px;
            }
            .wm-seg { height: 3px; border-radius: 0; }
            .wm-counter {
                position: absolute;
                top: 6px;
                right: 40px;
                font-size: .78rem;
            }
            .wm-close {
                position: absolute;
                top: 2px;
                right: 2px;
                width: 30px;
                height: 30px;
                font-size: .95rem;
                background: #f1f3f5;
            }

            /* 标题行：单行，右侧留出计数与关闭按钮的位置 */
            .wm-titlebar {
                min-height: 0;
                padding: 4px 72px 4px 8px;
                border-radius: 10px;
                flex-wrap: nowrap;
            }
            .wm-title {
                font-size: 1rem;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .wm-theme { flex: 0 0 auto; font-size: .7rem; padding: 2px 8px; }

            /* 信息栏：只剩一行说明文字，改成横向滑动，长文案不再折行把区域撑高 */
            .wm-infobar {
                gap: 0;
                padding: 4px 8px;
                border-radius: 10px;
            }
            .wm-footer {
                flex-wrap: nowrap;
                overflow-x: auto;
                overflow-y: hidden;
                overscroll-behavior-x: contain;
                scrollbar-width: none;
                font-size: .75rem;
                gap: .4rem;
            }
            .wm-footer::-webkit-scrollbar { display: none; }
            .wm-footer > span { white-space: nowrap; }
            /* 「本册已完成 N/M 关」在顶部进度条 + 计数里已有，窄屏不重复占位 */
            .wm-footer > span:last-child { display: none; }

            /* 上一关 / 下一关浮动胶囊：不占纵向空间，也不会被 7 行单词挤走 */
            .wm-nav {
                position: fixed;
                left: 0;
                right: 0;
                bottom: calc(8px + env(safe-area-inset-bottom));
                justify-content: center;
                gap: 10px;
                z-index: 1150;                      /* 低于设置弹层(1250)与弹窗(1300) */
                pointer-events: none;               /* 只有按钮可点，别挡住卡片 */
            }
            .wm-nav > .btn {
                pointer-events: auto;
                min-height: 38px;
                border-radius: 999px;
                box-shadow: 0 4px 14px rgba(31, 45, 61, .18);
                -webkit-backdrop-filter: blur(6px);
                backdrop-filter: blur(6px);
            }
            /* 磨砂白底只给次要按钮；「下一册」是本册收尾的主按钮，
               保留 btn-primary 的蓝色填充才有「这里可以往前走」的指向性 */
            .wm-nav > .btn:not(.btn-primary) { background: rgba(255, 255, 255, .94); }
            .wm-nav-mid { display: none; }           /* 与顶部「第 N/M 关」重复 */

            .wm-board { padding: 8px 10px 46px; }    /* 底部给浮动胶囊留位 */
            /* 6~7 对时要塞下 7 行：卡片压到 46px（仍 >=44px 触控下限） */
            .wm-card { min-height: 46px; max-height: 88px; border-radius: 13px; }
            /* 窄屏状态条更紧凑，给「步骤标签 + 单词」留宽度（依旧只有一行） */
            .wm-auto-bar { padding: 6px 8px; gap: .4rem; font-size: .8rem; }
            .wm-auto-tip { gap: .3rem; }
            .wm-auto-tag { padding: 1px 6px; font-size: .68rem; }
            .wm-auto-text { font-size: .8rem; }
            .wm-auto-count { min-width: 2rem; padding: 1px 6px; }
            .wm-auto-btn { padding: 3px 8px; }
            /* 窄屏「状态栏↔卡片区」之间只有 ~38px，提示条必须更瘦才塞得进这一行 */
            .wm-flash { font-size: .88rem; padding: 5px 14px; gap: .3rem; }
            .wm-modal { padding: 18px 15px; }
            .wm-modal.is-wide { max-width: none; }
        }

        /* ---------- 超小屏（如 iPhone SE 一代 320x568）：再压一档 ----------
           7 对单词 = 7 行，卡片降到 44px（触控下限）、棋盘留白与各区域间隙各收 1~3px，
           合计再省 ~28px，正好覆盖 320x568 上剩余的 15px 溢出。 */
        @media (max-width: 767.98px) and (max-height: 620px) {
            .wm-stage { gap: 5px; padding: 3px 8px 4px; }
            .wm-titlebar { padding: 3px 70px 3px 7px; }
            .wm-infobar { padding: 3px 8px; }
            .wm-board { padding: 6px 8px 40px; gap: 8px 10px; }
            .wm-card { min-height: 44px; font-size: .92rem; }
            .wm-nav { bottom: calc(6px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body class="sc-page" data-nav="learn">

<script>
/* 引导数据：同步 XHR，确保下方 Alpine 组件读取时已就绪 */
window.__WORD_MATCH_DATA__ = (function () {
    var d = { books: [], levels: {} };
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/learn/word-match/data', false);
        xhr.send();
        if (xhr.status === 200) d = JSON.parse(xhr.responseText || '{}');
    } catch (e) { console.error('__WORD_MATCH_DATA__ load failed', e); }
    return d;
})();
</script>

<header id="site-nav"></header>

<main class="sc-main container py-4">

<div class="wm-root" x-data="wordMatchApp()">

    <div class="wm-toolbar">
        <div>
            <h2 class="sc-page-title mb-0"><i class="bi bi-translate"></i> 英语单词匹配</h2>
            <div class="wm-toolbar-sub">人教版小学 / 初中 / 高中英语 · 同一主题的单词在同一关</div>
        </div>
        <div class="wm-toolbar-actions">
            <button type="button" class="btn btn-sm btn-outline-primary wm-book-btn" @click="openBookPicker()"
                    :title="'当前：' + (bookLabel || '未选择') + '，点击切换册次'">
                <i class="bi bi-book"></i> <span x-text="bookLabel || '选择册次'"></span>
                <i class="bi bi-caret-down-fill wm-caret"></i>
            </button>
            <button type="button" class="btn btn-sm" :class="autoMode ? 'btn-outline-danger' : 'btn-success'"
                    @click="autoMode ? stopAuto() : startAuto()"
                    :title="autoMode ? '退出自动学习' : '从第 1 关开始自动点击配对并朗读'">
                <i class="bi" :class="autoMode ? 'bi-box-arrow-left' : 'bi-play-circle'"></i>
                <span x-text="autoMode ? '退出学习' : '自动学习'"></span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-warning" x-show="autoMode" x-cloak
                    @click="toggleAutoPause()" :title="autoPaused ? '继续自动学习' : '暂停自动学习'">
                <i class="bi" :class="autoPaused ? 'bi-play-fill' : 'bi-pause-fill'"></i>
                <span class="d-none d-sm-inline" x-text="autoPaused ? '继续' : '暂停'"></span>
            </button>
            <!-- 错题本 / 重做本关 / 朗读开关 / 重置进度 统一收进「设置」弹层 -->
            <div class="wm-set-wrap" @click.outside="settingsOpen = false"
                 @keydown.escape.window="settingsOpen = false">
                <button type="button" class="btn btn-sm btn-outline-secondary wm-set-btn"
                        @click="settingsOpen = !settingsOpen" :class="{ 'is-open': settingsOpen }"
                        title="设置：错题本 / 重做本关 / 朗读 / 重置进度"
                        aria-haspopup="true" :aria-expanded="settingsOpen ? 'true' : 'false'">
                    <i class="bi bi-gear"></i>
                    <span class="d-none d-sm-inline ms-1">设置</span>
                    <span class="wm-count" x-show="wrongTotal > 0" x-cloak x-text="wrongTotal"></span>
                </button>

                <div class="wm-set-pop" x-show="settingsOpen" x-cloak aria-label="设置">
                    <div class="wm-set-head">
                        <span><i class="bi bi-sliders"></i> 设置</span>
                        <span>保存在本机浏览器</span>
                    </div>

                    <button type="button" class="wm-set-item" @click="settingsOpen = false; openWrongBook()"
                            title="查看答错的单词">
                        <i class="bi bi-journal-bookmark wm-set-icon"></i>
                        <span class="wm-set-main">
                            <span class="wm-set-title">错题本
                                <span class="wm-count" x-show="wrongTotal > 0" x-cloak
                                      x-text="wrongTotal"></span>
                            </span>
                            <span class="wm-set-desc"
                                  x-text="wrongTotal > 0 ? ('答错 ' + wrongTotal + ' 个，答对也不会自动移除') : '还没有错题，答错的词自动记在这里'"></span>
                        </span>
                        <i class="bi bi-chevron-right wm-set-arrow"></i>
                    </button>

                    <button type="button" class="wm-set-item" @click="settingsOpen = false; restartLevel()"
                            title="重新打乱本关">
                        <i class="bi bi-arrow-repeat wm-set-icon"></i>
                        <span class="wm-set-main">
                            <span class="wm-set-title">重做本关</span>
                            <span class="wm-set-desc">重新打乱第 <span x-text="levelIndex + 1"></span>
                                关的单词顺序，进度不变</span>
                        </span>
                        <i class="bi bi-chevron-right wm-set-arrow"></i>
                    </button>

                    <button type="button" class="wm-set-item" @click="toggleSound()"
                            :title="soundOn ? '关闭音效与朗读' : '开启音效与朗读'">
                        <i class="bi wm-set-icon" :class="soundOn ? 'bi-volume-up' : 'bi-volume-mute'"></i>
                        <span class="wm-set-main">
                            <span class="wm-set-title">音效与朗读</span>
                            <span class="wm-set-desc"
                                  x-text="soundOn ? '已开启：点到英文会朗读发音' : '已关闭：不朗读也不播提示音'"></span>
                        </span>
                        <span class="wm-set-switch" :class="{ 'is-on': soundOn }">
                            <i class="bi" :class="soundOn ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                            <span x-text="soundOn ? '开' : '关'"></span>
                        </span>
                    </button>

                    <button type="button" class="wm-set-item is-export" @click="openExport()"
                            title="导出为单页 HTML：不依赖本站，离线也能玩">
                        <i class="bi bi-download wm-set-icon"></i>
                        <span class="wm-set-main">
                            <span class="wm-set-title">导出</span>
                            <span class="wm-set-desc">打包成一页 HTML，发给同学也能直接玩</span>
                        </span>
                        <i class="bi bi-chevron-right wm-set-arrow"></i>
                    </button>

                    <button type="button" class="wm-set-item is-danger"
                            @click="settingsOpen = false; resetProgress()" title="重置进度">
                        <i class="bi bi-eraser wm-set-icon"></i>
                        <span class="wm-set-main">
                            <span class="wm-set-title">重置进度</span>
                            <span class="wm-set-desc">清空「<span x-text="bookLabel"></span>」的进度记录</span>
                        </span>
                        <i class="bi bi-chevron-right wm-set-arrow"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <template x-if="!levels.length">
        <div class="wm-stage">
            <div class="wm-fallback text-center text-muted py-5">
                <i class="bi bi-exclamation-circle fs-1 d-block mb-2"></i>
                单词库加载失败，请刷新页面重试。
            </div>
        </div>
    </template>

    <template x-if="levels.length">
        <div class="wm-stage">

            <!-- HUD -->
            <div class="wm-hud">
                <button type="button" class="wm-close" @click="exit()" title="退出" aria-label="退出">
                    <i class="bi bi-x-lg"></i>
                </button>
                <div class="wm-progress" :class="{ 'is-auto': autoMode }" role="progressbar"
                     :aria-valuenow="levelIndex + 1" aria-valuemin="1" :aria-valuemax="levelCount">
                    <template x-for="i in levelCount" :key="'seg' + i">
                        <span class="wm-seg" :class="segClass(i - 1)"></span>
                    </template>
                </div>
                <div class="wm-counter"><b x-text="levelIndex + 1"></b>/<span x-text="levelCount"></span></div>
            </div>

            <!-- 标题（同时也是过关提示的位置：提示出现时整行让位给它） -->
            <div class="wm-titlebar" :class="{ 'is-flashing': !!flash }">
                <h3 class="wm-title" x-text="autoMode ? '自动学习' : '选择配对'"></h3>
                <span class="wm-theme" x-show="currentLevel"><i class="bi bi-tag-fill"></i> <span
                        x-text="currentLevel ? currentLevel.theme : ''"></span></span>
                <span class="wm-auto-badge" x-show="autoMode" x-cloak>
                    <i class="bi bi-magic"></i> 自动学习中
                </span>

                <!-- 过关提示：绝对定位覆盖这一行，不占额外高度、不产生位移 -->
                <div class="wm-flash" x-show="flash" x-cloak>
                    <span class="wm-flash-emoji" x-text="flashEmoji"></span>
                    <span x-text="flash"></span>
                </div>
            </div>

            <!-- 自动学习状态条 -->
            <div class="wm-auto-bar" x-show="autoMode" x-cloak :class="{ 'is-paused': autoPaused }">
                <div class="wm-auto-tip">
                    <span class="wm-auto-tag" x-text="autoPaused ? '已暂停' : autoTag"></span>
                    <span class="wm-auto-text" x-text="autoPaused ? '点「继续」接着学' : autoTip"></span>
                </div>

            <!-- 单词区上方：说明文字 + 关卡导航
                 （原先这两块在棋盘「下方」，信息沉在最底部，且棋盘下方大片留白） -->

                <div class="wm-footer">

            <h5>本册全部通关！</h5>
            <p x-text="bookLabel + ' 的 ' + levelCount + ' 关已经全部完成，太厉害了。'"></p>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
