<script>
function wordMatchApp() {
    var DATA = window.__WORD_MATCH_DATA__ || { books: [], levels: {} };
    var PROGRESS_KEY = 'word_match_progress_v2';        // 练习模式进度
    var AUTO_KEY = 'word_match_auto_progress_v2';       // 自动学习模式进度（与练习进度不共享）
    // 词库扩容后关卡会重新切分，v1 记录的关卡下标已不对应新关卡，作废一次即可
    // （错题本存的是单词本身，仍然有效，故不在此清理）
    try {
        if (!localStorage.getItem('word_match_v2_migrated')) {
            localStorage.removeItem('word_match_progress_v1');
            localStorage.removeItem('word_match_auto_progress_v1');
            localStorage.setItem('word_match_v2_migrated', '1');
        }
    } catch (e) { /* 隐私模式等场景忽略 */ }
    var WRONG_KEY = 'word_match_wrong_v1';              // 错题本（本机浏览器）
    var BOOK_KEY = 'word_match_book_v1';
    var SOUND_KEY = 'word_match_sound_v1';
    var MAX_WRONG = 300;

    /* 自动学习节奏：每个小步骤间隔 1s，配对朗读后 2s 思考，过关节奏 4s，跨册跳转 5s。
       支持 ?wmStep=&wmThink=&wmGap=&wmBookGap= 覆盖（自动化测试用，可把整册压到几十秒跑完）。 */
    var query = new URLSearchParams(window.location.search);
    var pace = function (name, dft) {
        var v = parseInt(query.get(name) || '', 10);
        return (isFinite(v) && v >= 0) ? v : dft;
    };
    var AUTO_STEP = pace('wmStep', 1000);
    var AUTO_THINK = pace('wmThink', 2000);
    var AUTO_GAP = pace('wmGap', 4000);
    var AUTO_BOOK_GAP = pace('wmBookGap', 5000);      // 一册学完 -> 下一册的间隔
    var AUTO_SPEAK_MAX = AUTO_STEP >= 1000 ? 2200 : 300;
    /* 跨册提示里的秒数按实际节奏算，改节奏时文案不会说谎 */
    var BOOK_GAP_SEC = Math.max(1, Math.round(AUTO_BOOK_GAP / 1000));

    return {
        books: DATA.books || [],
        allLevels: DATA.levels || {},

        /* 当前册 */
        bookId: '',
        levels: [],
        levelIndex: 0,

        /* 本关 */
        currentLevel: null,
        leftCards: [],
        rightCards: [],
        sel: null,
        locked: false,
        matchedCount: 0,
        levelWrong: 0,
        buildSeq: 0,          // 每次生成卡片自增，保证 x-for 的 :key 唯一

        /* 练习进度：{ bookId: [已通关的关卡下标] } */
        progress: {},
        lastResult: null,

        /* 本会话内每个关卡上一次的排列，用于「每次进来顺序都不一样」 */
        lastLayout: {},

        /* 自动学习模式 */
        autoMode: false,
        autoPaused: false,
        autoTip: '',
        autoTag: '',
        autoStage: '',
        autoCountdown: 0,
        autoTimer: null,
        autoSeq: 0,
        autoProgress: {},

        /* 错题本 */
        wrongBook: {},
        wrongOpen: false,

        /* 册次弹出框（按学段折叠，默认只展开当前册所在学段） */
        bookPickerOpen: false,
        stageOpen: {},
        stageInit: false,

        /* 设置弹层（错题本 / 重做本关 / 朗读开关 / 重置进度 都收在这里） */
        settingsOpen: false,

        /* 导出为单页 HTML：exportSel 是 { bookId: true } 的勾选表 */
        exportOpen: false,
        exportSel: {},
        exporting: false,

        flash: '',
        flashEmoji: '',
        flashTimer: null,
        advanceTimer: null,
        finishedAll: false,

        soundOn: true,
        audioCtx: null,

        init: function () {
            this.progress = this.loadProgress();
            this.autoProgress = this.loadAutoProgress();
            this.wrongBook = this.loadWrong();
            this.soundOn = localStorage.getItem(SOUND_KEY) !== '0';

            var saved = localStorage.getItem(BOOK_KEY);
            var valid = this.books.some(function (b) { return b.id === saved; });
            this.bookId = valid ? saved : (this.books.length ? this.books[0].id : '');
            this.applyBook(this.bookId, true);

            var self = this;
            window.addEventListener('resize', function () { self.measureTop(); });
            window.addEventListener('keydown', function (e) {
                if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
                if (e.key === 'Escape') {
                    if (self.bookPickerOpen) { self.bookPickerOpen = false; return; }
                    if (self.wrongOpen) { self.wrongOpen = false; return; }
                    if (self.autoMode) self.stopAuto();
                    return;
                }
                if (self.autoMode) return;
                if (e.key === 'ArrowLeft') self.prevLevel();
                else if (e.key === 'ArrowRight') self.navNext();
            });
            this.measureTop();
            /* 工具栏会「二次长高」：字体/按钮文案就位后它会换行再涨一截，
               而 init 里这次测量发生在它定型之前（实测 41px → 67px），
               少算的 26px 正好把舞台顶出视口、整页被迫滚动。
               故跟着工具栏的尺寸变化持续重算（量 top 不量高度 ⇒ 不会自我反馈成死循环）。 */
            if (window.ResizeObserver) {
                var tb = document.querySelector('.wm-toolbar');
                if (tb) {
                    new ResizeObserver(function () { self.measureTop(); }).observe(tb);
                }
            }
            window.addEventListener('load', function () { self.measureTop(); });
        },

        /* 移动端舞台高度：用「舞台自身到页面顶部的距离」算——标题、工具栏、按钮换行都算在内。
           只量工具栏底边会少算标题那 26px，舞台被顶出视口、整页被迫滚动（390x844 实测）。
           量的是 top，不受 min-height 影响，不会自我反馈。舞台尚未渲染时退回工具栏底边。 */
        measureTop: function () {
            var st = document.querySelector('.wm-stage');
            var tb = document.querySelector('.wm-toolbar');
            var h = st ? Math.round(st.getBoundingClientRect().top + window.scrollY)
                       : (tb ? Math.round(tb.getBoundingClientRect().bottom) : 78);
            document.documentElement.style.setProperty('--wm-stage-top', Math.max(h, 40) + 'px');
        },

        /* ==================== 册 / 关 ==================== */
        applyBook: function (bookId, restore) {
            if (this.autoMode) this.stopAuto(true);
            this.bookId = bookId;
            localStorage.setItem(BOOK_KEY, bookId);
            this.levels = this.allLevels[bookId] || [];
            this.finishedAll = false;

            var done = this.progress[bookId] || [];
            var start = 0;
            if (restore && done.length) {
                // 优先回到第一个未通关的关卡；全部通关则从头再来（可自由重玩）
                var firstUndone = -1;
                for (var i = 0; i < this.levels.length; i++) {
                    if (done.indexOf(i) < 0) { firstUndone = i; break; }
                }
                start = firstUndone < 0 ? 0 : firstUndone;
            }
            this.levelIndex = Math.min(start, Math.max(0, this.levels.length - 1));
            this.loadLevel();
            this.measureTop();
        },

        openBookPicker: function () {
            // 首次打开：只展开当前册所在学段，其余（例如学小学时的初中 / 高中）全部折叠
            if (!this.stageInit) {
                this.resetStageOpen();
                this.stageInit = true;
            }
            this.bookPickerOpen = true;
        },

        /* 弹层里各学段分组的展开状态。
           手风琴式：同时只展开一个学段 —— 这样「小学 / 初中 / 高中」三个标题永远都在可视区内，
           展开出来的册次列表自己内部滚动（多开会把后面的学段标题顶出滚动区，用户就看不到还有别的学段）。 */
        openStageOnly: function (stage) {
            var open = {};
            for (var i = 0; i < this.bookGroups.length; i++) {
                open[this.bookGroups[i].stage] = (this.bookGroups[i].stage === stage);
            }
            this.stageOpen = open;
        },

        resetStageOpen: function () { this.openStageOnly(this.stageOf(this.bookId)); },

        isStageOpen: function (stage) { return !!this.stageOpen[stage]; },

        toggleStage: function (stage) { this.openStageOnly(this.stageOpen[stage] ? null : stage); },

        stageOf: function (bookId) {
            var idx = this.findBookIndex(bookId);
            return idx >= 0 ? (this.books[idx].stage || '小学') : '';
        },

        stageHasCurrent: function (stage) {
            return !!this.bookId && this.stageOf(this.bookId) === stage;
        },

        pickBook: function (bookId) {
            this.bookPickerOpen = false;
            if (bookId !== this.bookId) this.applyBook(bookId, true);
            // 换册后，下次打开弹层时新册所在学段必须是展开的
            this.openStageOnly(this.stageOf(bookId));
        },

        switchBook: function (bookId) { this.pickBook(bookId); },

        loadLevel: function () {
            if (this.advanceTimer) { clearTimeout(this.advanceTimer); this.advanceTimer = null; }
            var lv = this.levels[this.levelIndex] || null;
            this.currentLevel = lv;
            this.sel = null;
            this.locked = false;
            this.matchedCount = 0;
            this.levelWrong = 0;
            this.finishedAll = false;
            if (!lv) { this.leftCards = []; this.rightCards = []; return; }
            this.buildCards(lv);
        },

        /* 两列各自独立洗牌：① 不出现「整片一一对应」 ② 同一关再次进入时排列要变 */
        buildCards: function (lv) {
            var n = lv.pairs.length;
            /* uid 必须每次构建都不同：x-for 用 :key 复用节点时不会刷新作用域里的 card 对象，
               沿用旧 uid 会让「上一关/下一关/重做本关/退出自动学习」后卡片残留旧的选中/已完成样式 */
            this.buildSeq++;
            var seq = this.buildSeq;
            var enBase = [], zhBase = [];
            for (var i = 0; i < n; i++) {
                var p = lv.pairs[i];
                /* mean = 对面的释义：判定只看释义，同一关里若两个词释义相同（同义表达关），
                   选哪个中文都算对——两张中文卡本来就长得一模一样，用户无从区分也不该被为难 */
                enBase.push({ uid: 'L' + i + '#' + seq, side: 'L', key: p.key, text: p.en, mean: p.zh, done: false, wrong: false });
                zhBase.push({ uid: 'R' + i + '#' + seq, side: 'R', key: p.key, text: p.zh, mean: p.en, done: false, wrong: false });
            }
            var sig = this.bookId + '#' + this.levelIndex;
            var lastSig = this.lastLayout[sig] || '';
            var left = this.shuffle(enBase.slice());
            var right = this.shuffle(zhBase.slice());
            for (var att = 0; att < 60; att++) {
                var l = this.shuffle(enBase.slice());
                var r = this.shuffle(zhBase.slice());
                var aligned = this.countAligned(l, r);
                var repeat = (att < 40) && lastSig && this.layoutSig(l, r) === lastSig;
                if (aligned <= 1 && !repeat) { left = l; right = r; break; }
                if (att === 59) { left = l; right = r; }
            }
            this.lastLayout[sig] = this.layoutSig(left, right);
            this.leftCards = left;
            this.rightCards = right;
        },

        countAligned: function (left, right) {
            var n = 0;
            for (var i = 0; i < left.length && i < right.length; i++) {
                if (left[i].key === right[i].key) n++;
            }
            return n;
        },

        layoutSig: function (left, right) {
            return left.map(function (c) { return c.key; }).join(',') + '|' +
                right.map(function (c) { return c.key; }).join(',');
        },

        restartLevel: function () { this.loadLevel(); },

        nextLevel: function () {
            if (this.autoMode) return;
            if (this.levelIndex < this.levels.length - 1) {
                this.levelIndex++;
                this.loadLevel();
            }
        },

        /* 导航条右侧按钮（按钮本身 / → 方向键）统一的动作：
           普通关卡 = 下一关；本册最后一关 = 下一册（见 navNextLabel 处的说明） */
        navNext: function () {
            if (this.autoMode) return;
            if (this.atBookEnd) { this.gotoNextBook(); return; }
            this.nextLevel();
        },

        prevLevel: function () {
            if (this.autoMode) return;
            if (this.levelIndex > 0) {
                this.levelIndex--;
                this.loadLevel();
            }
        },

        /* ==================== 交互 ==================== */
        pick: function (card, auto) {
            if (this.locked || !card || card.done) return;
            if (this.autoMode && !auto) return;   // 自动学习中不接受手动点击

            // 再次点击同一张 -> 取消选中
            if (this.sel && this.sel.uid === card.uid) {
                this.sel = null;
                return;
            }
            if (!this.sel) {
                this.sel = card;
                this.tapFeedback();
                this.speakOnPick(card);      // 点英文那一下就读
                return;
            }
            // 同侧改选：替换，不判错
            if (this.sel.side === card.side) {
                this.sel = card;
                this.speakOnPick(card);
                return;
            }
            // 异侧：判定。card 是「后选中」的那张
            this.judge(this.sel, card);
        },

        /* 左右两张卡是否同义：右侧中文 == 左侧词的释义（同侧比较退回 key，用于布局去重） */
        sameMeaning: function (first, second) {
            if (!first || !second) return false;
            if (first.side === second.side) return first.key === second.key;
            var l = first.side === 'L' ? first : second;
            var r = first.side === 'L' ? second : first;
            return l.mean === r.text;
        },

        judge: function (first, second) {
            if (this.sameMeaning(first, second)) {
                first.done = true;
                second.done = true;
                this.sel = null;
                this.matchedCount++;
                this.chime(true);
                /* 朗读时机 = 点英文那一下：英文先选中时 pick() 已读过，
                   这里只补「中文先选、英文后选」的情况，避免同一个词念两遍 */
                if (!this.autoMode && second.side === 'L') {
                    this.speak(second.text);
                }
                if (this.matchedCount >= this.currentLevel.pairs.length) this.completeLevel();
                return;
            }
            // 不匹配：后选中的那张标红，先选中的保留，方便直接换一个候选者
            this.levelWrong++;
            this.recordWrong(first, second);
            this.locked = true;
            second.wrong = true;
            this.chime(false);
            var self = this;
            setTimeout(function () {
                second.wrong = false;
                self.locked = false;
            }, 620);
        },

        completeLevel: function () {
            var perfect = this.levelWrong === 0;
            this.lastResult = perfect;
            if (this.autoMode) {
                // 学习模式进度独立记录，绝不写练习进度
                this.markAutoDone(this.levelIndex);
                return;
            }
            this.markDone(this.levelIndex);

            if (this.levelIndex >= this.levels.length - 1) {
                this.showFlash(perfect ? '🎉' : '👍', perfect ? '全对通关！本册完成' : '本册完成！');
                this.finishedAll = true;
                return;
            }
            this.showFlash(perfect ? '⭐️' : '👍', perfect ? '全对！进入下一关' : '通关！进入下一关');
            var self = this;
            this.advanceTimer = setTimeout(function () {
                self.advanceTimer = null;
                if (!self.finishedAll) self.nextLevel();
            }, 950);
        },

        showFlash: function (emoji, text, ms) {
            this.flashEmoji = emoji;
            this.flash = text;
            var self = this;
            if (this.flashTimer) clearTimeout(this.flashTimer);
            this.flashTimer = setTimeout(function () { self.flash = ''; }, ms || 900);
        },

        /* ==================== 导出为单页 HTML ==================== */
        openExport: function () {
            this.settingsOpen = false;
            // 默认只勾当前册（多数人就是要把它带走），要更多再自己勾
            var sel = {};
            if (this.bookId) sel[this.bookId] = true;
            this.exportSel = sel;
            this.exportOpen = true;
        },

        closeExport: function () {
            if (this.exporting) return;          // 打包中不许关，避免半路丢状态
            this.exportOpen = false;
        },

        isExportSel: function (id) { return !!this.exportSel[id]; },

        toggleExportBook: function (id, on) {
            var next = Object.assign({}, this.exportSel);
            if (on) next[id] = true; else delete next[id];
            this.exportSel = next;
        },

        exportToggleAll: function (on) {
            var next = {};
            if (on) for (var i = 0; i < this.books.length; i++) next[this.books[i].id] = true;
            this.exportSel = next;
        },

        exportStageAll: function (stage) {
            for (var i = 0; i < this.books.length; i++) {
                var b = this.books[i];
                if ((b.stage || '小学') === stage && !this.exportSel[b.id]) return false;
            }
            return true;
        },

        exportToggleStage: function (stage, on) {
            var next = Object.assign({}, this.exportSel);
            for (var i = 0; i < this.books.length; i++) {
                var b = this.books[i];
                if ((b.stage || '小学') !== stage) continue;
                if (on) next[b.id] = true; else delete next[b.id];
            }
            this.exportSel = next;
        },

        runExport: function () {
            var self = this;
            var ids = this.exportSelList;
            if (!ids.length) { SC.toast.warn('请先勾选要导出的册次'); return; }
            this.exporting = true;
            buildStandaloneWordMatch(ids).then(function (res) {
                var bytes = downloadHtml(res.html, res.filename);
                self.exporting = false;
                self.exportOpen = false;
                SC.toast.success('已导出 ' + ids.length + ' 册 · ' + Math.round(bytes / 1024) + ' KB', 5000);
            }).catch(function (e) {
                console.error('[export] failed', e);
                self.exporting = false;
                SC.toast.error('导出失败：' + ((e && e.message) || e));
            });
        },

        exit: function () {
            if (this.autoMode) this.stopAuto(true);
            if (window.__WM_STANDALONE__) return;   // 单页导出件没有站内可退
            window.location.href = '/learn';
        },

        replayBook: function () {
            this.finishedAll = false;
            this.progress[this.bookId] = [];
            this.saveProgress();
            this.levelIndex = 0;
            this.loadLevel();
        },

        /* 下一册（自动学习跨册也用它；不能走 applyBook —— applyBook 会停掉自动学习） */
        nextBookRef: function () {
            var idx = this.findBookIndex(this.bookId);
            return (idx >= 0 && idx < this.books.length - 1) ? this.books[idx + 1] : null;
        },

        gotoNextBook: function () {
            var nb = this.nextBookRef();
            if (nb) this.applyBook(nb.id, false);
        },

        /* 自动学习里跨册：只换册并重建关卡，不动 autoMode / autoSeq */
        enterBookInAuto: function (bookId) {
            if (this.advanceTimer) { clearTimeout(this.advanceTimer); this.advanceTimer = null; }
            this.bookId = bookId;
            localStorage.setItem(BOOK_KEY, bookId);
            this.levels = this.allLevels[bookId] || [];
            this.levelIndex = 0;
            this.finishedAll = false;
            this.loadLevel();
            this.measureTop();
        },

        /* ==================== 自动学习模式 ==================== */
        startAuto: function () {
            if (this.autoMode) return;
            this.autoMode = true;
            this.autoPaused = false;
            this.finishedAll = false;
            this.autoProgress = this.loadAutoProgress();
            this.levelIndex = 0;                 // 每次开启都从第 1 关开始
            this.loadLevel();
            this.autoSeq++;
            var token = this.autoSeq;
            this.autoStage = 'start';
            this.setAutoTip('开始学习', '先看英文，再找中文');
            this.autoCountdown = 0;
            this.measureTop();
            var self = this;
            this.autoLoop(token).catch(function (e) {
                console.error('auto learn failed', e);
                self.stopAuto(true);
            });
        },

        /* 状态条文案：短标签固定可见 + 详情（单词等）过长时省略号截断，状态条永远只有一行 */
        setAutoTip: function (tag, tip) {
            this.autoTag = tag;
            this.autoTip = tip;
        },

        autoLoop: async function (token) {
            while (this.autoMode && this.autoSeq === token) {
                var lv = this.currentLevel;
                if (!lv || !lv.pairs.length) return;

                /* 一个单词一个单词地模拟「点英文（同时朗读）-> 点中文 -> 思考 2 秒」 */
                while (this.autoMode && this.autoSeq === token) {
                    var remain = this.leftCards.filter(function (c) { return !c.done; });
                    if (!remain.length) break;
                    var enCard = remain[0];
                    var i;
                    var zhCard = null;
                    for (i = 0; i < this.rightCards.length; i++) {
                        var rc = this.rightCards[i];
                        if (!rc.done && rc.text === enCard.mean) { zhCard = rc; break; }
                    }
                    if (!zhCard) break;

                    this.autoStage = 'pick-en';
                    this.setAutoTip('看英文', enCard.text);
                    if (!(await this.autoSleep(AUTO_STEP, token))) return;

                    this.pick(enCard, true);                       // 选中英文
                    this.autoStage = 'listen';                     // 点英文后立即朗读，念完再往下走
                    this.setAutoTip('听读音', enCard.text);
                    await this.speakThenWait(enCard.text, token);
                    if (!this.autoMode || this.autoSeq !== token) return;

                    this.autoStage = 'pick-zh';
                    this.setAutoTip('找出中文', enCard.text);
                    if (!(await this.autoSleep(AUTO_STEP, token))) return;

                    this.pick(zhCard, true);          // 配对成功
                    if (this.matchedCount >= lv.pairs.length) break;   // 本关收尾交给下面的过关节奏

                    this.autoStage = 'think';
                    this.setAutoTip('记一记', zhCard.text + ' = ' + enCard.text);
                    if (!(await this.autoSleep(AUTO_THINK, token))) return;
                }

                if (!this.autoMode || this.autoSeq !== token) return;

                /* 本册学完：先给 5 秒记忆 + 跳转提示，再自动接着学下一册（最后一册才收尾） */
                if (this.levelIndex >= this.levels.length - 1) {
                    var nextBook = this.nextBookRef();
                    if (nextBook) {
                        var nextLabel = nextBook.label;
                        this.autoStage = 'book-gap';
                        this.setAutoTip('本册完成', BOOK_GAP_SEC + ' 秒后进入下一册');
                        this.showFlash('📚', '本册学完！即将进入「' + nextLabel + '」', AUTO_BOOK_GAP);
                        if (!(await this.autoSleep(AUTO_BOOK_GAP, token))) return;

                        this.enterBookInAuto(nextBook.id);
                        this.autoStage = 'book-start';
                        this.setAutoTip('开始学习', '「' + nextLabel + '」第 1 关');
                        if (!(await this.autoSleep(AUTO_STEP, token))) return;
                        continue;
                    }
                    this.autoStage = 'finish';
                    this.setAutoTip('全部完成', '共 ' + this.books.length + ' 册，太棒了！');
                    this.showFlash('🏆', '全部 ' + this.books.length + ' 册都学完啦！', 2600);
                    await this.autoSleep(1500, token);
                    this.stopAuto(true);
                    if (typeof SC !== 'undefined' && SC.toast) {
                        SC.toast.success('全部 ' + this.books.length + ' 册自动学习完成');
                    }
                    return;
                }

                /* 本关完成：额外给 4 秒思考与记忆 */
                this.autoStage = 'gap';
                this.setAutoTip('本关完成', '即将进入下一关');
                this.showFlash('✅', '本关完成！即将进入下一关', AUTO_GAP);
                if (!(await this.autoSleep(AUTO_GAP, token))) return;

                this.levelIndex++;
                this.loadLevel();
            }
        },

        /* 可中断、可暂停的等待：返回 false 表示节奏已被打断（退出/切关） */
        autoSleep: function (ms, token) {
            var self = this;
            return new Promise(function (resolve) {
                var remain = ms;
                var tick = ms > 1000 ? 200 : 50;
                self.autoCountdown = Math.ceil(ms / 1000);
                var step = function () {
                    if (!self.autoMode || self.autoSeq !== token) {
                        self.autoTimer = null;
                        resolve(false);
                        return;
                    }
                    if (self.autoPaused) { self.autoTimer = setTimeout(step, 150); return; }
                    remain -= tick;
                    self.autoCountdown = Math.max(0, Math.ceil(remain / 1000));
                    if (remain <= 0) { self.autoTimer = null; resolve(true); return; }
                    self.autoTimer = setTimeout(step, tick);
                };
                self.autoTimer = setTimeout(step, tick);
            });
        },

        /* 朗读（等它念完再开始计时思考，念不出来也会按上限兜底） */
        speakThenWait: function (text, token) {
            var self = this;
            return new Promise(function (resolve) {
                var done = false;
                var finish = function () {
                    if (done) return;
                    done = true;
                    clearTimeout(cap);
                    resolve();
                };
                var cap = setTimeout(finish, AUTO_SPEAK_MAX);
                if (!self.soundOn || !window.speechSynthesis) {
                    clearTimeout(cap);
                    self.autoSleep(600, token).then(finish);
                    return;
                }
                try {
                    var u = new SpeechSynthesisUtterance(text);
                    u.lang = 'en-US';
                    u.rate = 0.85;
                    u.onend = finish;
                    u.onerror = finish;
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(u);
                } catch (e) { finish(); }
            });
        },

        toggleAutoPause: function () {
            if (!this.autoMode) return;
            this.autoPaused = !this.autoPaused;
            if (this.autoPaused) {
                try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
            }
        },

        stopAuto: function (silent) {
            if (!this.autoMode) {
                this.autoStage = '';
                this.autoTag = '';
                this.autoTip = '';
                this.autoCountdown = 0;
                return;
            }
            this.autoMode = false;
            this.autoSeq++;
            this.autoPaused = false;
            if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
            try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
            this.autoStage = '';
            this.autoTag = '';
            this.autoTip = '';
            this.autoCountdown = 0;
            this.loadLevel();          // 回到练习模式的干净状态
            this.measureTop();
            if (!silent && typeof SC !== 'undefined' && SC.toast) SC.toast.info('已退出自动学习');
        },

        /* ==================== 错题本（本机浏览器保存） ==================== */
        loadWrong: function () {
            try {
                var raw = localStorage.getItem(WRONG_KEY);
                var obj = raw ? JSON.parse(raw) : null;
                return (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { return {}; }
        },

        saveWrong: function () {
            try { localStorage.setItem(WRONG_KEY, JSON.stringify(this.wrongBook)); } catch (e) { /* 忽略 */ }
        },

        recordWrong: function (first, second) {
            var enCard = first.side === 'L' ? first : second;
            var zhCard = first.side === 'L' ? second : first;
            if (!enCard || enCard.side !== 'L' || !zhCard || zhCard.side !== 'R') return;
            var lv = this.currentLevel;
            var correctZh = '';
            if (lv) {
                for (var i = 0; i < lv.pairs.length; i++) {
                    if (lv.pairs[i].key === enCard.key) { correctZh = lv.pairs[i].zh; break; }
                }
            }
            var old = this.wrongBook[enCard.key];
            var next = Object.assign({}, this.wrongBook);
            next[enCard.key] = {
                key: enCard.key,
                en: enCard.text,
                zh: correctZh || (old ? old.zh : ''),
                miss: zhCard.text,
                bookId: this.bookId,
                bookLabel: this.bookLabel,
                theme: lv ? lv.theme : '',
                level: this.levelIndex,
                count: (old ? old.count : 0) + 1,
                ts: Date.now()
            };
            this.wrongBook = this.trimWrong(next);
            this.saveWrong();
        },

        trimWrong: function (obj) {
            var keys = Object.keys(obj);
            if (keys.length <= MAX_WRONG) return obj;
            keys.sort(function (a, b) { return (obj[b].ts || 0) - (obj[a].ts || 0); });
            var out = {};
            for (var i = 0; i < MAX_WRONG; i++) out[keys[i]] = obj[keys[i]];
            return out;
        },

        openWrongBook: function () { this.wrongOpen = true; },

        removeWrong: function (w) {
            var next = Object.assign({}, this.wrongBook);
            delete next[w.key];
            this.wrongBook = next;
            this.saveWrong();
        },

        clearWrong: function () {
            var self = this;
            if (!this.wrongTotal) return;
            var msg = '将清空错题本里的 ' + this.wrongTotal + ' 个单词，确定吗？';
            var ask = (typeof SC !== 'undefined' && SC.confirm)
                ? SC.confirm({ title: '清空错题本', message: msg, confirmText: '清空', danger: true })
                : Promise.resolve(window.confirm(msg));
            ask.then(function (ok) {
                if (!ok) return;
                self.wrongBook = {};
                self.saveWrong();
                if (typeof SC !== 'undefined' && SC.toast) SC.toast.success('错题本已清空');
            });
        },

        gotoWrong: function (w) {
            this.wrongOpen = false;
            if (this.autoMode) this.stopAuto(true);
            if (w.bookId !== this.bookId) {
                this.applyBook(w.bookId, false);
            }
            if (w.level >= 0 && w.level < this.levels.length) {
                this.levelIndex = w.level;
                this.loadLevel();
            }
        },

        /* ==================== 进度 ==================== */
        loadProgress: function () {
            return this.readMap(PROGRESS_KEY);
        },

        loadAutoProgress: function () {
            return this.readMap(AUTO_KEY);
        },

        readMap: function (key) {
            try {
                var raw = localStorage.getItem(key);
                var obj = raw ? JSON.parse(raw) : {};
                return (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { return {}; }
        },

        saveProgress: function () {
            try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(this.progress)); } catch (e) { /* 忽略 */ }
        },

        saveAutoProgress: function () {
            try { localStorage.setItem(AUTO_KEY, JSON.stringify(this.autoProgress)); } catch (e) { /* 忽略 */ }
        },

        markDone: function (index) {
            var done = this.progress[this.bookId] || (this.progress[this.bookId] = []);
            if (done.indexOf(index) < 0) done.push(index);
            this.progress[this.bookId] = done;
            this.saveProgress();
        },

        markAutoDone: function (index) {
            var done = this.autoProgress[this.bookId] || (this.autoProgress[this.bookId] = []);
            if (done.indexOf(index) < 0) done.push(index);
            this.autoProgress[this.bookId] = done;
            this.saveAutoProgress();
        },

        resetProgress: function () {
            var self = this;
            var kind = this.autoMode ? '自动学习' : '练习';
            var msg = '将清空「' + this.bookLabel + '」的' + kind + '进度记录，确定吗？';
            var ask = (typeof SC !== 'undefined' && SC.confirm)
                ? SC.confirm({ title: '重置进度', message: msg, confirmText: '重置', danger: true })
                : Promise.resolve(window.confirm(msg));
            ask.then(function (ok) {
                if (!ok) return;
                if (self.autoMode) {
                    self.autoProgress[self.bookId] = [];
                    self.saveAutoProgress();
                } else {
                    self.progress[self.bookId] = [];
                    self.saveProgress();
                }
                self.levelIndex = 0;
                self.loadLevel();
                if (typeof SC !== 'undefined' && SC.toast) {
                    SC.toast.success('已重置「' + self.bookLabel + '」的' + kind + '进度');
                }
            });
        },

        /* ==================== 视图辅助 ==================== */
        cardClass: function (card) {
            return {
                'is-sel': !!this.sel && this.sel.uid === card.uid,
                'is-done': card.done,
                'is-wrong': card.wrong
            };
        },

        segClass: function (index) {
            var done = this.activeProgress[this.bookId] || [];
            if (done.indexOf(index) >= 0) return 'is-done';
            if (index === this.levelIndex) return 'is-current';
            return '';
        },

        bookDone: function (bookId, auto) {
            var src = auto ? this.autoProgress : this.progress;
            return (src[bookId] || []).length;
        },

        findBookIndex: function (bookId) {
            for (var i = 0; i < this.books.length; i++) {
                if (this.books[i].id === bookId) return i;
            }
            return -1;
        },

        shuffle: function (arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            }
            return arr;
        },

        /* ==================== 音效 ==================== */
        toggleSound: function () {
            this.soundOn = !this.soundOn;
            localStorage.setItem(SOUND_KEY, this.soundOn ? '1' : '0');
        },

        tone: function (freq, startAt, duration, type, gain) {
            var ctx = this.audioCtx;
            var osc = ctx.createOscillator();
            var g = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            g.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
            g.gain.exponentialRampToValueAtTime(gain || 0.09, ctx.currentTime + startAt + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + duration);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(ctx.currentTime + startAt);
            osc.stop(ctx.currentTime + startAt + duration + 0.02);
        },

        ensureCtx: function () {
            if (!this.soundOn) return null;
            if (!this.audioCtx) {
                var Ctor = window.AudioContext || window.webkitAudioContext;
                if (!Ctor) return null;
                try { this.audioCtx = new Ctor(); } catch (e) { return null; }
            }
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            return this.audioCtx;
        },

        chime: function (ok) {
            if (!this.ensureCtx()) return;
            if (ok) {
                this.tone(660, 0, 0.12, 'sine', 0.08);
                this.tone(880, 0.09, 0.16, 'sine', 0.08);
            } else {
                this.tone(200, 0, 0.16, 'triangle', 0.06);
                this.tone(150, 0.12, 0.18, 'triangle', 0.06);
            }
        },

        tapFeedback: function () {
            if (!this.ensureCtx()) return;
            this.tone(520, 0, 0.06, 'sine', 0.05);
        },

        /* 选中英文卡片时的朗读：自动学习模式交给 autoLoop 的 speakThenWait 控制节奏 */
        speakOnPick: function (card) {
            if (this.autoMode || !card || card.side !== 'L') return;
            this.speak(card.text);
        },

        speak: function (text) {
            if (!this.soundOn || !window.speechSynthesis) return;
            try {
                var u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(u);
            } catch (e) { /* 忽略：部分浏览器不支持 */ }
        },

        /* 册次按学段分组（小学 / 初中），册次选择器分组展示 */
        get bookGroups() {
            var out = [];
            for (var i = 0; i < this.books.length; i++) {
                var b = this.books[i];
                var stage = b.stage || '小学';
                var g = null;
                for (var j = 0; j < out.length; j++) {
                    if (out[j].stage === stage) { g = out[j]; break; }
                }
                if (!g) { g = { stage: stage, books: [], levelCount: 0 }; out.push(g); }
                g.books.push(b);
                g.levelCount += b.levelCount;
            }
            return out;
        },

        /* ==================== 文案 ==================== */
        get bookLabel() {
            var idx = this.findBookIndex(this.bookId);
            return idx >= 0 ? this.books[idx].label : '';
        },

        get levelCount() { return this.levels.length; },

        get totalLevels() {
            var n = 0;
            for (var i = 0; i < this.books.length; i++) n += this.books[i].levelCount;
            return n;
        },

        /* ---------- 导出：勾选状态（勾选表用对象存，Alpine 才能追踪到变化） ---------- */
        get exportSelList() {
            var out = [];
            for (var i = 0; i < this.books.length; i++) {
                if (this.exportSel[this.books[i].id]) out.push(this.books[i].id);
            }
            return out;
        },

        get exportSelCount() { return this.exportSelList.length; },

        get exportAllSelected() {
            return this.books.length > 0 && this.exportSelCount === this.books.length;
        },

        get exportPartSelected() { return this.exportSelCount > 0 && !this.exportAllSelected; },

        get exportLevelCount() {
            var n = 0;
            for (var i = 0; i < this.books.length; i++) {
                if (this.exportSel[this.books[i].id]) n += this.books[i].levelCount;
            }
            return n;
        },

        get exportWordCount() {
            var n = 0;
            for (var i = 0; i < this.books.length; i++) {
                if (this.exportSel[this.books[i].id]) n += this.books[i].wordCount;
            }
            return n;
        },

        /* 进度条与计数按当前模式取数：学习模式进度与练习模式不共享 */
        get activeProgress() {
            return this.autoMode ? this.autoProgress : this.progress;
        },

        get doneCount() { return (this.activeProgress[this.bookId] || []).length; },

        get wrongTotal() { return Object.keys(this.wrongBook).length; },

        get wrongList() {
            var book = this.wrongBook;
            return Object.keys(book)
                .map(function (k) { return book[k]; })
                .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
        },

        get hasNextBook() { return !!this.nextBookRef(); },

        get canPrev() { return !this.autoMode && this.levelIndex > 0; },

        get canNext() { return !this.autoMode && this.levelIndex < this.levels.length - 1; },

        /* ==================== 本册收尾：最后一关 -> 下一册 ====================
           站到本册最后一关时「下一关」这个说法就不成立了，而 canNext 在那里恒为 false：
           用户点掉通关弹窗的「继续看看」之后会彻底卡住 —— 既不能前进，也没有换册的入口。
           所以最后一关起按钮改叫「下一册」，本关打完即可一键进入下一册第一关。 */
        get atBookEnd() {
            return !this.autoMode && this.levels.length > 0 && this.levelIndex >= this.levels.length - 1;
        },

        /* 最后一关本身是否已通关。本册全部完成时它必然为真，所以也覆盖了「整册打完」那种情况 */
        get lastLevelDone() {
            return this.atBookEnd
                && (this.activeProgress[this.bookId] || []).indexOf(this.levelIndex) >= 0;
        },

        get navNextLabel() {
            if (!this.atBookEnd) return '下一关';
            return this.nextBookRef() ? '下一册' : '最后一册';
        },

        get navNextIcon() {
            return this.atBookEnd ? 'bi-arrow-right-circle' : 'bi-chevron-right';
        },

        get navNextTitle() {
            if (!this.atBookEnd) return '下一关（→ 方向键）';
            if (!this.nextBookRef()) return '已是最后一册，没有下一册了';
            return this.lastLevelDone ? '本册已完成，进入下一册' : '先打完本册最后一关，再进入下一册';
        },

        get canNavNext() {
            if (!this.atBookEnd) return this.canNext;
            return this.lastLevelDone && !!this.nextBookRef();
        },

        get hintText() {
            if (this.autoMode) return '自动学习中 · 可随时暂停或退出';
            if (!this.sel) return '先点一个英文单词，再点它对应的中文';
            var other = this.sel.side === 'L' ? '右' : '左';
            var want = this.sel.side === 'L' ? '中文' : '英文';
            return '已选中「' + this.sel.text + '」，请在' + other + '侧找到它的' + want;
        }
    };
}

/* ==========================================================================
   导出为单页 HTML
   --------------------------------------------------------------------------
   做法：把「服务端渲染出来的这份页面」原样取回来做改造，而不是另写一套页面 ——
   导出的东西永远跟线上页一致，不会出现两套实现各自漂移。改造清单：

     ① 去掉站点导航（#site-nav）与 nav.js；
     ② 外链 CSS 全删，改成一份内联 <style>（Bootstrap + style.css + app.css + 图标字体 data URI），
        摆在页面自带 <style> 之前，保证层叠顺序和线上一致；
     ③ 外链 JS 就地换成内联脚本（位置不变 ⇒ 执行顺序不变），丢掉没用到的 bootstrap.bundle；
     ④ 词库脚本换成字面量，只含被勾选的册次，不再请求 /learn/word-match/data；
     ⑤ body 打 data-standalone，隐藏「退出」「导出」这两个只在站内才成立的入口。

   结果：单个 .html，双击即玩，**零网络请求**（图标字体也内联成 data URI）。
   为什么不是 .mhtml：MHTML 是 multipart/related 容器，靠 Blob 拼出来跨浏览器不通用，
   Chrome 打开本地 .mht 还会按「邮件存档」另存一份；单文件 HTML + data URI 才是最稳的形态。
   ========================================================================== */

var EXPORT_CSS = ['/vendor/bootstrap/css/bootstrap.min.css',
                  '/vendor/bootstrap-icons/css/bootstrap-icons.min.css',
                  '/css/style.css',
                  '/css/app.css'];
var EXPORT_JS = ['/js/common.js',
                 '/vendor/alpinejs/cdn.min.js'];
var EXPORT_FONT = '/vendor/bootstrap-icons/css/fonts/bootstrap-icons.woff2';

function fetchText(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error(url + ' 取不到（HTTP ' + r.status + '）');
        return r.text();
    });
}

function fetchBase64(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error(url + ' 取不到（HTTP ' + r.status + '）');
        return r.arrayBuffer();
    }).then(function (buf) {
        var bytes = new Uint8Array(buf), step = 0x8000, parts = [];
        for (var i = 0; i < bytes.length; i += step) {
            parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + step)));
        }
        return btoa(parts.join(''));
    });
}

/* 内联脚本里出现脚本结束标记（script 闭合串）会提前结束脚本块，必须打断。
   注意连注释里都不能写那个字面量 —— 浏览器只看字符，不看它是不是注释。
   JS 字符串里 \/ 与 / 等价，所以打断后语义不变。 */
function escapeScript(code) { return String(code).replace(/<\/script/gi, '<\\/script'); }

/* 图标字体 130KB，但页面真正用到的图标只有二十来个。字体整份内联，只裁剪 CSS 规则；
   图标名从「页面源码」里扫（含 :class 表达式里的），以后新增图标不用回来改这里。 */
function pickIconCss(iconCss, sourceText, fontB64) {
    var used = {}, m, nameRe = /bi-[a-z0-9-]+/g;
    while ((m = nameRe.exec(sourceText))) used[m[0]] = true;

    var keep = [], r, ruleRe = /\.bi-([a-z0-9-]+)::before\{[^}]*\}/g;
    while ((r = ruleRe.exec(iconCss))) if (used['bi-' + r[1]]) keep.push(r[0]);

    var face = iconCss.match(/@font-face\{[^}]*\}/);
    var base = iconCss.match(/\.bi::before,[^{]*\{[^}]*\}/);
    var faceTxt = face ? face[0].replace(/src:[^}]*/,
        'src:url(data:font/woff2;base64,' + fontB64 + ') format("woff2")') : '';
    return faceTxt + (base ? base[0] : '') + keep.join('');
}

function stampDate(d) {
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* 用 a[download] + Blob 落盘，返回字节数（可用于提示体积） */
function downloadHtml(html, filename) {
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
    return blob.size;
}

function buildStandaloneWordMatch(ids) {
    var want = {};
    (ids || []).forEach(function (id) { want[id] = true; });

    return fetchText(window.location.pathname).then(function (pageHtml) {
        return Promise.all([
            Promise.all(EXPORT_CSS.map(fetchText)),
            Promise.all(EXPORT_JS.map(fetchText)),
            fetchBase64(EXPORT_FONT)
        ]).then(function (got) {
            var cssList = got[0], jsList = got[1], fontB64 = got[2];
            var codeMap = {};
            EXPORT_JS.forEach(function (u, n) { codeMap[u] = jsList[n]; });
            if (!codeMap['/vendor/alpinejs/cdn.min.js']) throw new Error('Alpine 脚本没取到，导出会变成死页面');
            var doc = new DOMParser().parseFromString(pageHtml, 'text/html');
            var head = doc.head, body = doc.body;

            /* ① 站点导航 */
            var nav = doc.getElementById('site-nav');
            if (nav) nav.remove();

            /* ② 外链 CSS + 图标字体 → 一份内联 <style>（插在页面自带 <style> 之前） */
            var styleEl = doc.createElement('style');
            styleEl.setAttribute('data-wm-inline', 'css');
            styleEl.textContent = '\n/* ===== 内联：Bootstrap 5 ===== */\n' + cssList[0]
                + '\n/* ===== 内联：Bootstrap Icons（规则按用到的图标裁剪，字体是 data URI） ===== */\n'
                + pickIconCss(cssList[1], pageHtml, fontB64)
                + '\n/* ===== 内联：style.css ===== */\n' + cssList[2]
                + '\n/* ===== 内联：app.css ===== */\n' + cssList[3] + '\n';
            var ownStyle = head.querySelector('style');
            head.insertBefore(styleEl, ownStyle || head.firstChild);

            var drop = doc.querySelectorAll('link[rel="stylesheet"], link[rel="icon"], link[rel="shortcut icon"]');
            for (var i = 0; i < drop.length; i++) drop[i].remove();

            /* ③ 外链 JS：就地换内联（bootstrap.bundle 页面一处没用到，丢掉省 80KB） */
            var scripts = doc.querySelectorAll('script[src]');
            for (var j = 0; j < scripts.length; j++) {
                var el = scripts[j], src = el.getAttribute('src') || '';
                var code = codeMap[src] || null;      /* 取不到就当没用到，直接删（别写出 undefined） */
                if (!code) { el.remove(); continue; }
                var node = doc.createElement('script');
                node.textContent = escapeScript(code);
                el.parentNode.replaceChild(node, el);
            }

            /* ④ 词库：只留勾选的册，就地写死 */
            var src = window.__WORD_MATCH_DATA__ || { books: [], levels: {} };
            var payload = { books: [], levels: {} };
            (src.books || []).forEach(function (b) {
                if (!want[b.id]) return;
                payload.books.push(b);
                payload.levels[b.id] = (src.levels || {})[b.id] || [];
            });
            var inlined = false;
            var own = doc.querySelectorAll('script:not([src])');
            for (var k = 0; k < own.length; k++) {
                if (own[k].textContent.indexOf('__WORD_MATCH_DATA__') < 0) continue;
                own[k].textContent = '\n/* 词库随文件一起带走：只含本次导出的册次 */\n'
                    + 'window.__WM_STANDALONE__ = true;\n'
                    + 'window.__WORD_MATCH_DATA__ = ' + JSON.stringify(payload) + ';\n';
                inlined = true;
                break;
            }
            if (!inlined) throw new Error('页面结构变了：找不到词库引导脚本');

            /* ⑤ 单机模式标记 */
            body.setAttribute('data-standalone', '1');
            body.removeAttribute('data-nav');

            var labels = payload.books.map(function (b) { return b.label; });
            var titleEl = doc.querySelector('title');
            if (titleEl) {
                titleEl.textContent = '英语单词匹配' + (labels.length
                    ? ' · ' + (labels.length <= 2 ? labels.join(' / ') : labels[0] + ' 等 ' + labels.length + ' 册')
                    : '');
            }

            return {
                html: '<!DOCTYPE html>\n' + doc.documentElement.outerHTML,
                filename: 'word-match-' + stampDate(new Date())
                    + (ids.length > 1 ? '-' + ids.length + '\u518c' : '') + '.html'
            };
        });
    });
}
</script>
<script src="/vendor/alpinejs/cdn.min.js" defer></script>
</body>
