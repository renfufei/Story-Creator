<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全文阅读</title>
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            margin: 0;
            background: var(--reader-bg, #fff);
            color: var(--reader-fg, #212529);
        }
        [x-cloak] { display: none !important; }
        /* 正文骨架：行宽节奏贴近真实正文，数据到了不会有明显跳动 */
        /* 正文骨架：行宽节奏贴近真实正文，数据到了不会有明显跳动。
           宽度跟随 .reader-main（原来写死 46rem，比正文窄，骨架退场时整块会「撑开」一下） */
        .reader-skeleton { padding: .5rem 0 1.5rem; }
        /* 侧边栏跟随阅读背景色：--reader-sidebar-* 由 applyBg() 按当前底色/文字色推导 */
        .reader-sidebar {
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            background: var(--reader-sidebar-bg, #f8f9fa);
            color: var(--reader-sidebar-fg, #212529);
            border-right: 1px solid var(--reader-sidebar-border, #dee2e6);
            padding: 1rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .reader-sidebar hr {
            border-color: var(--reader-sidebar-border, #dee2e6);
            opacity: 1;
        }
        /* Bootstrap 的 .text-muted 带 !important，这里靠更高特异性覆盖 */
        .reader-sidebar .text-muted {
            color: var(--reader-sidebar-muted, #6c757d) !important;
        }
        /* 侧边栏内按钮：描边/文字跟随当前配色（比 Bootstrap 固定灰更协调，深色底也不会看不见）*/
        .reader-sidebar .btn-side {
            color: var(--reader-sidebar-muted, #6c757d);
            border: 1px solid var(--reader-sidebar-muted, #6c757d);
            background: transparent;
        }
        .reader-sidebar .btn-side:hover,
        .reader-sidebar .btn-side:focus-visible {
            color: var(--reader-sidebar-fg, #212529);
            border-color: var(--reader-sidebar-fg, #212529);
            background: var(--reader-sidebar-hover, #e9ecef);
        }
        .reader-sidebar.collapsed {
            transform: translateX(-100%);
        }
        /* 正文列宽：原来写死 max-width:900px，侧栏占掉 260px 后整块被顶在左边，
           1920 屏右边要空出近 1000px。现在改成「在侧栏右侧的剩余区域里居中」，
           宽屏时左右空白均分；窄到装不下时直接铺满剩余区域，不再是固定 900。 */
        .reader-main {
            margin-left: max(260px, calc((100% - 860px) / 2));
            padding: 2rem 3rem 4rem;
            max-width: min(1120px, calc(100% - 260px));
            transition: margin-left 0.3s ease;
        }
        /* 侧栏收起：可用区域是整幅宽度，居中规则跟着换一套 */
        .reader-main.expanded {
            margin-left: max(0px, calc((100% - 1120px) / 2));
            max-width: min(1120px, 100%);
        }
        .toggle-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1100;
            transition: left 0.3s ease;
        }
        .toggle-btn.shifted {
            left: 270px;
        }
        .chapter-content {
            white-space: pre-wrap;
            font-size: 1.05rem;
            line-height: 1.8;
        }
        .chapter-divider {
            border: 0;
            border-top: 2px dashed #dee2e6;
            margin: 3rem 0;
        }
        .toc-link {
            display: block;
            padding: 0.3rem 0.55rem;
            border-left: 3px solid transparent;
            color: var(--reader-sidebar-fg, #333);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.45;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .toc-link:hover {
            background: var(--reader-sidebar-hover, #e9ecef);
            border-left-color: var(--reader-sidebar-muted, #6c757d);
            color: var(--reader-sidebar-fg, #000);
        }
        .toc-link.active {
            background: var(--reader-sidebar-hover, #e9ecef);
            border-left-color: var(--reader-sidebar-fg, #333);
            color: var(--reader-sidebar-fg, #000);
            font-weight: 600;
        }
        .toc-volume-header {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.5rem;
            margin-top: 0.3rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--reader-sidebar-fg, #333);
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }
        .toc-volume-header:hover {
            background: var(--reader-sidebar-hover, #e9ecef);
        }
        .toc-volume-header i {
            font-size: 0.75rem;
            transition: transform 0.2s;
        }
        /* 番外分组标题：比卷标题更次要 */
        .toc-sub {
            font-size: 0.85rem;
            color: var(--reader-sidebar-muted, #6c757d);
        }
        .toc-volume-chapters {
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding-left: 0.5rem;
        }
        .tts-toolbar {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 0.4rem 0.5rem;
        }
        /* ===== 收听条：默认只占一行（摘要 + 主操作 + 箭头），点箭头才摊开设置 =====
           原来音色/语速/段落/导出/全文收听各占一行，手机上这块 237px 高、左边缘还对不齐。 */
        .tts-bar {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            min-height: 2.25rem;
        }
        /* 摘要区就是展开/收起的开关本体：整块可点，右端箭头 180° 旋转示意 */
        .tts-toggle {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex: 1 1 auto;
            min-width: 0;          /* 不加就在 flex 里撑到不收缩，meta 省略号失效 */
            padding: 0.3rem 0.45rem;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: inherit;
            font-size: 0.88rem;
            line-height: 1.2;
            text-align: left;
        }
        .tts-toggle:hover { background: rgba(0, 0, 0, 0.045); }
        .tts-toggle:focus-visible { outline: 2px solid #0d6efd; outline-offset: 1px; }
        .tts-title { font-weight: 700; white-space: nowrap; flex: 0 0 auto; }
        .tts-meta {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.76rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tts-caret {
            flex: 0 0 auto;
            font-size: 0.72rem;
            color: currentColor;
            opacity: 0.65;
            transition: transform 0.2s ease;
        }
        .tts-toggle[aria-expanded="true"] .tts-caret { transform: rotate(180deg); }
        .tts-bar-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex: 0 0 auto;
        }
        .tts-progress {
            font-size: 0.76rem;
            white-space: nowrap;
        }
        /* 折叠态里的暂停 / 停止：定宽定高，不随图标与字数变宽 */
        .tts-icon-btn {
            width: 2.2rem;
            height: 2.2rem;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        /* ===== 展开态 ===== */
        .tts-detail {
            border-top: 1px dashed #dee2e6;
            margin-top: 0.45rem;
            padding-top: 0.6rem;
        }
        /* 行 = 【标签】【控件】【尾随值】三列：所有标签左边缘对齐，控件左边缘也对齐 */
        .tts-row {
            display: grid;
            grid-template-columns: 2.9rem minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.5rem;
        }
        .tts-row + .tts-row { margin-top: 0.5rem; }
        .tts-label {
            font-size: 0.76rem;
            white-space: nowrap;
        }
        .tts-speed-val {
            font-size: 0.76rem;
            min-width: 2.5rem;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .tts-range { flex: 1 1 auto; min-width: 0; }
        .tts-num { width: 4.2rem; flex: 0 0 auto; }
        .tts-extra {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }
        /* 「上次到第 N 章」提示：一行装下，文字可省略，按钮不换行 */
        .tts-resume {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.4rem;
            padding: 0.25rem 0.35rem 0.25rem 0.5rem;
            border-radius: 6px;
            background: #e7f1ff;
            color: #0a4b8c;
            font-size: 0.76rem;
            line-height: 1.3;
        }
        .tts-resume-text {
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tts-resume .btn { flex: 0 0 auto; font-size: 0.74rem; line-height: 1.55; padding: 0 0.5rem; }
        /* 320px 这类极窄屏：摘要只剩「s…」这种半截省略号，不如整块让位给按钮 */
        @media (max-width: 359px) {
            .tts-meta { display: none; }
            .tts-toggle { gap: 0.3rem; padding-left: 0.35rem; }
        }
        /* 宽屏（≥769px）横向排开一行就够，不必像手机那样竖着堆三行。
           手机上默认用上面的 grid 竖排；这里只覆盖排版，不动折叠逻辑。 */
        @media (min-width: 769px) {
            .tts-detail {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.6rem 1.4rem;
            }
            .tts-detail-inner {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.6rem 1.4rem;
            }
            .tts-row {
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }
            .tts-row + .tts-row { margin-top: 0; }
            .tts-row > .form-select { max-width: 11rem; }
            .tts-row > .tts-range { width: 8rem; flex: 0 0 auto; }
            .tts-extra { margin-top: 0; margin-left: auto; }
        }
        /* 章节旁的 TTS 操作组：播放/暂停 + 停止，两个按钮之间留 6px 间隔。
           ★ 子按钮不要挂 d-flex 之类带 !important 的显示类 —— 会顶掉 x-show 的 display:none */
        .tts-chapter-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .tts-chapter-btn {
            opacity: 0.6;
            /* 原来是纯图标按钮（宽约 31px），改成图标+两字后按 4.5rem 定宽，三态切换不跳动 */
            min-width: 4.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .tts-chapter-btn:hover, .tts-chapter-btn.active {
            opacity: 1;
        }
        /* 正在播放 / 暂停的那一章：按钮整体实色，和旁边半透明的【播放】拉开层次 */
        .tts-chapter-actions.is-active .tts-chapter-btn {
            opacity: 1;
        }
        /* 一章播完到下一章之间的 3 秒空档：不给提示会让人以为播放已经结束 */
        .tts-next-hint {
            font-size: 0.78rem;
            color: #6c757d;
            white-space: nowrap;
            margin-left: 2px;   /* 和【停止】拉开一点，6px 的 flex gap 贴得太紧 */
        }
        /* ===== 阅读背景色选择器（网文护眼配色）===== */
        /* 浮动按钮：紧贴折叠(☰)按钮下方，位置随侧边栏开合同步偏移 */
        .bg-fab {
            position: fixed;
            top: 50px;
            left: 10px;
            z-index: 1100;
            transition: left 0.3s ease;
        }
        .bg-fab.shifted { left: 270px; }
        .bg-popover {
            position: absolute;
            top: 0;
            left: calc(100% + 8px);
            width: 228px;
            /* 浮层从按钮右侧 8px 展开（手机并排后约 101px 起）。320 屏放不下 228px，
               用 vw 兜一下，免得顶出右边界、把页面撑出横向滚动 */
            max-width: calc(100vw - 112px);
            z-index: 1200;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
            padding: .6rem;
        }
        .bg-swatch {
            height: 34px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, .18);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .72rem;
            line-height: 1;
            transition: transform .15s ease;
        }
        .bg-swatch:hover { transform: scale(1.06); }
        .bg-swatch.active { outline: 2px solid #0d6efd; outline-offset: 2px; }
        /* 弹层内的「恢复默认」：虚线描边按钮，与色板区分开 */
        .bg-reset-row {
            border-top: 1px dashed #dee2e6;
            margin-top: .55rem;
            padding-top: .55rem;
        }
        .bg-reset-btn {
            font-size: .78rem;
            color: #495057;
            border: 1px dashed #b9c0c7;
            background: #fbfbfc;
        }
        .bg-reset-btn:hover {
            color: #212529;
            border-color: #8f979e;
            background: #f1f3f5;
        }
        .bg-reset-btn:active {
            background: #e9ecef;
        }
        /* 深色底时正文区的次要文字/分隔线跟随底色（侧边栏已在 applyBg 中单独推导配色）*/
        body.reader-dark .reader-main .text-muted { color: #9aa0a6 !important; }
        body.reader-dark .reader-main .chapter-divider { border-top-color: #4b4f55; }
        body.reader-dark .reader-main .tts-toolbar { background: #33363a; border-color: #4b4f55; }
        /* 深色底上 Bootstrap 的 outline-secondary 只有 ~2.5:1 对比度，提亮到可辨识 */
        body.reader-dark .reader-main .btn-outline-secondary {
            color: #c9ccd1;
            border-color: #71767d;
        }
        /* 章节旁的播放/停止按钮同理（primary/danger 深色底上也偏暗） */
        body.reader-dark .reader-main .tts-chapter-btn.btn-outline-primary { color: #8ab4ff; border-color: #4a6ea8; }
        body.reader-dark .reader-main .tts-chapter-btn.btn-outline-danger { color: #ff9b9b; border-color: #8d4a4a; }
        body.reader-dark .reader-main .tts-next-hint { color: #9aa0a6; }
        /* 收听条在深色底上：分隔虚线提亮、悬停用白色半透明（黑色半透明在这底上等于消失） */
        body.reader-dark .reader-main .tts-detail { border-top-color: #4b4f55; }
        body.reader-dark .reader-main .tts-toggle:hover { background: rgba(255, 255, 255, 0.07); }
        body.reader-dark .reader-main .tts-resume { background: #26364a; color: #a8c7ea; }
        @media (max-width: 768px) {
            .reader-sidebar { transform: translateX(-100%); }
            .reader-sidebar.show-mobile { transform: translateX(0); }
            /* 手机上左右各 48px 的 padding 吃掉了四分之一屏宽（390 屏正文只剩 294）。
               收到 16px；顶部 52px 是给浮在左上角的两个按钮让位（横排后只占一行高）。 */
            .reader-main { margin-left: 0; max-width: 100%; padding: 3.25rem 1rem 3rem; }
            .toggle-btn { left: 10px !important; }
            /* 配色按钮与 ☰ 并排横放：原来是往下叠一个，正文顶部要空出 110px 才躲得开 */
            .bg-fab { top: 10px !important; left: 58px !important; }
        }
    </style>
</head>
<body x-data="readerApp()" x-init="initTts(); initBg(); boot()">

    <button class="btn btn-sm toggle-btn"
            :class="{ 'shifted': sidebarOpen && window.innerWidth > 768,
                      'btn-outline-light': isDarkBg(bgColor), 'btn-outline-dark': !isDarkBg(bgColor) }"
            @click="sidebarOpen = !sidebarOpen">
        <i class="bi bi-list"></i>
    </button>

    <!-- 阅读背景色：贴在折叠按钮下方，收起侧边栏后也能一键换底色 -->
    <div class="bg-fab" :class="{ 'shifted': sidebarOpen && window.innerWidth > 768 }"
         @click.outside="bgPanelOpen = false">
        <button class="btn btn-sm" title="阅读背景色（护眼配色）"
                :class="{ 'btn-outline-light': isDarkBg(bgColor), 'btn-outline-dark': !isDarkBg(bgColor) }"
                @click="bgPanelOpen = !bgPanelOpen">
            <i class="bi bi-palette"></i>
        </button>
        <div class="bg-popover" x-show="bgPanelOpen" x-cloak>
            <div class="small text-muted mb-2"><i class="bi bi-eye"></i> 护眼背景色</div>
            <div class="row g-2">
                <template x-for="p in bgPresets" :key="p.name">
                    <div class="col-4">
                        <div class="bg-swatch" :class="{ 'active': p.bg === bgColor }"
                             :style="'background:' + p.bg + ';color:' + p.fg"
                             :title="p.name + ' — ' + p.desc"
                             @click="applyBg(p)"
                             x-text="p.name"></div>
                    </div>
                </template>
            </div>
            <div class="bg-reset-row" x-show="bgColor !== '#ffffff'">
                <button type="button" class="btn btn-sm w-100 bg-reset-btn"
                        @click="applyBg(bgPresets[0])">
                    <i class="bi bi-arrow-counterclockwise"></i> 恢复默认（纯白）
                </button>
            </div>
        </div>
    </div>

    <aside class="reader-sidebar"
           :class="{ 'collapsed': !sidebarOpen, 'show-mobile': sidebarOpen }">
        <div class="mb-3 mt-4">
            <a :href="'/projects/' + projectId" class="btn btn-sm btn-side w-100">
                <i class="bi bi-arrow-left"></i> 返回项目
            </a>
        </div>
        <h6 class="text-muted mb-2">
            <span x-show="booting" class="sc-skel" style="width:7rem;"></span>
            <span x-show="!booting" x-text="projectTitle"></span>
        </h6>
        <!-- 目录骨架：书目/分卷要等引导数据，空着会比正文晚一步才「长出来」 -->
        <div x-show="booting">
            <span class="sc-skel sc-skel-line"></span>
            <span class="sc-skel sc-skel-line w-75"></span>
            <span class="sc-skel sc-skel-line"></span>
            <span class="sc-skel sc-skel-line w-50"></span>
        </div>
        <div class="small text-muted mb-2" x-show="author" x-cloak
             x-text="'作者：' + author"></div>
        <hr>
        <!-- 全部折叠/展开 -->
        <button class="btn btn-sm btn-side w-100 mb-2" x-show="hasCollapsibleGroups" x-cloak
                @click="toggleAllGroups()">
            <i class="bi" :class="allGroupsExpanded ? 'bi-chevron-contract' : 'bi-chevron-expand'"></i>
            <span x-text="allGroupsExpanded ? '全部折叠' : '全部展开'"></span>
        </button>
        <!-- Volume-grouped TOC -->
        <nav x-show="volumes.length > 0" x-cloak>
            <template x-for="vol in volumes" :key="vol.volumeNumber">
                <div>
                    <div class="toc-volume-header" @click="toggleVolume(vol.volumeNumber)">
                        <i class="bi" :class="openVolumes.includes(vol.volumeNumber) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                        <span x-text="'第' + vol.volumeNumber + '卷 ' + (vol.title || '')"></span>
                    </div>
                    <div class="toc-volume-chapters" x-show="openVolumes.includes(vol.volumeNumber)">
                        <template x-for="chapter in chaptersInVolume(vol)" :key="chapter.number">
                            <a :href="'#chapter-' + chapter.number"
                               x-text="'第' + chapter.number + '章 ' + (chapter.title || '')"
                               class="toc-link"
                               @click="if(window.innerWidth <= 768) sidebarOpen = false">
                            </a>
                        </template>
                        <!-- Side stories attached to this volume -->
                        <template x-for="ss in sideStoriesForVolume(vol.volumeNumber)" :key="ss.id">
                            <div>
                                <div class="toc-volume-header toc-sub" @click="toggleSideStory(ss.id)">
                                    <i class="bi" :class="openSideStories.includes(ss.id) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                                    <span x-text="'番外: ' + ss.title"></span>
                                </div>
                                <div class="toc-volume-chapters" x-show="openSideStories.includes(ss.id)">
                                    <template x-for="ch in ss.chapters" :key="ch.id">
                                        <a :href="'#side-story-' + ss.id + '-ch-' + ch.number"
                                           x-text="'第' + ch.number + '章 ' + (ch.title || '')"
                                           class="toc-link"
                                           @click="if(window.innerWidth <= 768) sidebarOpen = false">
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

    <script src="/vendor/alpinejs/cdn.min.js" defer></script>
    <script>
    /*
     * 引导数据：**异步**拉取。
     * 全文阅读页的 payload 是整本书的正文（几百 KB 很常见），原来用同步 XHR 时
     * 浏览器要一直停在这里等：HTML 解析、样式计算、首次绘制全被卡住，网速慢就是整页白屏。
     * 现在先渲染骨架屏（x-show="booting"），正文数据到了再由 boot() 铺进来。
     */
    window.__READER_DATA__ = null;
    window.loadReaderData = function () {
        if (window.__readerDataPromise) return window.__readerDataPromise;
        var m = window.location.pathname.match(/\/projects\/(\d+)\/read/);
        var pid = m ? m[1] : null;
        var empty = { projectId: pid, projectTitle: '', author: '', volumes: [], chapters: [], sideStories: [] };
        if (!pid) {
            window.__READER_DATA__ = empty;
            return Promise.resolve(empty);
        }
        window.__readerDataPromise = fetch('/api/projects/' + pid + '/read-data',
                { headers: { 'Accept': 'application/json' } })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (d) {
                window.__READER_DATA__ = d || empty;
                return window.__READER_DATA__;
            })
            .catch(function (e) {
                // 失败不该让页面坏死：退化成空书，至少能看到「暂无章节内容」
                console.error('reader bootstrap failed: ' + e.message);
                window.__READER_DATA__ = empty;
                return empty;
            });
        return window.__readerDataPromise;
    };
    </script>
    <script>
    function readerApp() {
        // projectId 同步从路径取：侧栏「返回项目」等链接不必等正文数据
        const m = window.location.pathname.match(/\/projects\/(\d+)\/read/);
        const pathPid = m ? Number(m[1]) : null;
        // 组件内部很多方法直接用闭包里的 projectId（TTS / 导出链接 / localStorage key），
        // 这里保持同名，避免异步改造后变成 ReferenceError
        const projectId = pathPid;
        return {
            // 正文数据还在路上：骨架屏先顶上
            booting: true,
            projectId: pathPid,
            projectTitle: '',
            author: '',
            sidebarOpen: window.innerWidth > 768,
            volumes: [],
            chapters: [],
            openVolumes: [],
            sideStoriesData: [],
            openSideStories: [],

            /**
             * 引导数据是异步的：await 之后再把书目/正文铺进来。
             * 失败时 loadReaderData 内部已兜成空书，页面仍可用（显示空态）。
             */
            async boot() {
                const d = (typeof window.loadReaderData === 'function')
                    ? await window.loadReaderData()
                    : (window.__READER_DATA__ || {});
                this.projectId = d.projectId || this.projectId;
                this.projectTitle = d.projectTitle || '';
                this.author = d.author || '';
                this.volumes = d.volumes || [];
                this.chapters = d.chapters || [];
                this.sideStoriesData = d.sideStories || [];
                this.initVolumes();
                if (this.projectTitle) document.title = this.projectTitle + ' - 全文阅读';
                // ★ 数据铺完才收骨架，否则空书会把用户的滚动/展开状态冲掉
                this.booting = false;
                // 番外块要插到所属分卷末章后面：等 DOM 渲染出来再挪一次
                this.$nextTick(() => {
                    if (typeof window.repositionSideStoryBlocks === 'function') {
                        window.repositionSideStoryBlocks(this.volumes);
                    }
                });
            },
            initVolumes() {
                const hash = window.location.hash;
                const match = hash.match(/chapter-(\d+)/);
                const targetChapter = match ? parseInt(match[1]) : null;
                if (targetChapter && this.volumes.length > 0) {
                    const vol = this.volumes.find(v => Array.isArray(v.chapterNumbers)
                        ? v.chapterNumbers.indexOf(targetChapter) >= 0
                        : (targetChapter >= v.chapterStart && targetChapter <= v.chapterEnd));
                    this.openVolumes = vol ? [vol.volumeNumber] : [this.volumes[0].volumeNumber];
                } else if (this.volumes.length > 0) {
                    this.openVolumes = [this.volumes[0].volumeNumber];
                }
            },
            get hasCollapsibleGroups() {
                return (this.volumes && this.volumes.length > 0) ||
                       (this.sideStoriesData && this.sideStoriesData.length > 0);
            },
            get allGroupsExpanded() {
                const volsOk = !this.volumes || this.volumes.length === 0 ||
                    this.volumes.every(v => this.openVolumes.includes(v.volumeNumber));
                const ssOk = !this.sideStoriesData || this.sideStoriesData.length === 0 ||
                    this.sideStoriesData.every(ss => this.openSideStories.includes(String(ss.id)));
                return volsOk && ssOk;
            },
            toggleAllGroups() {
                if (this.allGroupsExpanded) {
                    this.openVolumes = [];
                    this.openSideStories = [];
                } else {
                    this.openVolumes = this.volumes.map(v => v.volumeNumber);
                    this.openSideStories = this.sideStoriesData.map(ss => String(ss.id));
                }
            },
            toggleVolume(volNum) {
                const idx = this.openVolumes.indexOf(volNum);
                if (idx >= 0) this.openVolumes.splice(idx, 1);
                else this.openVolumes.push(volNum);
            },
            toggleSideStory(ssId) {
                const id = String(ssId);
                const idx = this.openSideStories.indexOf(id);
                if (idx >= 0) this.openSideStories.splice(idx, 1);
                else this.openSideStories.push(id);
            },
            // 优先用后端下发的 chapterNumbers（支持用户在「分卷管理」里手工调整过的不连续归属），
            // 缺失时才退回 chapterStart~chapterEnd 范围过滤（兼容旧数据）。
            chaptersInVolume(vol) {
                if (Array.isArray(vol.chapterNumbers)) {
                    const set = new Set(vol.chapterNumbers);
                    return this.chapters.filter(c => set.has(c.number));
                }
                return this.chapters.filter(c => c.number >= vol.chapterStart && c.number <= vol.chapterEnd);
            },
            sideStoriesForVolume(volNum) {
                if (volNum === null) {
                    return this.sideStoriesData.filter(ss => ss.attachedVolume == null);
                }
                return this.sideStoriesData.filter(ss => ss.attachedVolume == volNum);
            },
            tts: {
                configs: [],
                selectedConfigId: null,
                voice: 'alloy',
                speed: 1.0,
                minLen: 10,
                maxLen: 200,
                playing: null,        // 正在播（或暂停中、或播完等续播）的章号
                paused: false,        // 播放中是否暂停；「播完等下一章」的 3 秒空档也算暂停态
                loading: null,        // 正在拉章节切片的章号
                audio: null,
                abortController: null,
                preGeneratedFiles: {},
                autoNextTimer: null,  // 播完 → 下一章的 3 秒定时器
                nextChapter: null,    // 待自动续播的章号（非 null 即处于续播倒计时）
                pauseResolve: null    // 流式播放暂停在切片边界时的唤醒函数
            },
            playlist: {
                isActive: false,
                chapters: [],
                currentIndex: -1,
                paused: false
            },
            playlistResumeOffer: false,
            playlistResumeChapter: '',
            /* 收听设置默认折叠：手机上一行（标题 + 形色摘要 + 全文收听 + 箭头）就够，
               展开才给音色/语速/段落长度/翻章/导出。不持久化 —— 每次进页面都从折叠态开始 */
            ttsOpen: false,
            /* 折叠行右侧的摘要文案：多配置时带上配置名，再给音色和语速 */
            ttsSummary() {
                const parts = [];
                if (this.tts.configs.length > 1) {
                    const cfg = this.tts.configs.find(c => c.id === this.tts.selectedConfigId);
                    if (cfg && cfg.displayName) parts.push(cfg.displayName);
                }
                if (this.tts.voice) parts.push(this.tts.voice);
                parts.push(this.tts.speed + 'x');
                return parts.join(' · ');
            },
            async initTts() {
                try {
                    const res = await fetch(`/projects/${projectId}/tts/configs`);
                    if (res.ok) {
                        this.tts.configs = await res.json();
                        if (this.tts.configs.length > 0) {
                            const defaultConfig = this.tts.configs.find(c => c.isDefault);
                            this.tts.selectedConfigId = defaultConfig ? defaultConfig.id : this.tts.configs[0].id;
                        }
                    }
                } catch (e) {
                    console.warn('Failed to load TTS configs', e);
                }
                this.loadTtsPrefs();
                // Ensure voice is valid for selected config
                const voices = this.getVoiceOptions();
                if (voices.length > 0 && !voices.includes(this.tts.voice)) {
                    this.tts.voice = voices[0];
                }
                // Load pre-generated files
                try {
                    const filesRes = await fetch(`/api/tts-export/projects/${projectId}/completed-files`);
                    if (filesRes.ok) {
                        this.tts.preGeneratedFiles = await filesRes.json();
                    }
                } catch (e) {}
                // Check for saved playlist state
                this.loadPlaylistState();
            },
            loadTtsPrefs() {
                try {
                    const saved = localStorage.getItem('tts_prefs_' + projectId);
                    if (saved) {
                        const prefs = JSON.parse(saved);
                        if (prefs.voice) this.tts.voice = prefs.voice;
                        if (prefs.speed) this.tts.speed = prefs.speed;
                        if (prefs.minLen) this.tts.minLen = prefs.minLen;
                        if (prefs.maxLen) this.tts.maxLen = prefs.maxLen;
                        if (prefs.configId && this.tts.configs.some(c => c.id == prefs.configId)) {
                            this.tts.selectedConfigId = prefs.configId;
                        }
                    }
                } catch (e) {}
            },
            saveTtsPrefs() {
                try {
                    localStorage.setItem('tts_prefs_' + projectId, JSON.stringify({
                        voice: this.tts.voice,
                        speed: this.tts.speed,
                        minLen: this.tts.minLen,
                        maxLen: this.tts.maxLen,
                        configId: this.tts.selectedConfigId
                    }));
                } catch (e) {}
            },
            /* ===== 单章播放控制：停止态 / 播放中 / 暂停中 三态 ===== */
            clearAutoNext() {
                if (this.tts.autoNextTimer) {
                    clearTimeout(this.tts.autoNextTimer);
                    this.tts.autoNextTimer = null;
                }
                this.tts.nextChapter = null;
            },
            pauseChapter() {
                if (this.tts.playing == null) return;
                this.tts.paused = true;
                if (this.playlist.isActive) {
                    this.playlist.paused = true;
                    this.savePlaylistState();
                }
                if (this.tts.audio && !this.tts.audio.paused) {
                    this.tts.audio.pause();
                }
            },
            resumeChapter() {
                this.tts.paused = false;
                if (this.playlist.isActive) {
                    this.playlist.paused = false;
                    this.savePlaylistState();
                }
                // 本章已播完、正在等那 3 秒 ⇒ 直接切下一章，不用把等待熬满
                if (this.tts.nextChapter != null) {
                    this.goNextChapter();
                    return;
                }
                if (this.tts.audio && this.tts.audio.paused && !this.tts.audio.ended) {
                    this.tts.audio.play().catch(() => {});
                } else if (!this.tts.audio && this.tts.pauseResolve == null && this.tts.playing != null) {
                    // 音频已经没了（切后台被回收 / 解码失败）：重播当前章，别让「继续」点了没反应
                    const num = this.tts.playing;
                    this.playChapter(num);
                    return;
                }
                // 流式播放若正卡在切片边界（此刻没有 audio 在播），得唤醒它继续
                if (this.tts.pauseResolve) {
                    const wake = this.tts.pauseResolve;
                    this.tts.pauseResolve = null;
                    wake();
                }
            },
            stopChapter() {
                if (this.playlist.isActive) {
                    this.stopFullListen();
                } else {
                    this.stopAudio();
                }
            },
            /** 流式播放：暂停卡在切片边界时挂起，resumeChapter 负责唤醒 */
            waitIfPaused(signal) {
                if (!this.tts.paused) return Promise.resolve();
                return new Promise(resolve => {
                    this.tts.pauseResolve = resolve;
                    if (signal) {
                        signal.addEventListener('abort', () => {
                            this.tts.pauseResolve = null;
                            resolve();
                        }, { once: true });
                    }
                });
            },
            /** 下一章：全文收听按播放列表顺序；单章连播按「有正文的章节」顺序 */
            nextChapterNumber(num) {
                if (this.playlist.isActive) {
                    const idx = this.playlist.chapters.indexOf(num);
                    return (idx >= 0 && idx < this.playlist.chapters.length - 1)
                        ? this.playlist.chapters[idx + 1] : null;
                }
                const list = (this.chapters || [])
                    .filter(c => c.content && String(c.content).trim())
                    .map(c => c.number);
                const i = list.indexOf(num);
                return (i >= 0 && i < list.length - 1) ? list[i + 1] : null;
            },
            goNextChapter() {
                const next = this.tts.nextChapter;
                this.clearAutoNext();
                if (next == null) return;
                if (this.playlist.isActive) {
                    const idx = this.playlist.chapters.indexOf(next);
                    if (idx >= 0) {
                        this.playlist.currentIndex = idx;
                        this.savePlaylistState();
                    }
                }
                this.playChapter(next);
            },
            /**
             * 一章播完：停 3 秒再自动接下一章（单章连播与全文收听共用这一处）。
             * 这 3 秒里保持「暂停态 + 停止按钮」，用户随时能掐掉续播、也能立刻续播。
             */
            onTtsChapterEnded(num) {
                const next = this.nextChapterNumber(num);
                if (next == null) {
                    // 已经是最后一章：全文收听收摊，单章播放就停在停止态
                    if (this.playlist.isActive) {
                        this.stopFullListen();
                    } else {
                        this.stopAudio();
                    }
                    return;
                }
                this.clearAutoNext();
                this.tts.playing = num;
                this.tts.paused = true;
                this.tts.nextChapter = next;
                this.tts.autoNextTimer = setTimeout(() => this.goNextChapter(), 3000);
            },
            async playChapter(num) {
                this.stopAudio();
                // Check for pre-generated file first
                if (this.tts.preGeneratedFiles && this.tts.preGeneratedFiles[num]) {
                    const abortController = new AbortController();
                    this.tts.abortController = abortController;
                    this.tts.playing = num;
                    const audio = new Audio(this.tts.preGeneratedFiles[num]);
                    this.tts.audio = audio;
                    audio.onended = () => {
                        this.tts.playing = null; this.tts.audio = null;
                        this.onTtsChapterEnded(num);
                    };
                    audio.onerror = () => {
                        this.tts.playing = null; this.tts.audio = null;
                        this.onTtsChapterEnded(num);
                    };
                    abortController.signal.addEventListener('abort', () => audio.pause(), { once: true });
                    audio.play().catch(() => { this.tts.playing = null; this.tts.audio = null; });
                    return;
                }
                const abortController = new AbortController();
                this.tts.abortController = abortController;
                this.tts.loading = num;
                let endedHandled = false;   // catch 与 finally 只能触发一次「本章播完」
                try {
                    // 1. Fetch chunk list
                    const chunksRes = await fetch(`/projects/${projectId}/tts/chapter/${num}/chunks?minLen=${this.tts.minLen}&maxLen=${this.tts.maxLen}`, {
                        signal: abortController.signal
                    });
                    if (!chunksRes.ok) throw new Error('Failed to get chunks');
                    const chunks = await chunksRes.json();

                    // 2. Enter playing state
                    this.tts.loading = null;
                    this.tts.playing = num;

                    // 3. Sequential fetch queue + playback with sliding window
                    const PREFETCH_AHEAD = 15;
                    const audioBlobs = new Map(); // index -> Promise<Blob>
                    const fetchQueue = [];        // indices waiting to be fetched
                    let fetching = false;

                    // Sequential fetcher: processes queue one at a time
                    const processFetchQueue = async () => {
                        if (fetching) return;
                        fetching = true;
                        while (fetchQueue.length > 0) {
                            if (abortController.signal.aborted) break;
                            const idx = fetchQueue.shift();
                            if (audioBlobs.has(idx)) continue;
                            let resolve;
                            const promise = new Promise(r => { resolve = r; });
                            audioBlobs.set(idx, promise);
                            try {
                                const res = await fetch(`/projects/${projectId}/tts/chunk`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        configId: Number(this.tts.selectedConfigId),
                                        text: chunks[idx],
                                        voice: this.tts.voice,
                                        format: this.getSelectedFormat(),
                                        speed: Number(this.tts.speed)
                                    }),
                                    signal: abortController.signal
                                });
                                if (!res.ok) throw new Error('TTS chunk failed');
                                resolve(await res.blob());
                            } catch (e) {
                                resolve(null);
                                if (e.name !== 'AbortError') throw e;
                            }
                        }
                        fetching = false;
                    };

                    // Enqueue a chunk index for fetching (if not already fetched/queued)
                    const enqueueFetch = (idx) => {
                        if (idx >= chunks.length || audioBlobs.has(idx) || fetchQueue.includes(idx)) return;
                        fetchQueue.push(idx);
                        processFetchQueue();
                    };

                    // Seed initial fetch queue: first PREFETCH_AHEAD+1 chunks
                    for (let p = 0; p < Math.min(PREFETCH_AHEAD + 1, chunks.length); p++) {
                        enqueueFetch(p);
                    }

                    // 4. Play chunks sequentially
                    for (let i = 0; i < chunks.length; i++) {
                        if (abortController.signal.aborted) break;

                        // Wait for this chunk's audio to be fetched
                        const blob = await audioBlobs.get(i);
                        if (!blob || abortController.signal.aborted) break;
                        audioBlobs.delete(i);

                        // 暂停可能落在两个切片之间（上一段已 ended、下一段还没开始）：
                        // 不在这里挂一下，paused 期间照样会继续播下一段
                        await this.waitIfPaused(abortController.signal);
                        if (abortController.signal.aborted) break;

                        const audioUrl = URL.createObjectURL(blob);
                        const audio = new Audio(audioUrl);
                        this.tts.audio = audio;

                        await new Promise((resolve, reject) => {
                            audio.onended = () => { URL.revokeObjectURL(audioUrl); resolve(); };
                            audio.onerror = () => { URL.revokeObjectURL(audioUrl); reject(new Error('Audio playback error')); };
                            const onAbort = () => {
                                audio.pause();
                                URL.revokeObjectURL(audioUrl);
                                resolve();
                            };
                            abortController.signal.addEventListener('abort', onAbort, { once: true });
                            audio.play().catch(reject);
                        });

                        // After playback finishes, enqueue the next chunk beyond the window
                        enqueueFetch(i + PREFETCH_AHEAD + 1);
                    }
                } catch (e) {
                    if (e.name === 'AbortError') {
                        // User cancelled - not an error
                    } else {
                        console.error('TTS playback failed', e);
                        if (this.playlist.isActive) {
                            // 这一章合成失败：全文收听直接跳过，别把整条进度卡死
                            endedHandled = true;
                            this.onTtsChapterEnded(num);
                        } else {
                            alert('语音合成失败: ' + e.message);
                        }
                    }
                } finally {
                    this.tts.loading = null;
                    this.tts.playing = null;
                    this.tts.audio = null;
                    this.tts.abortController = null;
                    this.tts.paused = false;
                    // 正常播完（不是被 abort / 失败分支已处理过）才进入「3 秒后下一章」
                    if (!abortController.signal.aborted && !endedHandled) {
                        this.onTtsChapterEnded(num);
                    }
                }
            },
            // ===== Full Listen (Playlist) =====
            startFullListen() {
                // Build playlist from chapters with content
                const chapterElements = document.querySelectorAll('[id^="chapter-"]');
                const chapters = [];
                chapterElements.forEach(el => {
                    const num = parseInt(el.id.replace('chapter-', ''));
                    if (!isNaN(num)) chapters.push(num);
                });
                if (chapters.length === 0) return;
                this.stopAudio();
                this.playlist.chapters = chapters;
                this.playlist.currentIndex = 0;
                this.playlist.isActive = true;
                this.playlist.paused = false;
                this.savePlaylistState();
                this.playChapter(this.playlist.chapters[0]);
            },
            // 暂停/继续直接复用单章那套：否则「顶部按钮看 tts.audio、章节按钮看 tts.paused」两套状态会打架
            playlistPause() {
                this.pauseChapter();
            },
            playlistResume() {
                this.resumeChapter();
            },
            playlistPrev() {
                if (!this.playlist.isActive || this.playlist.currentIndex <= 0) return;
                this.stopAudio();
                this.playlist.currentIndex--;
                this.playlist.paused = false;
                this.savePlaylistState();
                this.playChapter(this.playlist.chapters[this.playlist.currentIndex]);
            },
            playlistNext() {
                if (!this.playlist.isActive || this.playlist.currentIndex >= this.playlist.chapters.length - 1) return;
                this.stopAudio();
                this.playlist.currentIndex++;
                this.playlist.paused = false;
                this.savePlaylistState();
                this.playChapter(this.playlist.chapters[this.playlist.currentIndex]);
            },
            stopFullListen() {
                this.stopAudio();
                this.playlist.isActive = false;
                this.playlist.chapters = [];
                this.playlist.currentIndex = -1;
                this.playlist.paused = false;
                localStorage.removeItem('tts_playlist_' + projectId);
            },
            savePlaylistState() {
                try {
                    localStorage.setItem('tts_playlist_' + projectId, JSON.stringify({
                        chapters: this.playlist.chapters,
                        currentIndex: this.playlist.currentIndex,
                        currentChapter: this.playlist.chapters[this.playlist.currentIndex],
                        isActive: true
                    }));
                } catch (e) {}
            },
            loadPlaylistState() {
                try {
                    const saved = localStorage.getItem('tts_playlist_' + projectId);
                    if (saved) {
                        const state = JSON.parse(saved);
                        if (state.isActive && state.chapters && state.chapters.length > 0) {
                            this.playlistResumeOffer = true;
                            this.playlistResumeChapter = state.currentChapter || state.chapters[state.currentIndex];
                        }
                    }
                } catch (e) {}
            },
            acceptResume() {
                this.playlistResumeOffer = false;
                try {
                    const saved = JSON.parse(localStorage.getItem('tts_playlist_' + projectId));
                    this.playlist.chapters = saved.chapters;
                    this.playlist.currentIndex = saved.currentIndex;
                    this.playlist.isActive = true;
                    this.playlist.paused = false;
                    this.playChapter(this.playlist.chapters[this.playlist.currentIndex]);
                } catch (e) {
                    this.stopFullListen();
                }
            },
            dismissResume() {
                this.playlistResumeOffer = false;
                localStorage.removeItem('tts_playlist_' + projectId);
            },
            stopAudio() {
                // 先清「续播倒计时 / 暂停态」：否则 abort 触发的 finally 会把下一章又续上
                this.clearAutoNext();
                this.tts.paused = false;
                this.tts.pauseResolve = null;
                if (this.tts.abortController) {
                    this.tts.abortController.abort();
                    this.tts.abortController = null;
                }
                if (this.tts.audio) {
                    this.tts.audio.pause();
                    this.tts.audio = null;
                }
                this.tts.playing = null;
            },
            onConfigChange() {
                // Reset voice to first available from new config
                const voices = this.getVoiceOptions();
                if (voices.length > 0 && !voices.includes(this.tts.voice)) {
                    this.tts.voice = voices[0];
                }
                this.saveTtsPrefs();
            },
            getVoiceOptions() {
                const defaultVoices = ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer'];
                if (!this.tts.selectedConfigId) return defaultVoices;
                const cfg = this.tts.configs.find(c => c.id == this.tts.selectedConfigId);
                if (cfg && cfg.voices) {
                    return cfg.voices.split(',').map(v => v.trim()).filter(v => v);
                }
                return defaultVoices;
            },
            getSelectedFormat() {
                if (!this.tts.selectedConfigId) return 'mp3';
                const cfg = this.tts.configs.find(c => c.id == this.tts.selectedConfigId);
                return (cfg && cfg.format) ? cfg.format : 'mp3';
            },
            exportUrl() {
                return `/tts-export?projectId=${projectId}`;
            },
            // ===== 阅读背景色 =====
            // 每个预设都自带配套文字色，保证对比度；浅色系偏暖/低饱和以降低眩光
            bgPanelOpen: false,
            bgColor: '#ffffff',
            bgPresets: [
                { name: '纯白',   bg: '#ffffff', fg: '#212529', desc: '默认，最亮' },
                { name: '米白',   bg: '#faf7f0', fg: '#2f2b26', desc: '暖白，几乎无眩光' },
                { name: '羊皮纸', bg: '#f6ecd8', fg: '#4a3d28', desc: '仿纸质，长读最舒服' },
                { name: '豆沙绿', bg: '#c7edcc', fg: '#26331f', desc: '经典护眼绿' },
                { name: '薄荷',   bg: '#e2f0e4', fg: '#2c3a2e', desc: '比豆沙绿更轻的淡绿' },
                { name: '淡青',   bg: '#dfeeea', fg: '#25352f', desc: '青绿偏冷，清爽' },
                { name: '淡蓝',   bg: '#e3ecf7', fg: '#262f3b', desc: '冷调，强光环境下舒服' },
                { name: '浅灰',   bg: '#ededed', fg: '#2b2b2b', desc: '中性无色偏' },
                { name: '夜读',   bg: '#26282b', fg: '#c9ccd1', desc: '夜间低亮度' }
            ],
            applyBg(p) {
                this.bgColor = p.bg;
                const root = document.documentElement.style;
                root.setProperty('--reader-bg', p.bg);
                root.setProperty('--reader-fg', p.fg);
                // 侧边栏不透明底，直接复用正文配色推导；深浅两套配色都能自适应：
                //   底色混入 5% 文字色 → 略深/略浅的面板色（白底得 #f3f3f4，夜读底得 #2e3033）
                root.setProperty('--reader-sidebar-bg', this.mixHex(p.bg, p.fg, 0.05));
                root.setProperty('--reader-sidebar-fg', p.fg);
                root.setProperty('--reader-sidebar-muted', this.mixHex(p.fg, p.bg, 0.38));
                root.setProperty('--reader-sidebar-hover', this.mixHex(p.bg, p.fg, 0.10));
                root.setProperty('--reader-sidebar-border', this.mixHex(p.bg, p.fg, 0.16));
                document.body.classList.toggle('reader-dark', this.isDarkBg(p.bg));
                try {
                    localStorage.setItem('reader_bg', JSON.stringify({ bg: p.bg, fg: p.fg }));
                } catch (e) { /* 隐私模式下忽略 */ }
                this.bgPanelOpen = false;
            },
            initBg() {
                let saved = null;
                try { saved = JSON.parse(localStorage.getItem('reader_bg') || 'null'); } catch (e) { saved = null; }
                const p = (saved && this.bgPresets.find(x => x.bg === saved.bg)) || this.bgPresets[0];
                this.applyBg(p);
            },
            /** '#rrggbb' -> [r,g,b]；非法输入返回 null */
            parseHex(hex) {
                const c = String(hex || '').replace('#', '');
                if (!/^[0-9a-fA-F]{6}$/.test(c)) return null;
                return [0, 2, 4].map(i => parseInt(c.substring(i, i + 2), 16));
            },
            /** 按比例混合两色，t 为 b 的占比（0~1）；任一色非法时原样返回 a */
            mixHex(a, b, t) {
                const pa = this.parseHex(a), pb = this.parseHex(b);
                if (!pa || !pb) return a;
                return '#' + [0, 1, 2]
                    .map(i => Math.round(pa[i] * (1 - t) + pb[i] * t).toString(16).padStart(2, '0'))
                    .join('');
            },
            /** 亮度 < 128 视为深色底，用于切换次要文字/工具条配色 */
            isDarkBg(hex) {
                const c = this.parseHex(hex);
                if (!c) return false;
                return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 128;
            }
        };
    }

    // 标题由 boot() 在数据到位后设置（异步引导数据，解析期还拿不到书名）
    </script>
    <script>
    // Reposition side story blocks after their associated volume's last chapter
    // ★ 引导数据改成异步后，这段必须在数据铺完后再跑（原来挂在 DOMContentLoaded 上，
    //   那时 volumes 还是空的，整段会静默不生效）
    window.repositionSideStoryBlocks = function (volumes) {
        volumes = volumes || [];
        const blocks = document.querySelectorAll('.side-story-block');
        blocks.forEach(function(block) {
            const attachedVol = block.dataset.attachedVolume;
            if (!attachedVol || attachedVol === '') return;
            const volNum = parseInt(attachedVol);
            const vol = volumes.find(v => v.volumeNumber === volNum);
            if (!vol) return;
            // Find the h3 element of the volume's last chapter
            // （chapterNumbers 存在时用真实末章，避免段内存在手工调整导致 chapterEnd 不准）
            const lastNum = Array.isArray(vol.chapterNumbers) && vol.chapterNumbers.length
                ? vol.chapterNumbers[vol.chapterNumbers.length - 1]
                : vol.chapterEnd;
            const lastChapterH3 = document.getElementById('chapter-' + lastNum);
            if (!lastChapterH3) return;
            // Navigate up: h3 -> div.d-flex -> div (x-for iteration container)
            const chapterContainer = lastChapterH3.parentElement.parentElement;
            if (chapterContainer) {
                chapterContainer.after(block);
            }
        });
    };
    </script>
