<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('教学', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="mb-4">
        <h3><i class="bi bi-mortarboard"></i> 教学模块</h3>
        <p class="text-muted">通过互动动画和语音帮助学习基础知识</p>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm" style="cursor: pointer;" onclick="window.location.href='/learn/multiplication'" th:onclick="'window.location.href=\'' + @{/learn/multiplication} + '\''">
                <div class="card-body text-center position-relative">
                    <a th:href="@{/learn/multiplication/settings}" class="position-absolute top-0 end-0 m-2 text-muted" title="音频设置" onclick="event.stopPropagation();">
                        <i class="bi bi-gear fs-5"></i>
                    </a>
                    <div class="my-3">
                        <i class="bi bi-grid-3x3 display-1 text-primary"></i>
                    </div>
                    <h5 class="card-title">九九乘法口诀</h5>
                    <p class="card-text text-muted">10×10方格动画演示每个乘法口诀的数量关系，配合语音同步播放</p>
                    <a th:href="@{/learn/multiplication}" class="btn btn-primary" onclick="event.stopPropagation();">
                        <i class="bi bi-play-circle"></i> 开始学习
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
