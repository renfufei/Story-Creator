<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="mb-0"><a th:href="@{/projects/{id}(id=${project.id})}" class="text-decoration-none text-dark" th:text="${project.title}">项目名</a></h4>
        <div class="d-flex gap-2">
            <a th:href="@{/projects/{id}/read(id=${project.id})}" class="btn btn-sm btn-outline-success" target="_blank">
                <i class="bi bi-book"></i> 全文阅读
            </a>
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-download"></i> 导出
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/projects/{id}/export?format=markdown(id=${project.id})}"><i class="bi bi-filetype-md me-2"></i>Markdown (.md)</a></li>
                    <li><a class="dropdown-item" th:href="@{/projects/{id}/export?format=txt(id=${project.id})}"><i class="bi bi-file-text me-2"></i>纯文本 (.txt)</a></li>
                    <li><a class="dropdown-item" th:href="@{/projects/{id}/export?format=pdf(id=${project.id})}"><i class="bi bi-filetype-pdf me-2"></i>PDF (.pdf)</a></li>
                    <li><a class="dropdown-item" th:href="@{/projects/{id}/export?format=epub(id=${project.id})}"><i class="bi bi-book me-2"></i>电子书 (.epub)</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" th:href="@{/projects/{id}/export?format=json(id=${project.id})}"><i class="bi bi-filetype-json me-2"></i>完整备份 (.json)</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" th:href="@{/tts-export(projectId=${project.id})}"><i class="bi bi-music-note-beamed me-2"></i>导出MP3</a></li>
                </ul>
            </div>
            <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil-square"></i> 编辑项目
            </a>
        </div>
    </div>

    <!-- Step Navigation (clickable, reactive) -->
    <div class="workflow-steps mb-0">
        <template x-for="(s, idx) in stepList" :key="s.name">
            <a class="workflow-step text-decoration-none"
               :class="s.name === autoRunActiveStep ? 'active' : (s.order < autoRunActiveOrder ? 'completed' : '')"
               :href="'/projects/' + projectId + '/workflow?step=' + s.name">
                <div class="step-number" x-text="idx + 1"></div>
                <div class="small" x-text="s.label"></div>
            </a>
        </template>
    </div>

    <!-- Full Auto Mode Control Bar -->
    <template x-if="autoMode">
        <div class="alert mb-0 mt-2 py-2"
             :class="fullAutoRunning ? 'alert-info' : (fullAutoError ? 'alert-danger' : 'alert-secondary')">
            <div class="d-flex justify-content-between align-items-center">
                <span>
                    <template x-if="!fullAutoRunning && !fullAutoError">
                        <span><i class="bi bi-lightning"></i> 全自动模式已开启</span>
                    </template>
                    <template x-if="fullAutoRunning">
                        <span><span class="spinner-border spinner-border-sm me-1"></span> <span x-text="fullAutoStatus"></span></span>
                    </template>
                    <template x-if="!fullAutoRunning && fullAutoError">
                        <span><i class="bi bi-exclamation-triangle"></i> 出错: <span x-text="fullAutoError"></span></span>
                    </template>
                </span>
                <div class="d-flex gap-2">
                    <button x-show="!fullAutoRunning" class="btn btn-sm btn-outline-secondary" @click="openWorkflowStateModal()">
                        <i class="bi bi-gear"></i> 设置工作流状态
                    </button>
                    <button x-show="!fullAutoRunning" class="btn btn-sm btn-primary" @click="startFullAuto()">
                        <i class="bi bi-play-fill"></i> 开始全自动创作
                    </button>
                    <button x-show="fullAutoRunning" class="btn btn-sm btn-outline-info" @click="openAutoRunStream()">
                        <i class="bi bi-reception-4"></i> 实时显示
                    </button>
                    <button x-show="fullAutoRunning" class="btn btn-sm btn-outline-danger" @click="stopFullAuto()">
                        <i class="bi bi-stop-fill"></i> 停止
                    </button>
                </div>
            </div>
            <div x-show="!fullAutoRunning" class="mt-2" style="font-size:0.85rem;">
                <div class="d-flex align-items-center mb-2">
                    <span class="text-muted me-1">当前策略:</span>
                    <span class="badge bg-primary" x-text="currentStrategyLabel()"></span>
                </div>
                <div class="d-flex flex-nowrap gap-2 overflow-x-auto pb-1">
                    <template x-for="s in stepList" :key="s.name">
                        <div class="border rounded p-2" style="min-width:130px; flex-shrink:0;"
                             :style="isMainStepEnabled(s.name) ? '' : 'opacity:0.5'">
                            <label class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox"
                                       :checked="isMainStepEnabled(s.name)"
                                       @change="toggleStepConfig(s.name, $event.target.checked)">
                                <span class="form-check-label fw-bold" x-text="s.label" style="font-size:0.8rem;"></span>
                            </label>
                            <template x-if="stepPrimaryLabel(s.name) || subStepsForStep(s.name).length > 0">
                                <div class="mt-1 ms-2">
                                    <template x-if="stepPrimaryLabel(s.name)">
                                        <label class="form-check form-switch mb-0 d-block" style="font-size:0.75rem; min-height:1.4rem; opacity:0.5;">
                                            <input class="form-check-input" type="checkbox" style="width:1.6em; height:0.9em;"
                                                   checked disabled>
                                            <span class="form-check-label text-muted" x-text="stepPrimaryLabel(s.name)"></span>
                                        </label>
                                    </template>
                                    <template x-for="sub in subStepsForStep(s.name)" :key="sub">
                                        <label class="form-check form-switch mb-0 d-block" style="font-size:0.75rem; min-height:1.4rem;">
                                            <input class="form-check-input" type="checkbox" style="width:1.6em; height:0.9em;"
                                                   :checked="autoRunStepConfigs[sub] !== false"
                                                   :disabled="!isMainStepEnabled(s.name)"
                                                   @change="toggleStepConfig(sub, $event.target.checked)">
                                            <span class="form-check-label text-muted"
                                                  x-text="AUTO_RUN_STEP_LABELS[sub] || sub"></span>
                                        </label>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>
</th:block>
</body>
</html>
