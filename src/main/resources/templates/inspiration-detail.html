<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('灵感详情', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-lightbulb"></i> <span th:text="${inspiration.title}">标题</span></h2>
            <small class="text-muted">
                所属项目：
                <a class="text-decoration-none" th:href="@{/projects/{id}(id=${project.id})}"
                   th:text="${project.title}">项目名</a>
                <span class="ms-3">
                    <i class="bi bi-clock"></i> 创建于
                    <span th:text="${inspiration.createdAt != null ? #temporals.format(inspiration.createdAt, 'yyyy-MM-dd HH:mm') : ''}">时间</span>
                </span>
                <span class="ms-3" th:if="${inspiration.updatedAt != null}">
                    <i class="bi bi-pencil"></i> 更新于
                    <span th:text="${#temporals.format(inspiration.updatedAt, 'yyyy-MM-dd HH:mm')}">时间</span>
                </span>
            </small>
        </div>
        <a th:href="@{/projects/{id}/inspirations(id=${project.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-list-ul"></i> 灵感列表
        </a>
    </div>

    <div class="alert alert-success py-2" th:if="${message}" th:text="${message}">提示</div>

    <!-- 灵感内容卡片：编辑/删除操作按钮内嵌到卡片底部 -->
    <div class="card">
        <div class="card-body">
            <div th:if="${inspiration.content == null || inspiration.content.isBlank()}"
                 class="text-muted fst-italic">（这条灵感还没有填写内容）</div>
            <div th:unless="${inspiration.content == null || inspiration.content.isBlank()}"
                 style="white-space: pre-wrap; word-break: break-word;"
                 th:text="${inspiration.content}">内容</div>
        </div>
        <div class="card-footer bg-transparent d-flex gap-2">
            <a th:href="@{/projects/{pid}/inspirations/{iid}/edit(pid=${project.id}, iid=${inspiration.id})}"
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil"></i> 编辑
            </a>
            <form th:action="@{/projects/{pid}/inspirations/{iid}/delete(pid=${project.id}, iid=${inspiration.id})}"
                  method="post" class="d-inline"
                  onsubmit="return confirm('确定删除这条灵感？此操作不可撤销。')">
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash"></i> 删除
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
