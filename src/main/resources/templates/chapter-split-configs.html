<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('章节分割配置', ~{::content})}">
<body>
<div th:fragment="content" x-data="splitConfigPage()" x-init="init()">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-scissors"></i> 章节分割配置</h2>
        <button class="btn btn-primary btn-sm" @click="showCreateModal = true">
            <i class="bi bi-plus"></i> 新建配置
        </button>
    </div>

    <!-- Config List -->
    <div class="row g-3">
        <div class="col-12" th:each="config : ${configs}">
            <div class="card">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <strong th:text="${config.name}">名称</strong>
                            <span th:if="${config.builtin}" class="badge bg-secondary"><i class="bi bi-shield-check"></i> 内置</span>
                            <span th:unless="${config.enabled}" class="badge bg-warning">已禁用</span>
                        </div>
                        <small class="text-muted" th:text="${config.description}">描述</small>
                        <div class="mt-1">
                            <code class="small" th:text="${config.pattern}">pattern</code>
                        </div>
                    </div>
                    <div class="d-flex gap-1">
                        <form th:action="@{/settings/chapter-split-configs/{id}/toggle(id=${config.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${config.enabled ? 'btn-outline-warning' : 'btn-outline-success'}"
                                    th:text="${config.enabled ? '禁用' : '启用'}">切换</button>
                        </form>
                        <button th:unless="${config.builtin}" class="btn btn-sm btn-outline-primary"
                                th:data-id="${config.id}" th:data-name="${config.name}"
                                th:data-description="${config.description}" th:data-pattern="${config.pattern}"
                                th:data-titlegroup="${config.titleGroup}" th:data-includematch="${config.includeMatch}"
                                @click="editConfig($el.dataset)">编辑</button>
                        <form th:unless="${config.builtin}" th:action="@{/settings/chapter-split-configs/{id}/delete(id=${config.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('确定删除此配置？')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Panel -->
    <div class="card mt-4">
        <div class="card-header"><strong>正则测试</strong></div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">正则表达式</label>
                <input type="text" class="form-control" x-model="testPattern">
            </div>
            <div class="mb-3">
                <label class="form-label">测试文本</label>
                <textarea class="form-control" rows="4" x-model="testText" placeholder="粘贴小说文本片段..."></textarea>
            </div>
            <button class="btn btn-outline-primary btn-sm" @click="runTest()" :disabled="!testPattern || !testText">测试</button>
            <div x-show="testResultText" class="mt-2 alert alert-info" x-text="testResultText"></div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal fade" :class="{'show d-block': showCreateModal || showEditModal}" tabindex="-1"
         x-show="showCreateModal || showEditModal" @click.self="closeModals()">
        <div class="modal-dialog">
            <div class="modal-content">
                <form :action="showEditModal ? '/settings/chapter-split-configs/' + editId + '/update' : '/settings/chapter-split-configs'" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" x-text="showEditModal ? '编辑配置' : '新建配置'"></h5>
                        <button type="button" class="btn-close" @click="closeModals()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">名称</label>
                            <input type="text" class="form-control" name="name" x-model="formName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <input type="text" class="form-control" name="description" x-model="formDesc">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">正则表达式</label>
                            <input type="text" class="form-control font-monospace" name="pattern" x-model="formPattern" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">标题捕获组索引</label>
                                <input type="number" class="form-control" name="titleGroup" x-model.number="formTitleGroup">
                                <small class="text-muted">-1 表示自动编号</small>
                            </div>
                            <div class="col-6 mb-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="includeMatch" x-model="formIncludeMatch" id="chk-include">
                                    <label class="form-check-label" for="chk-include">包含匹配行到章节内容</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" @click="closeModals()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="modal-backdrop fade show" x-show="showCreateModal || showEditModal" @click="closeModals()"></div>
</div>

<script>
function splitConfigPage() {
    return {
        showCreateModal: false,
        showEditModal: false,
        editId: null,
        formName: '',
        formDesc: '',
        formPattern: '',
        formTitleGroup: 0,
        formIncludeMatch: false,
        testPattern: '',
        testText: '',
        testResultText: '',

        init() {},

        editConfig(data) {
            this.editId = data.id;
            this.formName = data.name;
            this.formDesc = data.description || '';
            this.formPattern = data.pattern;
            this.formTitleGroup = parseInt(data.titlegroup) || 0;
            this.formIncludeMatch = data.includematch === 'true';
            this.showEditModal = true;
        },

        closeModals() {
            this.showCreateModal = false;
            this.showEditModal = false;
            this.formName = '';
            this.formDesc = '';
            this.formPattern = '';
            this.formTitleGroup = 0;
            this.formIncludeMatch = false;
        },

        async runTest() {
            try {
                const resp = await fetch('/settings/chapter-split-configs/test', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pattern: this.testPattern, sampleText: this.testText})
                });
                const data = await resp.json();
                if (data.error) {
                    this.testResultText = '错误: ' + data.error;
                } else {
                    this.testResultText = '匹配 ' + data.matchCount + ' 处: ' + data.matches.join(' | ');
                }
            } catch(e) {
                this.testResultText = '测试失败: ' + e.message;
            }
        }
    };
}
</script>
</body>
</html>
