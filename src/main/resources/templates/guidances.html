<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('创作指导库', ~{::content})}">
<body>
<div th:fragment="content" x-data="guidancePage()">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">创作指导库</h2>
        <div>
            <a th:href="@{/settings}" class="btn btn-outline-secondary btn-sm me-2">
                <i class="bi bi-arrow-left"></i> 返回设置
            </a>
            <button class="btn btn-outline-success btn-sm me-1" @click="doExport()" th:if="${!items.isEmpty()}">
                <i class="bi bi-download"></i> 导出
            </button>
            <button class="btn btn-outline-info btn-sm me-1" @click="$refs.importFile.click()">
                <i class="bi bi-upload"></i> 导入
            </button>
            <button class="btn btn-primary btn-sm" @click="showAdd = true">
                <i class="bi bi-plus"></i> 新建指导
            </button>
        </div>
    </div>

    <!-- Hidden import form -->
    <form th:action="@{/settings/guidances/import}" method="post" enctype="multipart/form-data" x-ref="importForm" style="display:none;">
        <input type="file" name="file" accept=".json" x-ref="importFile" @change="$refs.importForm.submit()">
    </form>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Add Form -->
    <div class="card mb-4" x-show="showAdd" x-cloak>
        <div class="card-body">
            <form th:action="@{/settings/guidances}" method="post">
                <div class="row g-2 mb-2">
                    <div class="col-md-4">
                        <label class="form-label small mb-1">名称</label>
                        <input type="text" class="form-control form-control-sm" name="name" required placeholder="指导名称">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small mb-1">步骤</label>
                        <select class="form-select form-select-sm" name="step" required>
                            <option th:each="s : ${steps}" th:value="${s.name()}" th:text="${s.displayName}">步骤</option>
                        </select>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label small mb-1">指导内容</label>
                    <textarea class="form-control form-control-sm" name="guidance" rows="4" placeholder="创作指导内容..."></textarea>
                </div>
                <button type="submit" class="btn btn-sm btn-primary">创建</button>
                <button type="button" class="btn btn-sm btn-secondary" @click="showAdd = false">取消</button>
            </form>
        </div>
    </div>

    <!-- List -->
    <div class="card">
        <div class="card-header">
            <strong><i class="bi bi-journal-text"></i> 指导列表</strong>
            <small class="text-muted ms-2">可从工作流页面"存为通用"按钮快速保存，也可在此手动管理</small>
        </div>
        <div class="card-body p-0">
            <div th:if="${items.isEmpty()}" class="p-3">
                <p class="text-muted small mb-0">暂无创作指导。可在工作流页面中将某步骤的创作指导存为通用，或点击"新建指导"创建。</p>
            </div>
            <table th:if="${!items.isEmpty()}" class="table table-sm table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" class="form-check-input" @change="toggleAll($event.target.checked)"
                                   :checked="selectedIds.length === allIds.length && allIds.length > 0">
                        </th>
                        <th>名称</th>
                        <th style="width: 120px;">步骤</th>
                        <th style="width: 200px;">内容预览</th>
                        <th style="width: 160px;">更新时间</th>
                        <th style="width: 140px;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td>
                            <input type="checkbox" class="form-check-input item-checkbox"
                                   :value="'[[${item.id}]]'" th:attr="data-id=${item.id}"
                                   @change="toggleItem($event.target.dataset.id, $event.target.checked)"
                                   :checked="selectedIds.includes(String($el.dataset.id))">
                        </td>
                        <td><strong th:text="${item.name}">名称</strong></td>
                        <td><span class="badge bg-info" th:text="${item.step.displayName}">步骤</span></td>
                        <td class="text-muted small text-truncate" style="max-width: 200px;"
                            th:text="${item.guidance != null ? #strings.abbreviate(item.guidance, 50) : ''}">预览</td>
                        <td class="small text-muted" th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')}">时间</td>
                        <td>
                            <a th:href="@{/settings/guidances/{id}/edit(id=${item.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="编辑">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/settings/guidances/{id}/delete(id=${item.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('确定删除此创作指导？')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
    function guidancePage() {
    const allIds = (/*[[${itemIds}]]*/ []).map(String);
    return {
        showAdd: false,
        allIds: allIds,
        selectedIds: [...allIds],
        toggleAll(checked) {
            this.selectedIds = checked ? [...this.allIds] : [];
        },
        toggleItem(id, checked) {
            id = String(id);
            if (checked) {
                if (!this.selectedIds.includes(id)) this.selectedIds.push(id);
            } else {
                this.selectedIds = this.selectedIds.filter(i => i !== id);
            }
        },
        async doExport() {
            if (this.selectedIds.length === 0) {
                alert('请至少选择一个指导条目');
                return;
            }
            try {
                const resp = await fetch('/settings/guidances/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.selectedIds.map(Number))
                });
                if (!resp.ok) {
                    alert('导出失败');
                    return;
                }
                const blob = await resp.blob();
                const disposition = resp.headers.get('Content-Disposition');
                let filename = 'guidances-export.json';
                if (disposition) {
                    const match = disposition.match(/filename=(.+)/);
                    if (match) filename = match[1];
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('导出失败: ' + e.message);
            }
        }
        };
    }
    </script>
</div>
</body>
</html>
