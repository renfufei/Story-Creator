<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.title} + ' - 章节透视'">章节透视</title>
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/css/bootstrap-icons.min.css}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <style>
        body { margin: 0; }
        .inspect-sidebar {
            width: 240px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            padding: 1rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .inspect-sidebar.collapsed { transform: translateX(-100%); }
        .inspect-main {
            margin-left: 240px;
            padding: 1.5rem 2rem;
            transition: margin-left 0.3s ease;
        }
        .inspect-main.expanded { margin-left: 0; }
        .toggle-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1100;
            transition: left 0.3s ease;
        }
        .toggle-btn.shifted { left: 250px; }
        .toc-link {
            display: block;
            padding: 0.25rem 0.5rem;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .toc-link:hover { background: #e9ecef; }
        .toc-link.active { background: #0d6efd; color: #fff; }
        .volume-title { font-size: 0.75rem; color: #6c757d; padding: 0.5rem 0.5rem 0.15rem; font-weight: 600; }
        .field-content { white-space: pre-wrap; max-height: 65vh; overflow-y: auto; font-size: 0.9rem; line-height: 1.7; }
        .tab-badge { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 4px; }
        .tab-badge.available { background: #198754; }
        .nav-link.disabled { opacity: 0.5; }
        .compare-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .compare-container > div { border: 1px solid #dee2e6; border-radius: 4px; padding: 1rem; max-height: 65vh; overflow-y: auto; }
    </style>
</head>
<body x-data="inspectChapter()" x-init="init()">
    <!-- Toggle Button -->
    <button class="btn btn-sm btn-outline-secondary toggle-btn"
            :class="sidebarOpen ? 'shifted' : ''"
            @click="sidebarOpen = !sidebarOpen">
        <i class="bi" :class="sidebarOpen ? 'bi-chevron-left' : 'bi-list'"></i>
    </button>

    <!-- Sidebar -->
    <aside class="inspect-sidebar" :class="!sidebarOpen ? 'collapsed' : ''">
        <div class="mb-3">
            <a th:href="@{/projects/{id}/inspect(id=${project.id})}" class="btn btn-sm btn-outline-secondary w-100 mb-2">
                <i class="bi bi-arrow-left"></i> 返回总览
            </a>
            <small class="text-muted" th:text="${project.title}">项目名</small>
        </div>
        <hr>
        <nav>
            <th:block th:each="ch : ${chapterMetas}">
                <div th:if="${ch.get('volumeTitle') != null}" class="volume-title"
                     th:attr="data-vol=${ch.get('volumeNumber')}"
                     th:text="${ch.get('volumeTitle')}">卷标题</div>
                <a class="toc-link"
                   th:class="${ch.get('number') == chapterNum} ? 'toc-link active' : 'toc-link'"
                   th:href="@{/projects/{pid}/inspect/chapters/{n}(pid=${project.id}, n=${ch.get('number')})}"
                   th:text="'第' + ${ch.get('number')} + '章 ' + (${ch.get('title') ?: ''})">章节</a>
            </th:block>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="inspect-main" :class="!sidebarOpen ? 'expanded' : ''">
        <!-- Breadcrumb + Navigation -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/projects/{id}/inspect(id=${project.id})}">创作透视</a></li>
                    <li class="breadcrumb-item active" th:text="'第' + ${chapterNum} + '章 ' + ${chapterTitle}">章节</li>
                </ol>
            </nav>
            <div class="d-flex gap-2">
                <a th:if="${prevNum}" th:href="@{/projects/{pid}/inspect/chapters/{n}(pid=${project.id}, n=${prevNum})}"
                   class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-left"></i> 上一章</a>
                <a th:if="${nextNum}" th:href="@{/projects/{pid}/inspect/chapters/{n}(pid=${project.id}, n=${nextNum})}"
                   class="btn btn-sm btn-outline-secondary">下一章 <i class="bi bi-chevron-right"></i></a>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs" role="tablist">
            <template x-for="tab in tabs" :key="tab.field">
                <li class="nav-item">
                    <button class="nav-link"
                            :class="{ active: activeTab === tab.field, disabled: !tab.available }"
                            :disabled="!tab.available"
                            @click="switchTab(tab.field)"
                            x-text="tab.label">
                    </button>
                </li>
            </template>
        </ul>

        <!-- Tab Content -->
        <div class="border border-top-0 rounded-bottom p-3" style="min-height:200px;">
            <!-- Loading -->
            <div x-show="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">加载中...</p>
            </div>

            <!-- Content -->
            <div x-show="!loading">
                <!-- Compare mode for contentDraft -->
                <template x-if="activeTab === 'contentDraft' && cache['contentDraft'] && cache['content']">
                    <div>
                        <div class="compare-container">
                            <div>
                                <h6 class="text-muted mb-2">润色前原稿</h6>
                                <pre class="field-content mb-0" x-text="cache['contentDraft']?.content || '无数据'"></pre>
                            </div>
                            <div>
                                <h6 class="text-muted mb-2">最终正文</h6>
                                <pre class="field-content mb-0" x-text="cache['content']?.content || '无数据'"></pre>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- JSON table for characterStates -->
                <template x-if="activeTab === 'characterStates' && cache['characterStates']?.type === 'json'">
                    <div>
                        <div x-html="renderCharacterStatesTable()"></div>
                    </div>
                </template>

                <!-- Regular text display -->
                <template x-if="activeTab !== 'contentDraft' && !(activeTab === 'characterStates' && cache[activeTab]?.type === 'json')">
                    <div>
                        <pre class="field-content" x-text="cache[activeTab]?.content || '无数据'"></pre>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:inline="javascript">
        window.__inspectData = {
            projectId: [[${project.id}]],
            chapterNum: [[${chapterNum}]],
            fieldAvail: [[${fieldAvail}]]
        };
    </script>
    <script th:src="@{/js/inspect-chapter.js}"></script>
    <script th:src="@{/vendor/alpinejs/cdn.min.js}" defer></script>
</body>
</html>
