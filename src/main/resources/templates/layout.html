<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - AI故事创作'">AI故事创作</title>
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/css/bootstrap-icons.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-book"></i> AI故事创作
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/chat}"><i class="bi bi-chat-dots"></i> 聊天</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tts-export}">语音导出</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/learn}">教学</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">项目列表</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">设置</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/settings}">AI模型配置</a></li>
                        <li><a class="dropdown-item" th:href="@{/prompts}">流程模板配置</a></li>
                        <li><a class="dropdown-item" th:href="@{/settings/tts-templates}">TTS替换模板</a></li>
                        <li><a class="dropdown-item" th:href="@{/settings/guidances}">创作指导库</a></li>
                        <li><a class="dropdown-item" th:href="@{/settings/materials}">素材库</a></li>
                        <li><a class="dropdown-item" th:href="@{/settings/chapter-split-configs}">章节分割配置</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container py-4">
        <div th:replace="${content}"></div>
    </main>

    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/alpinejs/cdn.min.js}" defer></script>
</body>
</html>
